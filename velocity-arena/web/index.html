<style>
/* Layout: full-screen 3D canvas with an arcade HUD; menus float as glass panels on the left. Single dark look by design. */

[hidden] { display: none !important; }

  overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(8px); z-index: 20;
}
.brand { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 42px); letter-spacing: 0.02em; line-height: 1; }
.brand span { color: var(--cyan); }
.tag { font-family: var(--display); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
h2 { font-family: var(--display); font-size: 20px; margin: 4px 0 0; text-wrap: balance; }
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(30, 44, 80, 0.55);
  cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.02em; text-align: left;
}
.btn:hover, .btn:focus-visible { border-color: var(--cyan); outline: none; background: rgba(40, 70, 120, 0.7); }
.btn.primary { background: linear-gradient(90deg, #1257d6, #0aa6d8); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.on { border-color: var(--cyan); background: rgba(10, 150, 210, 0.25); }
.btn small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--dim); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); letter-spacing: 0.04em; }
input[type=text], select { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 15px; }

.note { font-size: 13px; color: var(--dim); line-height: 1.45; margin: 0; }
.code { font-family: var(--display); font-size: 30px; letter-spacing: 0.12em; color: var(--gold); }

.item b { font-family: var(--display); }

.car b { font-family: var(--display); font-size: 15px; }

#loading i b { display: block; height: 100%; width: 0; background: var(--cyan); transition: width 0.2s; }

#touch { position: fixed; inset: 0; z-index: 12; pointer-events: none; }

    h("p", { class: "note", text: "Hitbox " + (v.hb.z * 2).toFixed(2) + " × " + (v.hb.x * 2).toFixed(2) + " × " + (v.hb.y * 2).toFixed(2) + " m · rueda " + v.R.toFixed(2) + " m" + (models[myVeh] ? "" : " · modelo cargando…") }),
    btn("Listo", "", mainMenu, true)], "garage");

function settingsMenu() {

    btn("Medidor de rendimiento: " + (showPerf ? "sí" : "no"), "F3", () => { showPerf = !showPerf; store.set("perf", showPerf ? "1" : "0"); document.getElementById("perf").hidden = !showPerf; settingsMenu(); }),

function soloMenu() {
  showPanel([h("h2", { text: "Jugar contra bots" }), sel("ts", "Formato", [[1, "1 contra 1"], [2, "2 contra 2"], [3, "3 contra 3"], [4, "4 contra 4"]], 2), sel("mn", "Duración", [[3, "3 minutos"], [5, "5 minutos"], [10, "10 minutos"]], 5),
    btn("Empezar", "", () => { leaveRoom(); const ts = +document.getElementById("ts").value; const vh = []; for (let i = 0; i < ts * 2; i++) vh.push(i === 0 ? myVeh : VEH_IDS[(i + 1) % 3]); newGame("offline", ts, +document.getElementById("mn").value, true, vh); game.myCar = 0; slotsActive(); hidePanel(); beep(660, 0.1); }, true), btn("Volver", "", mainMenu)]);
}
function createRoomMenu() {
  if (!roomApi) { showPanel([h("h2", { text: "Sin conexión con Claude" }), h("p", { class: "note", text: "Esta vista no puede conectarse a salas en tiempo real (sesión no iniciada o enlace público). Puedes jugar solo contra bots." }), btn("Volver", "", mainMenu)]); return; }
  showPanel([h("h2", { text: "Crear sala" }), sel("ts", "Formato", [[1, "1 contra 1"], [2, "2 contra 2"], [3, "3 contra 3"], [4, "4 contra 4"]], 2), sel("mn", "Duración", [[3, "3 minutos"], [5, "5 minutos"], [10, "10 minutos"]], 5),
    sel("bt", "Huecos libres", [["1", "Rellenar con bots"], ["0", "Dejar vacíos"]], "1"), sel("tm", "Tu equipo", [[0, "Azul"], [1, "Naranja"]], 0), btn("Crear y entrar", "", hostRoom, true), btn("Volver", "", mainMenu)]);

  if (game.mode === "host") nodes.push(h("div", { class: "code", text: game.code }), h("p", { class: "note", text: "Pasa este código a tus amigos. Al entrar, ocupan el lugar de un bot." }), copyBtn(game.code));

  nodes.push(btn("Gráficos y ajustes", PRESETS[presetId].label, settingsMenu), btn("Salir al menú", "", () => { leaveRoom(); endGame(); mainMenu(); }), btn("Seguir jugando", "Esc", hidePanel));

function teamsView() {
  const t0 = h("div", { class: "team t0" }, [h("b", { text: "AZUL" })]), t1 = h("div", { class: "team t1" }, [h("b", { text: "NARANJA" })]);
  game.world.cars.forEach((c, i) => (c.team === 0 ? t0 : t1).append(h("div", { text: (game.names[i] || "—") + " · " + VEH[c.veh].name + (i === game.myCar ? " (tú)" : "") })));

function copyBtn(code) { return btn("Copiar código", "", (ev) => { const b = ev.currentTarget; try { navigator.clipboard.writeText(code).then(() => { b.firstChild.textContent = "Copiado"; }, () => { b.firstChild.textContent = code; }); } catch (e) { b.firstChild.textContent = code; } }); }

/* ----------------------------------------------------------------- rooms */
function makeCode() { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "VA-"; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
async function hostRoom() {
  const ts = +document.getElementById("ts").value, mn = +document.getElementById("mn").value, bots = document.getElementById("bt").value === "1", tm = +document.getElementById("tm").value;
  const code = makeCode();
  try { leaveRoom(); room = await roomApi.join(code.toLowerCase()); } catch (e) { showPanel([h("h2", { text: "No se pudo crear la sala" }), h("p", { class: "note", text: "Claude no permitió abrir la sala ahora (" + (e && e.code ? e.code : "error") + "). Inténtalo de nuevo en unos segundos." }), btn("Volver", "", mainMenu)]); return; }
  const vh = []; for (let i = 0; i < ts * 2; i++) vh.push(VEH_IDS[(i + 1) % 3]);
  newGame("host", ts, mn, bots, vh); game.code = code; game.myCar = game.world.cars.findIndex((c) => c.team === tm); game.world.cars[game.myCar].setVehicle(myVeh); hostAssign(); slotsActive(); rebuildCarVisuals();
  room.presence({ role: "host", name: myName }).catch(() => {});
  lobby && lobby.presence({ open: { code, name: myName, ts, at: Date.now() } }).catch(() => {});
  room.onPeers((ch) => { for (const p of ch.joined) if (!p.sameTab) feed("Alguien entró a la sala"); for (const p of ch.left) if (!p.sameTab) feed("Un jugador salió"); hostAssign(); });
  menuInGame();
}
async function joinRoom(raw) {
  let code = String(raw || "").trim().toUpperCase().replace(/\s+/g, ""); if (!code.startsWith("VA-") && code.length === 6) code = "VA-" + code;
  if (!/^VA-[A-Z0-9]{6}$/.test(code)) { feedPanel("El código debe tener la forma VA-XXXXXX."); return; }
  if (!roomApi) { feedPanel("Esta vista no puede conectarse a salas."); return; }
  const tm = +document.getElementById("tm").value;
  try { leaveRoom(); room = await roomApi.join(code.toLowerCase()); } catch (e) { feedPanel("No se pudo entrar (" + (e && e.code ? e.code : "error") + ")."); return; }
  newGame("client", 1, 5, false); game.code = code; game.wantTeam = tm; game.myCar = -1;
  const me = room.peers().find((p) => p.sameTab); game.myPeer = me ? me.peer : null;
  showPanel([h("h2", { text: "Conectando con el anfitrión…" }), h("p", { class: "note", text: "Sala " + code + ". Si en 10 segundos no aparece la partida, comprueba el código." }), btn("Cancelar", "", () => { leaveRoom(); endGame(); mainMenu(); })]);
  let seen = false;
  room.onPeers((ch) => {
    if (!game || game.mode !== "client") return;
    const mine = ch.peers.find((p) => p.sameTab); if (mine) game.myPeer = mine.peer;
    const host = ch.peers.find((p) => p.presence && p.presence.role === "host");
    if (host) { if (!seen) { seen = true; hidePanel(); feed("Conectado a la sala de " + String(host.presence.name || "anfitrión").slice(0, 16)); } clientOnState(host.presence.st); const ev = host.presence.ev; if (ev && ev.at !== game.lastEv) { game.lastEv = ev.at; onEvent(ev); } }
    else if (seen) { showBanner("El anfitrión salió", "Vuelve al menú", 5); seen = false; }
  });
  setTimeout(() => { if (!seen && game && game.mode === "client") showPanel([h("h2", { text: "No hay anfitrión en " + code }), h("p", { class: "note", text: "Nadie está organizando esa sala ahora. Pide el código de nuevo o crea tu propia sala." }), btn("Volver", "", () => { leaveRoom(); endGame(); mainMenu(); }, true)]); }, 10000);
}
function feedPanel(t) { const p = h("p", { class: "note", text: t }); p.style.color = "#ffb066"; panel.prepend(p); }
function leaveRoom() { if (room) { room.leave().catch(() => {}); room = null; } if (lobby) lobby.presence({ open: null }).catch(() => {}); }
function renderOpenRooms() {
  const list = document.getElementById("openRooms"); if (!list) return; list.replaceChildren();

  if (!open.length) { list.append(h("div", { class: "note", text: lobby ? "No hay salas abiertas. Crea una y pasa el código." : "Las salas aparecerán aquí cuando haya conexión." })); return; }
  for (const p of open) { const o = p.presence.open; list.append(h("div", { class: "item" }, [h("span", {}, [h("b", { text: String(o.code) }), " · " + String(o.name || "").slice(0, 16) + " · " + (o.ts | 0) + "v" + (o.ts | 0)]), h("button", { class: "btn", type: "button", style: "width:auto;padding:6px 12px", text: "Entrar", onclick: () => joinMenu(String(o.code)) })])); }
}

/* ----------------------------------------------------------------- touch */
const touchOn = matchMedia("(pointer: coarse)").matches;
if (touchOn) {
  const stick = document.getElementById("stick"), knob = document.getElementById("knob");
  const moveStick = (e) => { const r = stick.getBoundingClientRect(); const x = clamp((e.clientX - r.left - r.width / 2) / (r.width / 2), -1, 1), y = clamp((e.clientY - r.top - r.height / 2) / (r.height / 2), -1, 1); touch.x = x; touch.y = y; knob.style.left = 40 + x * 40 + "px"; knob.style.top = 40 + y * 40 + "px"; };
  stick.addEventListener("pointerdown", (e) => { stick.setPointerCapture(e.pointerId); moveStick(e); });
  stick.addEventListener("pointermove", (e) => { if (e.buttons || e.pressure) moveStick(e); });
  stick.addEventListener("pointerup", () => { touch.x = 0; touch.y = 0; knob.style.left = "40px"; knob.style.top = "40px"; });
  for (const [id, key] of [["tJump", "j"], ["tBoost", "b"], ["tSlide", "h"]]) { const el = document.getElementById(id); el.addEventListener("pointerdown", () => { touch[key] = true; }); el.addEventListener("pointerup", () => { touch[key] = false; }); el.addEventListener("pointerleave", () => { touch[key] = false; }); }
}
