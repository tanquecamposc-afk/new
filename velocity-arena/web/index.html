}

.brand span { color: var(--cyan); }
.tag { font-family: var(--display); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }

  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(30, 44, 80, 0.55);

  hitS: [0, 23, 46], hitV: [0.65, 0.65, 0.55], hitVert: 0.35, capR: 0.38, capHL: 0.38, bumpE: 0.25, bumpExtra: 6, demoT: 3,

function newCtl() { return { t: 0, s: 0, p: 0, y: 0, r: 0, j: false, b: false, h: false }; }

  game.world.cars.forEach((c, i) => (c.team === 0 ? t0 : t1).append(h("div", { text: (game.names[i] || "—") + (i === game.myCar ? " (tú)" : "") })));
  return h("div", { class: "teams" }, [t0, t1]);
}
function copyBtn(code) {
  return btn("Copiar código", "", (ev) => { const b = ev.currentTarget; try { navigator.clipboard.writeText(code).then(() => { b.firstChild.textContent = "Copiado"; }, () => { b.firstChild.textContent = code; }); } catch (e) { b.firstChild.textContent = code; } });
}
function endGame() { game = null; rebuildCarVisuals(); document.getElementById("hud").hidden = true; document.getElementById("menuBtn").hidden = true; document.getElementById("touch").hidden = true; }

/* ----------------------------------------------------------------- rooms */
function makeCode() { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "VA-"; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
async function hostRoom() {
  const ts = +document.getElementById("ts").value, mn = +document.getElementById("mn").value, bots = document.getElementById("bt").value === "1", tm = +document.getElementById("tm").value;
  const code = makeCode();
  try { leaveRoom(); room = await roomApi.join(code.toLowerCase()); } catch (e) { showPanel([h("h2", { text: "No se pudo crear la sala" }), h("p", { class: "note", text: "Claude no permitió abrir la sala ahora (" + (e && e.code ? e.code : "error") + "). Inténtalo de nuevo en unos segundos." }), btn("Volver", "", mainMenu)]); return; }
  newGame("host", ts, mn, bots); game.code = code; game.myCar = game.world.cars.findIndex((c) => c.team === tm); hostAssign(); slotsActive();
  room.presence({ role: "host", name: myName }).catch(() => {});
  lobby && lobby.presence({ open: { code, name: myName, ts, at: Date.now() } }).catch(() => {});
  room.onPeers((ch) => { for (const p of ch.joined) if (!p.sameTab) feed("Alguien entró a la sala"); for (const p of ch.left) if (!p.sameTab) feed("Un jugador salió"); hostAssign(); });
  menuInGame();
}
async function joinRoom(raw) {
  let code = String(raw || "").trim().toUpperCase().replace(/\s+/g, ""); if (!code.startsWith("VA-") && code.length === 6) code = "VA-" + code;
  if (!/^VA-[A-Z0-9]{6}$/.test(code)) { feedPanel("El código debe tener la forma VA-XXXXXX."); return; }
  if (!roomApi) { feedPanel("Esta vista no puede conectarse a salas."); return; }
  const tm = +document.getElementById("tm").value;
  try { leaveRoom(); room = await roomApi.join(code.toLowerCase()); } catch (e) { feedPanel("No se pudo entrar (" + (e && e.code ? e.code : "error") + ")."); return; }
  newGame("client", 1, 5, false); game.code = code; game.wantTeam = tm; game.myCar = -1;
  const me = room.peers().find((p) => p.sameTab); game.myPeer = me ? me.peer : null;
  showPanel([h("h2", { text: "Conectando con el anfitrión…" }), h("p", { class: "note", text: "Sala " + code + ". Si en 10 segundos no aparece la partida, comprueba el código." }), btn("Cancelar", "", () => { leaveRoom(); endGame(); mainMenu(); })]);
  let seen = false;
  const onPeers = (ch) => {
    const mine = ch.peers.find((p) => p.sameTab); if (mine) game && (game.myPeer = mine.peer);
    const host = ch.peers.find((p) => p.presence && p.presence.role === "host");
    if (host && game) { if (!seen) { seen = true; hidePanel(); feed("Conectado a la sala de " + String(host.presence.name || "anfitrión").slice(0, 16)); } clientOnState(host.presence.st); const ev = host.presence.ev; if (ev && ev.at !== game.lastEv) { game.lastEv = ev.at; if (game.lastEv !== undefined) onEvent(ev); } }
    else if (seen && game && !host) { showBanner("El anfitrión salió", "Vuelve al menú", 5); seen = false; }
  };
  room.onPeers(onPeers);
  setTimeout(() => { if (!seen && game && game.mode === "client") showPanel([h("h2", { text: "No hay anfitrión en " + code }), h("p", { class: "note", text: "Nadie está organizando esa sala ahora. Pide el código de nuevo o crea tu propia sala." }), btn("Volver", "", () => { leaveRoom(); endGame(); mainMenu(); }, true)]); }, 10000);
}
function feedPanel(t) { const p = h("p", { class: "note", text: t }); p.style.color = "#ffb066"; panel.prepend(p); }
function leaveRoom() { if (room) { room.leave().catch(() => {}); room = null; } lobby && lobby.presence({ open: null }).catch(() => {}); }
function renderOpenRooms() {
  const list = document.getElementById("openRooms"); if (!list) return; list.replaceChildren();
  const peers = lobby ? lobby.peers() : []; const open = peers.filter((p) => !p.sameTab && p.presence && p.presence.open && /^VA-[A-Z0-9]{6}$/.test(String(p.presence.open.code)));
  if (!open.length) { list.append(h("div", { class: "note", text: lobby ? "No hay salas abiertas. Crea una y pasa el código." : "Las salas aparecerán aquí cuando haya conexión." })); return; }
  for (const p of open) { const o = p.presence.open; const it = h("div", { class: "item" }, [h("span", {}, [h("b", { text: String(o.code) }), " · " + String(o.name || "").slice(0, 16) + " · " + (o.ts | 0) + "v" + (o.ts | 0)]), h("button", { class: "btn", type: "button", style: "width:auto;padding:6px 12px", text: "Entrar", onclick: () => joinMenu(String(o.code)) })]); list.append(it); }
}

/* ----------------------------------------------------------------- touch */
const touchOn = matchMedia("(pointer: coarse)").matches;
if (touchOn) {
  const stick = document.getElementById("stick"), knob = document.getElementById("knob");
  const moveStick = (e) => { const r = stick.getBoundingClientRect(); const x = clamp((e.clientX - r.left - r.width / 2) / (r.width / 2), -1, 1), y = clamp((e.clientY - r.top - r.height / 2) / (r.height / 2), -1, 1); touch.x = x; touch.y = y; knob.style.left = 40 + x * 40 + "px"; knob.style.top = 40 + y * 40 + "px"; };
  stick.addEventListener("pointerdown", (e) => { stick.setPointerCapture(e.pointerId); moveStick(e); });
  stick.addEventListener("pointermove", (e) => { if (e.buttons || e.pressure) moveStick(e); });
  stick.addEventListener("pointerup", () => { touch.x = 0; touch.y = 0; knob.style.left = "40px"; knob.style.top = "40px"; });
  for (const [id, key] of [["tJump", "j"], ["tBoost", "b"], ["tSlide", "h"]]) { const el = document.getElementById(id); el.addEventListener("pointerdown", () => { touch[key] = true; }); el.addEventListener("pointerup", () => { touch[key] = false; }); el.addEventListener("pointerleave", () => { touch[key] = false; }); }
}

/* ----------------------------------------------------------------- boot */
mainMenu();
requestAnimationFrame(frame);
(async () => {
  try {
    const r = window.claude && window.claude.use ? await window.claude.use("room") : null;
    if (!r) { const s = document.getElementById("roomStatus"); if (s) s.textContent = "Sin conexión en tiempo real en esta vista: puedes jugar solo contra bots."; return; }
    roomApi = r; lobby = r;
    lobby.onPeers(() => renderOpenRooms());
    const s = document.getElementById("roomStatus"); if (s) { s.textContent = "Conectado a Claude: puedes jugar con amigos."; s.className = "status ok"; }
  } catch (e) { /* stays offline */ }
})();
</script>
