<title>Arise Crossover V9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --void:#04070f; --panel:#101c3f; --panel-2:#18295c; --line:#32509e; --line-hi:#7aa8ff;
  --ink:#f3f7ff; --muted:#a6bce9; --dim:#7789b8;
  --spec:#5ea8ff; --arise:#2fe4ff; --monarch:#bb8cff;
  --cash:#7ee07a; --gem:#5ae2ff; --ticket:#ffc65a; --gold:#ffd24a;
  --xp:#5ce8a6; --hp:#ff4d61; --mana:#4aa8ff;
  --t-C:#b9c9e8; --t-B:#7ee07a; --t-A:#5ad2ff; --t-S:#bb8cff; --t-SE:#ffd24a; --t-M:#ff6b8a;
  --f-display:'Cinzel',Georgia,serif; --f-ui:'Fredoka','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
     -webkit-tap-highlight-color:transparent;user-select:none}
#app{position:relative;height:100%;width:100%;overflow:hidden;background:var(--void)}
canvas#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;
     padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
.stroke{paint-order:stroke fill;-webkit-text-stroke:3.5px rgba(3,7,18,.92)}
.frame{background:linear-gradient(180deg,rgba(24,41,92,.94),rgba(10,17,42,.94));border:2px solid var(--line);
       border-radius:14px;box-shadow:inset 0 1px 0 rgba(150,190,255,.32),0 8px 22px rgba(0,0,0,.5)}

/* --- top --- */
.top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;
     display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.pcard{padding:9px 11px 10px;display:grid;gap:5px;min-width:238px}
.prow{display:flex;align-items:center;gap:9px}
.rankbadge{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;
  font-family:var(--f-display);font-weight:800;font-size:19px;color:#0a1020;
  background:linear-gradient(180deg,#ffe692,#ffb43d);border:2px solid #8a5714;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.62),0 3px 0 #6f4510}
.pname{font-weight:600;font-size:15px;line-height:1.15}
.psub{font-size:11.5px;color:var(--muted)}
.bar{height:15px;border-radius:99px;background:#09102a;border:2px solid #09102a;position:relative;
     box-shadow:inset 0 2px 5px rgba(0,0,0,.65)}
.bar>i{display:block;height:100%;max-width:100%;border-radius:99px;transition:width .16s ease;
       box-shadow:inset 0 2px 0 rgba(255,255,255,.36)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;
          font-weight:600;line-height:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95)}
.bar.hp>i{background:linear-gradient(180deg,#ff8d99,#dc1f34)}
.bar.mana>i{background:linear-gradient(180deg,#8ccaff,#1f6fd0)}
.bar.xp>i{background:linear-gradient(180deg,#96f8cd,#1fae74)}
.target{flex:1;max-width:430px;display:grid;gap:4px;padding:8px 12px}
.trow{display:flex;align-items:center;gap:9px}
.lvd{width:34px;height:34px;flex:none;display:grid;place-items:center;transform:rotate(45deg);border-radius:8px;
     background:linear-gradient(180deg,#2c4079,#141f4c);border:2px solid #86a2e0}
.lvd>i{transform:rotate(-45deg);font-style:normal;font-size:12px;font-weight:700}
.tname{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdps{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums}
.thp{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.infocard{padding:8px 12px;text-align:right;display:grid;gap:2px;min-width:158px}
.infocard b{font-size:13.5px;color:#cfe6ff;font-weight:600}
.infocard span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* --- hex cluster --- */
.hexwrap{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:grid;gap:5px;pointer-events:auto}
.hexrow{display:flex;gap:5px}
.hexrow.odd{margin-left:27px}
.hex{width:52px;height:58px;display:grid;place-items:center;cursor:pointer;border:0;padding:0;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  font-size:20px;color:#0a1020;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));
  transition:transform .08s ease,filter .15s}
.hex:hover{filter:drop-shadow(0 3px 4px rgba(0,0,0,.55)) brightness(1.13)}
.hex:active{transform:translateY(2px)}
.hex:focus-visible{outline:3px solid var(--arise);outline-offset:2px}
.hx-shop{background:linear-gradient(180deg,#ffd68a,#e08a1e)}
.hx-items{background:linear-gradient(180deg,#ffa3a3,#d42b3f)}
.hx-shadow{background:linear-gradient(180deg,#c9a9ff,#7a3fe0)}
.hx-stats{background:linear-gradient(180deg,#9be0ff,#1f86d8)}
.hx-map{background:linear-gradient(180deg,#a6f0ba,#25a95c)}
.hx-help{background:linear-gradient(180deg,#d7dff0,#7f8db0)}

/* --- bottom --- */
.bottom{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
        display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.wallet{display:grid;gap:5px;pointer-events:none}
.coin{display:flex;align-items:center;gap:8px;padding:4px 13px 4px 8px;border-radius:99px;font-size:21px;
  font-weight:700;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,rgba(24,41,92,.9),rgba(8,15,36,.9));
  border:2px solid var(--line);box-shadow:inset 0 1px 0 rgba(150,190,255,.3),0 6px 16px rgba(0,0,0,.45)}
.coin i{font-style:normal;font-size:18px}
.c-cash{color:var(--cash)} .c-gem{color:var(--gem)} .c-tk{color:var(--ticket)}
.dock{display:grid;gap:7px;justify-items:center;flex:1}
.squad{display:flex;gap:6px;pointer-events:none}
.slot{width:52px;height:56px;border-radius:12px;display:grid;place-items:center;gap:1px;
  background:linear-gradient(180deg,rgba(28,46,102,.96),rgba(10,18,44,.96));border:2px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(150,190,255,.3);position:relative;overflow:hidden}
.slot.empty{opacity:.4;border-style:dashed}
.slot .g{font-size:18px;line-height:1}
.slot .n{font-size:8.5px;font-weight:600;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .d{font-size:9px;color:#bfe2ff;font-variant-numeric:tabular-nums}
.hotbar{display:flex;gap:7px;align-items:flex-end;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.act{position:relative;width:64px;height:62px;border-radius:14px;cursor:pointer;border:2px solid rgba(6,12,28,.85);
  display:grid;place-items:center;gap:1px;color:#0a1020;font-family:var(--f-ui);overflow:hidden;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 rgba(5,10,24,.8),0 8px 16px rgba(0,0,0,.45);
  transition:transform .07s ease,filter .15s}
.act:hover{filter:brightness(1.1)}
.act:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 1px 0 rgba(5,10,24,.8)}
.act:focus-visible{outline:3px solid var(--arise);outline-offset:3px}
.act .ic{font-size:20px;line-height:1}
.act .lb{font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.act kbd{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--f-ui);font-size:9px;
  font-weight:600;padding:1px 6px;border-radius:6px;background:#0c1634;color:#cfe0ff;border:1px solid var(--line)}
.act .st{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;
  padding:1px 6px;border-radius:6px;background:#0c1634;color:var(--dim);border:1px solid var(--line)}
.act.on .st{color:#0a1020;background:var(--arise);border-color:#0b5f70}
.act .cd{position:absolute;inset:0;background:rgba(4,8,20,.72);transform-origin:bottom;pointer-events:none}
.a-punch{background:linear-gradient(180deg,#ff9f9f,#d62b3f)}
.a-weapon{background:linear-gradient(180deg,#a9c6ff,#3c5fd6)}
.a-arise{background:linear-gradient(180deg,#9ae9ff,#1fa5dd)}
.a-dash{background:linear-gradient(180deg,#ffe08a,#e0a41e)}
.a-auto{background:linear-gradient(180deg,#a9f0ba,#28a75e)}
.a-mount{background:linear-gradient(180deg,#d3b2ff,#7a45e0)}
.a-portal{background:linear-gradient(180deg,#8af0ff,#17b9d8)}

/* --- notificaciones --- */
.lane{position:absolute;right:12px;top:96px;display:grid;gap:6px;justify-items:end;pointer-events:none;max-width:280px}
.note{padding:7px 13px;border-radius:11px;font-size:12.5px;font-weight:600;border:2px solid var(--line);
  background:linear-gradient(180deg,rgba(24,41,92,.96),rgba(9,16,38,.96));box-shadow:0 6px 18px rgba(0,0,0,.5);
  animation:slide .32s ease both}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;
  font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.1em;
  animation:bpop .5s ease both}
@keyframes bpop{from{opacity:0;transform:translateX(-50%) scale(.82)}to{opacity:1;transform:translateX(-50%) scale(1)}}

/* --- paneles --- */
.scrim{position:absolute;inset:0;background:rgba(3,7,18,.76);backdrop-filter:blur(4px);display:grid;place-items:center;
       padding:16px;pointer-events:auto;z-index:20}
.panel{width:min(820px,100%);max-height:min(86vh,760px);overflow:auto;border-radius:18px;
  background:linear-gradient(180deg,#152755,#0a1230);border:2px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(150,190,255,.3),0 26px 70px rgba(0,0,0,.66)}
.panel header{position:sticky;top:0;z-index:2;padding:13px 16px;display:flex;gap:12px;align-items:center;
  justify-content:space-between;background:linear-gradient(180deg,#1c3070,#152755);border-bottom:2px solid var(--line)}
.panel h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:.05em}
.panel .body{padding:14px 16px 18px;display:grid;gap:11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{cursor:pointer;font-family:var(--f-ui);font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;
  border:2px solid var(--line);background:rgba(16,28,63,.9);color:var(--muted)}
.tab.sel{background:linear-gradient(180deg,#9be0ff,#1f86d8);color:#0a1020;border-color:#11507f}
.x{cursor:pointer;width:34px;height:34px;border-radius:10px;font-size:16px;color:#0a1020;border:2px solid #7a1f2b;
   background:linear-gradient(180deg,#ff9f9f,#d62b3f);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.btn{pointer-events:auto;cursor:pointer;font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:#0a1020;
  padding:8px 13px;border-radius:11px;border:2px solid rgba(6,12,28,.8);white-space:nowrap;
  background:linear-gradient(180deg,#9ed8ff,#2f8ddf);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 rgba(5,10,24,.8)}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--arise);outline-offset:3px}
.btn.gold{background:linear-gradient(180deg,#ffdf94,#e0a22a)}
.btn.green{background:linear-gradient(180deg,#a9f0ba,#28a75e)}
.btn.violet{background:linear-gradient(180deg,#d3b2ff,#7a45e0)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:9px}
.statrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  background:linear-gradient(180deg,rgba(28,46,102,.8),rgba(11,19,45,.8));border:2px solid var(--line)}
.statrow .k{font-family:var(--f-display);font-weight:800;width:40px;color:var(--gold)}
.statrow .d{flex:1;font-size:11.5px;color:var(--muted);line-height:1.3}
.statrow .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;min-width:44px;text-align:right}
.plus{cursor:pointer;width:32px;height:32px;border-radius:10px;font-size:17px;font-weight:700;color:#0a1020;
  border:2px solid rgba(6,12,28,.8);background:linear-gradient(180deg,#a9f0ba,#28a75e);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 rgba(5,10,24,.8)}
.plus:disabled{opacity:.3;cursor:not-allowed}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.kv{padding:8px 11px;border-radius:12px;border:2px solid var(--line);
    background:linear-gradient(180deg,rgba(28,46,102,.7),rgba(11,19,45,.7))}
.kv small{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;border:2px solid var(--line);
      background:linear-gradient(180deg,rgba(28,46,102,.78),rgba(11,19,45,.78))}
.item .g{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:11px;font-size:19px;
  background:linear-gradient(180deg,#254080,#122045);border:2px solid var(--line)}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;font-size:14px;font-weight:600}
.item .meta span{font-size:11.5px;color:var(--muted)}
.item .price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--cash)}
.tier{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.locked{opacity:.45}
.hint{font-size:12px;color:var(--dim);line-height:1.5;margin:0}
.hint b{color:var(--muted)}
.arise-box{width:min(430px,100%);text-align:center;padding:20px 18px;border-radius:20px;
  background:linear-gradient(180deg,#0f3a5e,#06162e);border:2px solid #2fe4ff;
  box-shadow:0 0 62px rgba(47,228,255,.3),0 26px 70px rgba(0,0,0,.6)}
.arise-box h3{font-family:var(--f-display);margin:0;font-size:27px;font-weight:800;letter-spacing:.2em;color:#9beeff;
  text-shadow:0 0 22px rgba(47,228,255,.8)}
.arise-box .sub{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.chance{font-size:46px;font-weight:700;line-height:1;margin:8px 0 2px;color:#7ff0ff;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:7px;justify-content:center;margin:12px 0 14px}
.pip{width:30px;height:7px;border-radius:99px;background:#1a2c5e;border:1px solid #32509e}
.pip.live{background:linear-gradient(180deg,#9beeff,#1fa5dd);box-shadow:0 0 12px #2fe4ff}
.arise-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.log{margin-top:10px;font-size:12.5px;color:var(--muted);min-height:18px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:680px){
  .pcard{min-width:0;max-width:54vw} .infocard{min-width:0} .target{display:none}
  .hexwrap{top:auto;bottom:158px;transform:none} .hex{width:44px;height:50px;font-size:17px} .hexrow.odd{margin-left:23px}
  .act{width:56px;height:56px} .coin{font-size:17px} .slot{width:44px;height:48px}
  .lane{top:auto;bottom:230px;max-width:200px} .banner{font-size:24px}
}
</style>

<div id="app">
  <canvas id="stage"></canvas>
  <div class="hud">
    <div class="top">
      <div class="frame pcard">
        <div class="prow">
          <div class="rankbadge" id="rank">E</div>
          <div style="flex:1;min-width:0">
            <div class="pname" id="title">Cazador Novato</div>
            <div class="psub"><span id="lvl">Nv 1</span> · <span id="rebirth">Renacer 0</span></div>
          </div>
        </div>
        <div class="bar hp"><i id="hpbar" style="width:100%"></i><span id="hptxt">100 / 100</span></div>
        <div class="bar mana"><i id="mpbar" style="width:100%"></i><span id="mptxt">100 / 100</span></div>
        <div class="bar xp"><i id="xpbar"></i><span id="xptxt">0 / 150</span></div>
      </div>
      <div class="frame target" id="targetbar" hidden>
        <div class="trow">
          <div class="lvd"><i id="t-lv">1</i></div>
          <span class="tname" id="t-name">Enemigo</span>
          <span class="tdps" id="t-dps">0 DPS</span>
        </div>
        <div class="bar hp"><i id="t-hp" style="width:100%"></i><span id="t-hptxt">0 / 0</span></div>
      </div>
      <div class="frame infocard">
        <b id="isle">Leveling City</b>
        <span id="portal">Portal en 1:40</span>
        <span id="quest" style="color:var(--gold)"></span>
        <span id="fps" style="color:var(--dim)"></span>
      </div>
    </div>

    <div class="hexwrap">
      <div class="hexrow"><button class="hex hx-stats" id="b-stats" title="Atributos (1)">🗡</button><button class="hex hx-shadow" id="b-shadows" title="Sombras (2)">👥</button></div>
      <div class="hexrow odd"><button class="hex hx-shop" id="b-shop" title="Tienda (3)">🛒</button><button class="hex hx-items" id="b-items" title="Inventario (4)">🎒</button></div>
      <div class="hexrow"><button class="hex hx-map" id="b-map" title="Mapa (5)">🗺</button><button class="hex hx-help" id="b-help" title="Ayuda (H)">?</button></div>
    </div>

    <div class="lane" id="lane"></div>

    <div class="bottom">
      <div class="wallet">
        <div class="coin c-cash stroke"><i>💵</i><span id="cash">0</span></div>
        <div class="coin c-gem stroke"><i>💎</i><span id="gems">0</span></div>
        <div class="coin c-tk stroke"><i>🎟</i><span id="tickets">0</span></div>
      </div>
      <div class="dock">
        <div class="squad" id="squad"></div>
        <div class="hotbar">
          <button class="act a-punch" id="a-attack"><kbd>M1</kbd><span class="ic">👊</span><span class="lb">Golpe</span></button>
          <button class="act a-weapon" id="a-skill"><kbd>V</kbd><span class="ic">🌊</span><span class="lb">Arma</span><i class="cd" id="cd-skill" style="transform:scaleY(0)"></i></button>
          <button class="act a-arise" id="a-arise"><kbd>B</kbd><span class="ic">💠</span><span class="lb">Arise</span></button>
          <button class="act a-dash" id="a-dash"><kbd>Q</kbd><span class="ic">💨</span><span class="lb">Dash</span><i class="cd" id="cd-dash" style="transform:scaleY(0)"></i></button>
          <button class="act a-auto on" id="a-auto"><kbd>R</kbd><span class="ic">🔁</span><span class="lb">Auto</span><span class="st">ON</span></button>
          <button class="act a-mount" id="a-mount"><kbd>M</kbd><span class="ic">🐎</span><span class="lb">Montura</span><span class="st">OFF</span></button>
          <button class="act a-portal" id="a-portal" hidden><kbd>F</kbd><span class="ic">🌀</span><span class="lb">Portal</span></button>
        </div>
      </div>
      <div style="width:96px" aria-hidden="true"></div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="modal" hidden></div>
</div>

<script>
"use strict";
/* ===========================================================================
   ARISE CROSSOVER V9 ULTRA — build web jugable
   Fórmulas, contratos y sistemas tomados del Master Prompt V9:
     PhysicalDamage = WeaponDamage + STR*1.5
     MagicDamage    = INT*1.6*SpellModifier
     ShadowDamage   = Base*(1+SDW*0.012)     ShadowHP = BaseHP*(1+SDW*0.008)
     MaxHP          = HPBase + VIT*15        MaxMana  = 100 + MNA*10
     WalkSpeed      = 16 + AGI*0.05          DashCooldown = 3/(1+AGI*0.005)
     AGI >= 200 -> doble salto
     EXPRequired(N) = 100*N^1.85 + N*50      EXPReward = EnemyLevel*25*(1+Rebirth*0.25)
     effectiveRate  = clamp(BaseAriseRate * (1 + AriseLuck%/100), 0, MaxAriseRate)
   Toda fórmula vive en FORMULA; el resto del juego la consume.
   =========================================================================== */

const FLAGS = {
  VERSION_MODE:"V9_CROSSOVER_BASELINE",
  ENABLE_RED_GATE:true, ENABLE_DOUBLE_DUNGEON:true, ENABLE_BOSS_RUSH:true,
  PORTAL_INTERVAL_SECONDS:110,   // el contrato usa 1800; comprimido para la build web
  MAX_ARISE_RATE:0.95, CORPSE_LIFETIME:11, ARISE_ATTEMPTS:3, MAX_CORPSES:10,
  SQUAD_BASE:6, SQUAD_PER_RANK:2, SQUAD_MAX:16, LEVEL_CAP:1000, MERGE_COPIES:3,

const SUF = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd","Td"];
function fmt(v){
  if (!isFinite(v)) return "∞";
  v = Math.floor(v);
  if (v < 1000) return String(v);
  let i = 0, n = v;
  while (n >= 1000 && i < SUF.length - 1){ n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[i];
}

  };

function reconcile(d){
  const base = newProfile();
  const p = Object.assign(base, d || {});
  p.stats = Object.assign(base.stats, d?.stats || {});
  for (const k of ["weapons","weaponLv","shadows","relics","runes","index","talents","codes"])
    if (typeof p[k] !== "object" || !p[k]) p[k] = {};
  if (!CLASSES[p.class]) p.class = "Warrior";
  if (typeof p.quests !== "object" || !p.quests) p.quests = { active:null, done:0 };
  if (!Array.isArray(p.squad)) p.squad = [];
  if (!Array.isArray(p.islands) || !p.islands.length) p.islands = ["LevelingCity"];
  if (!Array.isArray(p.ledger)) p.ledger = [];
  if (!WEAPONS[p.weapon]) p.weapon = START_WEAPON;
  if (!p.weapons[p.weapon]) p.weapons[p.weapon] = 1;
  if (!RANKS.some(r => r.name === p.rank)) p.rank = "E";
  if (!isleOf(p.island)) p.island = "LevelingCity";
  p.squad = p.squad.filter(u => p.shadows[u]).slice(0, FLAGS.SQUAD_MAX);
  return p;
}

const talentLv    = id => P.talents?.[id] || 0;
const baseDamage  = () => FORMULA.physicalDamage(weaponDmg(), P.stats.STR)
  * (1 + rankMult() + classBonus("dmg") + talentLv("power") * 0.08)
  * (1 + P.level * 0.012);
const relicBonus  = effect => Object.keys(P.relics).reduce((a, id) => a + (RELICS[id]?.effect === effect ? RELICS[id].value : 0), 0);
const shadowMult  = () => 1 + relicBonus("shadowDmg") + classBonus("shadow") + talentLv("legion") * 0.15;
const ariseLuck   = () => rankOf(P.rank).luck + P.stats.INT * 0.35 + relicBonus("ariseLuck")
  + (P.awakened ? 60 : 0) + classBonus("luck") * 100 + talentLv("fortune") * 12;
const maxHP       = () => FORMULA.maxHP(100 + P.level * 6 + P.rebirths * 500, P.stats.VIT)
  * (1 + classBonus("hp") + talentLv("vigor") * 0.1);
const maxMana     = () => FORMULA.maxMana(P.stats.MNA) * (1 + classBonus("mana"));
const shadowDmgOf = s => FORMULA.shadowDamage(SHADOWS[s.id].dmg * (1 + (s.level - 1) * 0.1), P.stats.SDW) * shadowMult();
const shadowHPOf  = s => FORMULA.shadowHP(SHADOWS[s.id].hp * (1 + (s.level - 1) * 0.1), P.stats.SDW);

/* ===========================================================================
   MUNDO, COMBATE Y SISTEMAS
   =========================================================================== */
const player = {
  x:CFG.WORLD.w/2, y:CFG.WORLD.h/2, h:0, vh:0, jumps:0,
  hp:maxHP(), mana:maxMana(), face:1, step:0,
  combo:0, comboAt:0, phase:"idle", phaseT:0, atkDef:null, hitDone:false,
  dashT:0, dashX:0, dashY:0, dashCd:0, skillCd:0, dead:0, hurt:0, mounted:false,
  dps:{ total:0, since:0, shown:0 },
};
let enemies = [], corpses = [], shadows = [], floaters = [], parts = [], rings = [], portal = null, dungeon = null;
let spawnT = 0, portalT = FLAGS.PORTAL_INTERVAL_SECONDS, hitstop = 0, auto = true, dirty = true;
const cam = { x:player.x, y:player.y, shake:0, shakeV:0, impulse:0, dist:0, distV:0 };
let target = null;

/* ------------------------------- enemigos --------------------------------- */
function enemyDef(kind){
  const isle = isleOf(P.island);
  if (dungeon) return dungeon.enemyDef(kind);
  const base = kind === "brute" ? isle.brute : isle.enemy;
  return { ...base, isle:isle.id, shadow: kind === "brute" ? isle.shadow : isle.shadow, kind, r: kind === "brute" ? 24 : 18 };
}
function spawnEnemy(def, x, y){
  const d = def || enemyDef(Math.random() < 0.25 ? "brute" : "normal");
  const a = rnd(0, Math.PI*2), dist = rnd(300, 560);
  const seed = Math.floor(Math.random() * 1e9);
  const pick = (arr, k) => arr[(seed >> k) % arr.length];
  const look = {
    shirt: pick(["#d8503f","#3f7ad8","#4aa85a","#c06b28","#7a4ac0","#2f8d8d","#b8484a","#5a6b8c"], 3),
    pants: pick(["#2f3a52","#3a4a2f","#4a3a2f","#2f2f3a","#40384a"], 7),
    boots: pick(["#23283a","#2e2418","#1f2b1f"], 11),
    hair:  pick(["#2b1d12","#5a3a1a","#1a1a22","#8a5a2a","#a03a2a","#d8c060"], 13),
    hat:   ((seed >> 17) % 5 === 0) ? pick(["#2f3a52","#8a3030","#2d5a35"], 19) : null,
    backpack: ((seed >> 21) % 6 === 0) ? "#4a3a28" : null,
    height: 0.92 + ((seed >> 23) % 20) / 100,
  };
  const e = {
    guid:uid(), def:d, name:d.name, level:d.lvl, look,
    x: x ?? clamp(player.x + Math.cos(a)*dist, 80, CFG.WORLD.w-80),
    y: y ?? clamp(player.y + Math.sin(a)*dist, 80, CFG.WORLD.h-80),
    hp:d.hp, maxHp:d.hp, atkCd:rnd(.6,1.8), hurt:0, step:rnd(0,6), stun:0,
    boss:!!d.boss, phase:1, telegraph:null, moveCd:0,
  };
  enemies.push(e);
  return e;
}

/* -------------------------------- daño ------------------------------------ */
function dealDamage(e, amount, opts){
  if (!e || e.hp <= 0) return;
  const o = opts || {};
  const critChance = CFG.CRIT_CHANCE + classBonus("crit") + talentLv("crit") * 0.03;
  const crit = o.crit ?? (Math.random() < critChance);
  const dmg = amount * (crit ? CFG.CRIT_MULT : 1);
  const applied = Math.min(dmg, e.hp);
  e.hp -= applied; e.hurt = 0.14;
  player.dps.total += applied;
  target = e;
  floaters.push({ x:e.x + rnd(-24,24), y:e.y, h:78 + e.def.r*1.6, text:fmt(applied), life:1,
                  color: crit ? "#ffd24a" : (o.shadow ? "#bfe2ff" : "#fff3c4"), big:!o.shadow, crit });
  spark(e.x, e.y, 52, crit ? 14 : 7, crit ? "#ffe9a8" : (o.shadow ? "#9bdcff" : "#fff1b8"));
  if (crit) ring(e.x, e.y, 90, "#ffd24a", .45);
  if (!o.shadow){ hitstop = Math.max(hitstop, o.hitstop ?? 0.02); camImpulse(o.cam ?? 0.2); }
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  enemies = enemies.filter(x => x !== e);
  if (target === e) target = null;
  P.kills++;
  gainXP(FORMULA.expReward(e.level, P.rebirths));
  const cash = Math.max(1, Math.floor(e.level * 12 * (1 + P.rebirths * 0.3) * (dungeon?.runes?.Cash ? 1.1 : 1)));
  P.cash += cash;
  burst(e.x, e.y, 22, e.def.color || "#ffd9a8", 40);
  ring(e.x, e.y, 120, "#8fd0ff", .5);
  // CorpseToken (contrato 07)
  while (corpses.length >= FLAGS.MAX_CORPSES) corpses.shift();
  corpses.push({
    CorpseId:uid(), EnemyId:e.def.name, ShadowDefinitionId:e.def.shadow || isleOf(P.island).shadow,
    OwnerPlayerId:1, SpawnedAt:now(), ExpiresAt:now() + FLAGS.CORPSE_LIFETIME,
    AttemptsRemaining:FLAGS.ARISE_ATTEMPTS, Consumed:false,
    x:e.x, y:e.y, level:e.level, phase:0, boss:e.boss,
  });
  if (dungeon) dungeon.onKill(e);
  dirty = true;
}
function gainXP(amount){
  P.xp += amount;
  let leveled = false;
  while (P.level < FLAGS.LEVEL_CAP && P.xp >= FORMULA.expRequired(P.level)){
    P.xp -= FORMULA.expRequired(P.level);
    P.level++; P.stats.points += 3; leveled = true;
  }
  if (leveled){
    player.hp = maxHP(); player.mana = maxMana();
    note(`Nivel ${P.level} · +3 puntos`, "--xp");
    burst(player.x, player.y, 30, "#5ce8a6", 30);
    for (const isle of ISLANDS){
      if (P.level >= isle.level && !P.islands.includes(isle.id)){
        P.islands.push(isle.id);
        note(`Isla desbloqueada: ${isle.name}`, "--gem");
      }
    }
  }
  dirty = true;
}

/* ------------------------- combate del jugador ---------------------------- */
function nearestEnemy(x, y, range, cone){
  let best = null, bd = range;
  for (const e of enemies){
    const d = Math.hypot(e.x-x, e.y-y);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}
// M1: cadena de 4 golpes con startup/active/recovery del contrato V9.
function requestAttack(){
  if (player.dead > 0 || player.phase !== "idle") return;
  if (now() - player.comboAt > CFG.COMBO_RESET) player.combo = 0;
  const def = COMBO[player.combo % COMBO.length];
  const haste = 1 / (1 + talentLv("haste") * 0.06 + classBonus("speed"));
  player.atkDef = { ...def, active:def.active * haste, recovery:def.recovery * haste };
  player.phase = "startup"; player.phaseT = def.startup * haste; player.hitDone = false;
  player.combo = (player.combo + 1) % COMBO.length; player.comboAt = now();
}
function requestSkill(){
  if (player.dead > 0 || player.phase !== "idle") return;
  if (player.skillCd > 0) return note("Habilidad en enfriamiento", "--dim");
  if (player.mana < SKILL.costs.mana) return note("Maná insuficiente", "--mana");
  player.mana -= SKILL.costs.mana;
  player.skillCd = SKILL.cooldown;
  player.atkDef = { ...SKILL, mult:0, skill:true, cam:SKILL.feedback.cam, hitstop:SKILL.feedback.hitstop };
  player.phase = "startup"; player.phaseT = SKILL.startup; player.hitDone = false;
}
function resolveHit(){
  const def = player.atkDef;
  if (!def) return;
  if (def.skill){
    // Arco: radio 190, 70° al frente (hitbox del AttackDefinition)
    const dmg = weaponDmg() * SKILL.damage.weapon + P.stats.STR * SKILL.damage.str * 1.5;
    const total = dmg * (1 + rankMult());
    let hits = 0;
    const skillDmg = total * (1 + classBonus("skill"));
    for (const e of enemies.slice()){
      if (Math.hypot(e.x-player.x, e.y-player.y) > SKILL.hitbox.radius) continue;
      dealDamage(e, skillDmg, { cam:SKILL.feedback.cam, hitstop:SKILL.feedback.hitstop });
      hits++;
    }
    ring(player.x, player.y, SKILL.hitbox.radius * 1.1, "#7fc6ff", .55);
    camImpulse(SKILL.feedback.cam);
    if (!hits) hitstop = Math.max(hitstop, 0.02);
    return;
  }
  const e = nearestEnemy(player.x, player.y, CFG.ATTACK_RANGE);
  if (!e){ return; }
  player.face = e.x < player.x ? -1 : 1;
  dealDamage(e, baseDamage() * def.mult, { cam:def.cam, hitstop:def.hitstop });
}
function requestDash(){
  if (player.dashCd > 0 || player.dead > 0) return;
  const v = inputVector();
  const dx = v.x || 0, dy = v.y || (v.x ? 0 : -1);
  const len = Math.hypot(dx, dy) || 1;
  player.dashX = dx/len; player.dashY = dy/len;
  player.dashT = CFG.DASH_TIME;
  player.dashCd = FORMULA.dashCooldown(P.stats.AGI);
  camImpulse(0.35);
  for (let i=0;i<10;i++) parts.push({ x:player.x, y:player.y, h:rnd(10,60), vx:rnd(-60,60), vy:rnd(-60,60),
                                      vh:rnd(20,80), life:rnd(.25,.45), color:"#bfe2ff", size:rnd(2,4) });
}
function requestJump(){
  if (player.dead > 0) return;
  const maxJumps = FORMULA.doubleJump(P.stats.AGI) ? 2 : 1;
  if (player.jumps >= maxJumps) return;
  player.jumps++;
  player.vh = CFG.JUMP_V * (player.jumps > 1 ? 0.88 : 1);
  if (player.jumps > 1) ring(player.x, player.y, 60, "#9bdcff", .3, player.h);
}

/* ------------------------- ARISE (contrato 07) ---------------------------- */
let ariseToken = null, ariseAnim = 0;
function nearestCorpse(){
  let best = null, bd = CFG.ARISE_RANGE;
  for (const c of corpses){
    const d = Math.hypot(c.x-player.x, c.y-player.y);
    if (d < bd){ bd = d; best = c; }
  }
  return best;
}
const corpseRate = c => FORMULA.effectiveRate(SHADOWS[c.ShadowDefinitionId]?.rate ?? 0.3, ariseLuck());
// READ -> VALIDATE -> ROLL -> CREATE -> RECORD -> CONSUME -> ACK
function attemptArise(c){
  if (!c || c.Consumed) return { ok:false, code:"CONSUMED" };
  if (c.ExpiresAt < now()) { consumeCorpse(c, false); return { ok:false, code:"EXPIRED" }; }
  if (c.AttemptsRemaining <= 0) return { ok:false, code:"NO_ATTEMPTS" };
  if (Math.hypot(c.x-player.x, c.y-player.y) > CFG.ARISE_RANGE * 1.5) return { ok:false, code:"TOO_FAR" };
  c.AttemptsRemaining--;
  const rate = corpseRate(c);
  ariseAnim = now();
  if (Math.random() <= rate){
    const def = SHADOWS[c.ShadowDefinitionId];
    const shadow = { uuid:uid(), id:def.id, name:def.name, tier:def.tier, level:1, xp:0, lock:false };
    P.shadows[shadow.uuid] = shadow;
    P.index[def.id] = (P.index[def.id] || 0) + 1;
    P.arisen++;
    const replaced = autoEquip(shadow);
    P.ledger.push({ tx:uid(), type:"ShadowCreated", id:def.id, at:Date.now() });
    if (P.ledger.length > 50) P.ledger.shift();
    consumeCorpse(c, true);
    rebuildSquad(); save(); dirty = true;
    burst(c.x, c.y, 54, "#2fe4ff", 20); ring(c.x, c.y, 180, "#2fe4ff", .8);
    camImpulse(0.5);
    return { ok:true, shadow, replaced, rate };
  }
  if (c.AttemptsRemaining <= 0){
    const gems = Math.max(1, Math.floor((SHADOWS[c.ShadowDefinitionId]?.gems ?? 1) * (1 + c.level * 0.05)));
    P.gems += gems; consumeCorpse(c, true); save(); dirty = true;
    return { ok:false, code:"EXHAUSTED", gems, rate };
  }
  burst(c.x, c.y, 16, "#4a5f8a", 16);
  return { ok:false, code:"FAILED", attempts:c.AttemptsRemaining, rate };
}
function consumeCorpse(c, consumed){
  c.Consumed = true;
  corpses = corpses.filter(x => x !== c);
  if (ariseToken === c) closeArise();
}
function destroyCorpse(c){
  if (!c) return 0;
  const gems = Math.max(1, Math.floor((SHADOWS[c.ShadowDefinitionId]?.gems ?? 1) * (1 + c.level * 0.05)));
  P.gems += gems; consumeCorpse(c, true); save(); dirty = true;
  note(`+${fmt(gems)} gemas`, "--gem");
  return gems;
}
// Capacidad de escuadrón: al estar lleno cae la sombra de menor daño.
function autoEquip(shadow){
  if (P.squad.length < squadCap()){ P.squad.push(shadow.uuid); return null; }
  let worst = null, worstDmg = Infinity;
  for (const u of P.squad){
    const s = P.shadows[u];
    const d = s ? shadowDmgOf(s) : -1;
    if (d < worstDmg){ worstDmg = d; worst = u; }
  }
  if (worst && shadowDmgOf(shadow) > worstDmg){
    P.squad[P.squad.indexOf(worst)] = shadow.uuid;
    return worst;
  }
  return null;
}

/* --------------------- sombras: FSM del contrato 06 ----------------------- */
function rebuildSquad(){
  const keep = new Map(shadows.map(s => [s.uuid, s]));
  const cap = squadCap();
  shadows = P.squad.slice(0, cap).map((uuid, i) => {
    const data = P.shadows[uuid];
    if (!data) return null;
    const prev = keep.get(uuid);
    const a = (i / cap) * Math.PI * 2;
    const base = prev || {
      uuid, id:data.id, slot:i, state:"IDLE_FOLLOW", atkCd:0, step:rnd(0,6), swing:0,
      x:player.x + Math.cos(a)*CFG.SHADOW_FOLLOW, y:player.y + Math.sin(a)*CFG.SHADOW_FOLLOW, target:null,
    };
    base.slot = i; base.data = data; base.dmg = shadowDmgOf(data); base.hp = shadowHPOf(data);
    return base;
  }).filter(Boolean);
  dirty = true;
}
// TargetScore = distancia + amenaza al dueño + foco manual + peso de jefe
function scoreTarget(s, e){
  const d = Math.hypot(e.x-s.x, e.y-s.y);
  if (d > CFG.SHADOW_AGGRO) return -Infinity;
  let score = 100 - d * 0.2;
  if (Math.hypot(e.x-player.x, e.y-player.y) < 160) score += 45;   // ownerThreat
  if (e === target) score += 30;                                    // manualFocus
  if (e.boss) score += 60;                                          // bossWeight
  return score;
}
function stepShadow(s, dt){
  let t = s.target && enemies.includes(s.target) && s.target.hp > 0 ? s.target : null;
  if (!t) s.target = null;
  const dOwner = Math.hypot(s.x-player.x, s.y-player.y);
  if (dOwner > CFG.SHADOW_LEASH){ s.state = "RECALLED"; s.target = t = null; }

  if (!t && s.state !== "RECALLED"){
    let best = null, bestScore = -Infinity;
    for (const e of enemies){
      const sc = scoreTarget(s, e);
      if (sc > bestScore){ bestScore = sc; best = e; }
    }
    if (best){ s.target = t = best; s.state = best.boss ? "BOSS_FOCUS" : "TARGET_ACQUIRE"; }
  }
  let dx = 0, dy = 0;
  if (t){
    const d = Math.hypot(t.x-s.x, t.y-s.y);
    if (d <= CFG.SHADOW_RANGE){
      if (s.atkCd <= 0){
        s.state = "ATTACK"; s.atkCd = CFG.SHADOW_CD; s.swing = 0.2;
        dealDamage(t, s.dmg, { shadow:true, crit:Math.random() < 0.1 });
      } else s.state = "RECOVER";
    } else { dx = t.x - s.x; dy = t.y - s.y; }
  } else {
    // formación en anillos concéntricos: con muchas sombras no se apelotonan
    const ringIdx = Math.floor(s.slot / 6), inRing = s.slot % 6;
    const a = (inRing / 6) * Math.PI * 2 + now() * (0.3 - ringIdx * 0.06) + ringIdx * 0.5;
    const rad = CFG.SHADOW_FOLLOW + ringIdx * 78;
    const fx = player.x + Math.cos(a) * rad, fy = player.y + Math.sin(a) * rad;
    dx = fx - s.x; dy = fy - s.y;
    if (Math.hypot(dx, dy) < 8) s.state = "IDLE_FOLLOW";
  }
  const len = Math.hypot(dx, dy);
  if (len > 2){
    const sp = CFG.SHADOW_SPEED * (s.state === "RECALLED" ? 1.8 : 1);
    const step = Math.min(sp * dt, len);
    s.x += dx/len * step; s.y += dy/len * step;
    s.face = dx < 0 ? -1 : 1;
    s.step += dt * 7;
    if (s.state === "RECALLED" && dOwner < CFG.SHADOW_FOLLOW * 1.5) s.state = "IDLE_FOLLOW";
  } else s.step += dt * 1.4;
  s.atkCd -= dt; s.swing = Math.max(0, s.swing - dt);
}

/* --------------------------- motor de mazmorra ---------------------------- */
const DUNGEON_MODES = {
  Standard:      { name:"Estándar",         rooms:3, mult:1.6,  reward:1.5, color:"#6aa8ff" },
  RedGate:       { name:"Puerta Roja",      rooms:4, mult:3.2,  reward:3.0, color:"#ff5d6c" },
  DoubleDungeon: { name:"Double Dungeon",   rooms:2, mult:5.0,  reward:6.0, color:"#bb8cff" },
  BossRush:      { name:"Boss Rush",        rooms:5, mult:2.4,  reward:4.0, color:"#ffd24a" },
};
function makeDungeon(modeId){
  const mode = DUNGEON_MODES[modeId] || DUNGEON_MODES.Standard;
  const isle = isleOf(P.island);
  const seed = Math.floor(Math.random() * 1e9);
  const runeKeys = Object.keys(RUNES).filter(() => Math.random() < 0.4);
  const d = {
    id:uid(), modeId, mode, seed, isle, room:1, rooms:mode.rooms, phase:"Wave",
    timeLimit:180, timer:180 + (runeKeys.includes("Time") ? 60 : 0),
    runes:Object.fromEntries(runeKeys.map(k => [k, true])),
    bossState:null, cleared:false, rewardTx:null,
  };
  d.enemyDef = kind => {
    const base = kind === "brute" ? isle.brute : isle.enemy;
    const hpMult = mode.mult * (d.runes.Health ? 0.95 : 1) * (d.room * 0.9);
    return { ...base, name:`${base.name} de la Puerta`, hp:base.hp*hpMult, dmg:base.dmg*mode.mult,
             lvl:Math.floor(base.lvl*1.2), isle:isle.id, shadow:isle.shadow, kind, r: kind === "brute" ? 24 : 18 };
  };
  d.onKill = e => {
    if (e.boss){
      if (d.room >= d.rooms){ clearDungeon(); }
      else { d.room++; nextRoom(); }
    } else if (!enemies.length && d.phase === "Wave"){
      d.room < d.rooms ? (d.room++, nextRoom()) : spawnBoss();
    }
  };
  return d;
}
function nextRoom(){
  const d = dungeon; if (!d) return;
  enemies = []; corpses = [];
  d.phase = d.room >= d.rooms ? "Boss" : "Wave";
  banner(d.phase === "Boss" ? "SALA DEL JEFE" : `SALA ${d.room} / ${d.rooms}`, d.mode.color);
  if (d.phase === "Boss") spawnBoss();
  else for (let i=0;i<5;i++) spawnEnemy(d.enemyDef(i % 3 === 0 ? "brute" : "normal"));
}
function spawnBoss(){
  const d = dungeon; if (!d) return;
  d.phase = "Boss";
  const b = d.isle.boss;
  const boss = spawnEnemy({
    name:b.name, lvl:b.lvl, hp:b.hp * d.mode.mult * (d.runes.Health ? 0.95 : 1), dmg:b.dmg * d.mode.mult,
    shadow:b.shadow, isle:d.isle.id, kind:"boss", r:38, boss:true, color:"#ffb36b",
  }, player.x, player.y - 420);
  d.bossState = { phase:1, thresholds:[0.70, 0.40, 0.15] };
  target = boss;
  banner(b.name.toUpperCase(), "#ffd24a");
}
function clearDungeon(){
  const d = dungeon; if (!d || d.cleared) return;
  d.cleared = true; d.rewardTx = uid();
  P.dungeonsCleared++;
  const gems = Math.floor(400 * d.mode.reward * (1 + P.level*0.02) * (d.runes.Gems ? 1.1 : 1));
  const cash = Math.floor(d.isle.enemy.hp * 0.4 * d.mode.reward * (d.runes.Cash ? 1.1 : 1));
  P.gems += gems; P.cash += cash; P.tickets += 1;
  // Recompensas especiales por modo
  if (d.modeId === "DoubleDungeon" && !P.awakened){
    P.awakened = true; P.title = "Awakened";
    P.relics.BlackMonarch = true;
    banner("DESPERTAR", "#bb8cff");
    note("Awakened · +60% suerte de Arise · Black Monarch Sigil", "--monarch");
  }
  const relic = Object.values(RELICS).find(r => r.isle === d.isle.id && !P.relics[r.id]);
  if (relic && Math.random() < 0.5){ P.relics[relic.id] = true; note(`Reliquia: ${relic.name}`, "--gold"); }
  const rune = Object.keys(RUNES)[Math.floor(Math.random()*4)];
  P.runes[rune] = (P.runes[rune] || 0) + 1;
  banner("MAZMORRA COMPLETADA", "#5ce8a6");
  note(`+${fmt(gems)} gemas · +${fmt(cash)} oro · +1 ticket`, "--cash");
  save();
  const runId = d.id;
  setTimeout(() => { if (dungeon && dungeon.id === runId) exitDungeon(); }, 3200);
}
function enterDungeon(modeId){
  if (!portal && !modeId) return;
  const mode = modeId || portal.modeId;
  portal = null;
  dungeon = null;
  dungeon = makeDungeon(mode);
  enemies = []; corpses = []; shadows.forEach(s => { s.target = null; });
  player.x = CFG.WORLD.w/2; player.y = CFG.WORLD.h/2; player.hp = maxHP();
  banner(dungeon.mode.name.toUpperCase(), dungeon.mode.color);
  const runeNames = Object.keys(dungeon.runes).map(k => RUNES[k].name).join(" · ");
  if (runeNames) note(`Runas activas: ${runeNames}`, "--gem");
  nextRoom();
  dirty = true;
}
function exitDungeon(){
  dungeon = null; enemies = []; corpses = [];
  player.x = CFG.WORLD.w/2; player.y = CFG.WORLD.h/2;
  portalT = FLAGS.PORTAL_INTERVAL_SECONDS;
  note("De vuelta al mundo abierto", "--spec");
  dirty = true;
}
function spawnPortal(){
  const modes = ["Standard", FLAGS.ENABLE_RED_GATE && "RedGate", FLAGS.ENABLE_DOUBLE_DUNGEON && "DoubleDungeon",
                 FLAGS.ENABLE_BOSS_RUSH && "BossRush"].filter(Boolean);
  const modeId = modes[Math.floor(Math.random()*modes.length)];
  const a = rnd(0, Math.PI*2);
  portal = { modeId, mode:DUNGEON_MODES[modeId], t:0,
             x:clamp(player.x + Math.cos(a)*600, 150, CFG.WORLD.w-150),
             y:clamp(player.y + Math.sin(a)*600, 150, CFG.WORLD.h-150) };
  banner(`PORTAL · ${portal.mode.name}`, portal.mode.color);
  note(`Se abrió un portal (${portal.mode.name})`, "--arise");
  dirty = true;
}

/* -------------------------- misiones de NPC -------------------------------- */
const QUEST_TEMPLATES = [
  { id:"hunt",  text:n => `Derrota a ${n} enemigos`,   goal:() => 10 + Math.floor(P.level/2), type:"kills" },
  { id:"arise", text:n => `Extrae ${n} sombras`,       goal:() => 3 + Math.floor(P.level/20), type:"arisen" },
  { id:"gate",  text:n => `Completa ${n} mazmorra(s)`, goal:() => 1, type:"dungeons" },
];
const npc = { x:CFG.WORLD.w/2 + 240, y:CFG.WORLD.h/2 - 200, step:0 };
function questProgress(){
  const q = P.quests.active; if (!q) return 0;
  const cur = q.type === "kills" ? P.kills : q.type === "arisen" ? P.arisen : P.dungeonsCleared;
  return cur - q.start;
}
function takeQuest(){
  if (P.quests.active) return;
  const t = QUEST_TEMPLATES[Math.floor(Math.random()*QUEST_TEMPLATES.length)];
  const goal = t.goal();
  P.quests.active = { id:t.id, type:t.type, goal, start: t.type === "kills" ? P.kills : t.type === "arisen" ? P.arisen : P.dungeonsCleared,
                      text:t.text(goal) };
  note(`Misión: ${P.quests.active.text}`, "--gold");
  save(); dirty = true;
}
function checkQuest(){
  const q = P.quests.active;
  if (!q || questProgress() < q.goal) return;
  const cash = Math.floor(isleOf(P.island).enemy.hp * 3 * (1 + P.level*0.05));
  const gems = 25 + P.level * 2;
  P.cash += cash; P.gems += gems; P.tickets += 1; P.quests.done++; P.quests.active = null;
  banner("MISIÓN COMPLETADA", "#ffd24a");
  note(`+${fmt(cash)} oro · +${fmt(gems)} gemas · +1 ticket`, "--cash");
  save(); dirty = true;
}

/* -------------------------------- efectos --------------------------------- */
function burst(x, y, n, color, h){
  for (let i=0;i<n;i++){
    const a = rnd(0, Math.PI*2), sp = rnd(50, 260);
    parts.push({ x, y, h:(h ?? 34) + rnd(0,22), vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.55,
                 vh:rnd(90, 320), life:rnd(.4,.95), color, size:rnd(1.8,4.6) });
  }
}
function spark(x, y, h, n, color){
  for (let i=0;i<n;i++){
    const a = rnd(0, Math.PI*2), sp = rnd(70, 240);
    parts.push({ x, y, h, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*0.5, vh:rnd(60,220),
                 life:rnd(.22,.45), color, size:rnd(2,4.4) });
  }
}
function ring(x, y, r, color, life, h){
  rings.push({ x, y, r, color, life, max:life, h:h ?? 4 });
}
// Muelle de cámara del contrato 15 (Stiffness 150, Damping 12)
function camImpulse(force){
  cam.shakeV += force * 26;
  cam.distV += force * 90;
}
let banners = [];
function banner(text, color){
  const el = document.getElementById("banner");
  el.innerHTML = `<div class="banner stroke" style="color:${color}">${text}</div>`;
  clearTimeout(banner._t);
  banner._t = setTimeout(() => { el.innerHTML = ""; }, 1900);
}
function note(text, colorVar){
  const lane = document.getElementById("lane");
  const el = document.createElement("div");
  el.className = "note"; el.textContent = text;
  if (colorVar) el.style.color = colorVar.startsWith("--") ? `var(${colorVar})` : colorVar;
  lane.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .4s"; }, 2600);
  setTimeout(() => el.remove(), 3100);
  while (lane.children.length > 5) lane.firstChild.remove();
}

/* ===========================================================================
   ENTRADA Y BUCLE
   =========================================================================== */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d", { alpha:false });
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize);

const keys = new Set();
let pointer = null;
const modalOpen = () => !!panelKind || !!ariseToken;
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  if (k === "escape"){ closePanel(); closeArise(); return; }
  if (e.repeat) return;
  if (modalOpen() && k !== "b") return;
  keys.add(k);
  if (k === " ") requestJump();
  if (k === "v") requestSkill();
  if (k === "b") openArise();
  if (k === "q") requestDash();
  if (k === "r") setAuto(!auto);
  if (k === "m") toggleMount();
  if (k === "f" && portal) enterDungeon();
  if (k === "1") openPanel("stats");
  if (k === "2") openPanel("shadows");
  if (k === "3") openPanel("shop");
  if (k === "4") openPanel("items");
  if (k === "5") openPanel("map");
  if (k === "h") openPanel("help");
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointer = { x:e.clientX, y:e.clientY, down:now() };
  if (e.button === 0) requestAttack();
});
canvas.addEventListener("pointermove", e => { if (pointer) { pointer.x = e.clientX; pointer.y = e.clientY; } });
canvas.addEventListener("pointerup", () => { pointer = null; });
canvas.addEventListener("pointercancel", () => { pointer = null; });
canvas.addEventListener("contextmenu", e => e.preventDefault());

function inputVector(){
  let dx = 0, dy = 0;
  if (keys.has("w") || keys.has("arrowup")) dy -= 1;
  if (keys.has("s") || keys.has("arrowdown")) dy += 1;
  if (keys.has("a") || keys.has("arrowleft")) dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  if (!dx && !dy && pointer && now() - pointer.down > 0.18){
    const px = pointer.x - W/2, py = pointer.y - H*0.62;
    if (Math.hypot(px, py) > 30){ dx = px; dy = py; }
  }
  const len = Math.hypot(dx, dy);
  return len ? { x:dx/len, y:dy/len } : { x:0, y:0 };
}
function toggleMount(){
  player.mounted = !player.mounted;
  const b = document.getElementById("a-mount");
  b.classList.toggle("on", player.mounted);
  b.querySelector(".st").textContent = player.mounted ? "ON" : "OFF";
  note(player.mounted ? "Montura invocada" : "Montura guardada", "--monarch");
}

/* -------------------------------- update ---------------------------------- */
function update(dt){
  const t = now();
  // hitstop: congela la simulación, no la cámara
  if (hitstop > 0){ hitstop -= dt; dt *= 0.06; }

  // ---- jugador
  const speed = FORMULA.walkSpeed(P.stats.AGI) * 11 * (player.mounted ? 2.1 : 1);
  const v = inputVector();
  if (player.dead > 0){
    player.dead -= dt;
    if (player.dead <= 0){ player.hp = maxHP() * 0.6; note("Has revivido", "--muted"); }
  } else if (player.dashT > 0){
    player.dashT -= dt;
    const d = CFG.DASH_DIST / CFG.DASH_TIME;
    player.x = clamp(player.x + player.dashX * d * dt, 50, CFG.WORLD.w-50);
    player.y = clamp(player.y + player.dashY * d * dt, 50, CFG.WORLD.h-50);
    if (Math.random() < 0.6) parts.push({ x:player.x, y:player.y, h:30, vx:0, vy:0, vh:6,
                                          life:.3, color:"#8fc8ff", size:5, ghost:true });
  } else {
    const mv = player.phase === "idle" ? 1 : 0.35;
    let mx = v.x, my = v.y;
    // AUTO: si no hay entrada, el cazador se acerca solo a su objetivo
    if (!mx && !my && auto && !modalOpen()){
      const t2 = nearestEnemy(player.x, player.y, 900);
      if (t2){
        const d = Math.hypot(t2.x-player.x, t2.y-player.y);
        if (d > CFG.ATTACK_RANGE * 0.7){ mx = (t2.x-player.x)/d; my = (t2.y-player.y)/d; }
      }
    }
    player.x = clamp(player.x + mx * speed * mv * dt, 50, CFG.WORLD.w-50);
    player.y = clamp(player.y + my * speed * mv * dt, 50, CFG.WORLD.h-50);
    if (mx) player.face = mx < 0 ? -1 : 1;
    player.step += (Math.abs(mx) + Math.abs(my)) * dt * 10;
  }
  // salto y gravedad
  if (player.h > 0 || player.vh !== 0){
    player.vh -= CFG.GRAVITY * dt;
    player.h += player.vh * dt;
    if (player.h <= 0){ player.h = 0; player.vh = 0; player.jumps = 0; }
  }
  // fases del golpe
  if (player.phase !== "idle"){
    player.phaseT -= dt;
    if (player.phaseT <= 0){
      if (player.phase === "startup"){
        player.phase = "active"; player.phaseT = player.atkDef.active;
        resolveHit(); player.hitDone = true;
      } else if (player.phase === "active"){
        player.phase = "recovery"; player.phaseT = player.atkDef.recovery;
      } else { player.phase = "idle"; player.atkDef = null; }
    }
  }
  player.dashCd = Math.max(0, player.dashCd - dt);
  player.skillCd = Math.max(0, player.skillCd - dt);
  player.hurt = Math.max(0, player.hurt - dt);
  player.mana = Math.min(maxMana(), player.mana + maxMana() * 0.08 * dt);
  // AUTO: autoclick + auto-arise (el género espera que el farmeo sea continuo)
  if (auto && player.phase === "idle" && !modalOpen() && player.dead <= 0) requestAttack();
  else if (pointer && now() - pointer.down > 0.25 && player.phase === "idle") requestAttack();

  // ---- enemigos
  spawnT -= dt;
  const pop = dungeon ? (dungeon.phase === "Boss" ? 1 : 6) : CFG.ENEMY_POP;
  if (spawnT <= 0 && enemies.length < pop && !(dungeon && dungeon.phase === "Boss")){
    // repone la horda con rapidez: el farmeo del original es continuo
    const batch = Math.min(3, pop - enemies.length);
    for (let i=0;i<batch;i++) spawnEnemy();
    spawnT = dungeon ? 1.2 : 0.5;
  }
  for (const e of enemies){
    e.hurt = Math.max(0, e.hurt - dt);
    e.stun = Math.max(0, e.stun - dt);
    if (e.stun > 0) continue;
    const d = Math.hypot(player.x-e.x, player.y-e.y) || 1;
    const stop = e.def.r + (e.boss ? 120 : 92);
    // fases del jefe (contrato 10.1)
    if (e.boss && dungeon?.bossState){
      const pct = e.hp / e.maxHp, th = dungeon.bossState.thresholds;
      const newPhase = pct <= 0.15 ? 4 : pct <= th[1] ? 3 : pct <= th[0] ? 2 : 1;
      if (newPhase > e.phase){
        e.phase = newPhase;
        banner(newPhase === 4 ? "ENRAGE" : `FASE ${newPhase}`, newPhase === 4 ? "#ff4d61" : "#ffd24a");
        camImpulse(0.6); ring(e.x, e.y, 260, "#ff4d61", .9);
      }
    }
    if (d > stop){
      const sp = (98 + Math.min(60, e.level * 0.05)) * (e.boss ? 0.8 + e.phase*0.12 : 1);
      e.x += (player.x-e.x)/d * sp * dt; e.y += (player.y-e.y)/d * sp * dt;
      e.step += dt * 6;
    }
    // telegrafía + golpe
    if (e.telegraph){
      e.telegraph.t += dt;
      if (e.telegraph.t >= e.telegraph.dur){
        const r = e.telegraph.r;
        if (Math.hypot(player.x-e.telegraph.x, player.y-e.telegraph.y) < r && player.h < 60) hitPlayer(e.def.dmg * 2.2);
        ring(e.telegraph.x, e.telegraph.y, r, "#ff4d61", .5);
        burst(e.telegraph.x, e.telegraph.y, 26, "#ff8a5c", 20);
        camImpulse(0.5);
        e.telegraph = null;
      }
    } else if ((e.atkCd -= dt) <= 0){
      if (e.boss){
        e.atkCd = Math.max(1.1, 2.6 - e.phase * 0.35);
        e.telegraph = { x:player.x, y:player.y, r:150, t:0, dur:Math.max(0.6, 1.4 - e.phase*0.18) };
      } else {
        e.atkCd = 1.35;
        if (d <= stop + 26 && player.h < 50) hitPlayer(e.def.dmg);
      }
    }
  }
  separate(dt);
  for (const s of shadows) stepShadow(s, dt);

  // ---- cadáveres (expiran por contrato)
  for (const c of corpses.slice()){
    c.phase += dt;
    if (c.ExpiresAt < t) consumeCorpse(c, false);
  }
  if (auto && !ariseToken){
    const c = nearestCorpse();
    if (c){
      const r = attemptArise(c);
      if (r.ok) note(`ARISE · ${r.shadow.name}`, "--arise");
      else if (r.code === "EXHAUSTED") note(`Fallo · +${fmt(r.gems)} gemas`, "--gem");
    }
  }

  // ---- portal / mazmorra
  if (dungeon){
    dungeon.timer -= dt;
    if (dungeon.timer <= 0 && !dungeon.cleared){ note("Tiempo agotado", "--hp"); exitDungeon(); }
  } else {
    if (!portal){
      portalT -= dt;
      if (portalT <= 0) spawnPortal();
    } else {
      portal.t += dt;
      if (portal.t > 60){ portal = null; portalT = FLAGS.PORTAL_INTERVAL_SECONDS; note("El portal se cerró", "--dim"); }
    }
  }
  const nearPortal = portal && Math.hypot(portal.x-player.x, portal.y-player.y) < 120;
  document.getElementById("a-portal").hidden = !nearPortal;

  // ---- efectos
  for (const f of floaters) f.life -= dt;
  floaters = floaters.filter(f => f.life > 0);
  if (floaters.length > 26) floaters.splice(0, floaters.length - 26);
  for (const p of parts){
    p.life -= dt;
    if (!p.ghost){
      p.x += p.vx*dt; p.y += p.vy*dt; p.h += p.vh*dt;
      p.vx *= 0.94; p.vy *= 0.94; p.vh -= 620*dt;
      if (p.h < 2){ p.h = 2; p.vh *= -0.35; }
    }
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 260) parts.splice(0, parts.length - 260);
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);

  // ---- cámara (muelle: fuerza = (objetivo-pos)*k - vel*d)
  const stiff = 150, damp = 12;
  cam.shakeV += (0 - cam.shake) * stiff * dt - cam.shakeV * damp * dt;
  cam.shake += cam.shakeV * dt;
  cam.distV += (0 - cam.dist) * stiff * dt - cam.distV * damp * dt;
  cam.dist += cam.distV * dt;
  cam.x += (player.x - cam.x) * Math.min(1, dt * 7);
  cam.y += (player.y - cam.y) * Math.min(1, dt * 7);

  // ---- DPS
  player.dps.since += dt;
  if (player.dps.since >= 1){ player.dps.shown = player.dps.total / player.dps.since; player.dps.total = 0; player.dps.since = 0; }

  checkQuest();
  if (!dungeon && !P.quests.active && Math.hypot(npc.x-player.x, npc.y-player.y) < 150) takeQuest();
  npc.step += dt;

  saveT -= dt;
  if (saveT <= 0){ save(); saveT = 6; }
}
let saveT = 6;
function hitPlayer(raw){
  if (player.dead > 0) return;
  const dmg = Math.max(1, raw * CFG.CONTACT_SCALE * (1 - classBonus("armor")));
  player.hp -= dmg; player.hurt = 0.22;
  floaters.push({ x:player.x, y:player.y, h:96, text:`-${fmt(dmg)}`, color:"#ff8d97", life:.85 });
  camImpulse(0.25);
  if (player.hp <= 0){
    player.hp = 0; player.dead = 2.4;
    note("Has caído · tus sombras te cubren", "--hp");
    burst(player.x, player.y, 34, "#ff4d61", 30);
  }
  dirty = true;
}
function separate(dt){
  for (let i = 0; i < enemies.length; i++){
    const a = enemies[i];
    for (let j = i+1; j < enemies.length; j++){
      const b = enemies[j];
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx, dy) || .001;
      const min = (a.def.r + b.def.r) * 2.1 + 52;
      if (d < min){
        const push = (min-d) * 0.5 * Math.min(1, dt*12);
        a.x -= dx/d*push; a.y -= dy/d*push; b.x += dx/d*push; b.y += dy/d*push;
      }
    }
    const dx = a.x-player.x, dy = a.y-player.y, d = Math.hypot(dx, dy) || .001;
    const min = a.def.r + (a.boss ? 104 : 88);
    if (d < min){ const push = (min-d) * Math.min(1, dt*14); a.x += dx/d*push; a.y += dy/d*push; }
  }
}

/* ===========================================================================
   RENDER — motor pseudo-3D por software
   Cámara en perspectiva detrás del jugador, terreno con relieve, luz
   direccional con sombreado por cara, cel-outline y props por tema de isla.
   =========================================================================== */
const CAM = { back:300, height:205, pitch:0.345, focal:700 };
const TILE = 120;
const LIGHT = { x:-0.45, y:0.82, z:0.35 };

const THEMES = {
  city:    { gA:"#63cf5a", gB:"#55c04e", sky1:"#2f8fe0", sky2:"#d3f1ff", fog:"#d3f1ff", amp:8,  water:"#2f7fd0", clouds:1, prop:"city" },
  forest:  { gA:"#3fae4a", gB:"#369a41", sky1:"#2e86c8", sky2:"#cfeeff", fog:"#cfeeff", amp:30, water:"#2a70b8", clouds:1, prop:"forest" },
  ice:     { gA:"#e3f4ff", gB:"#c9e7fb", sky1:"#4aa8e8", sky2:"#ecfaff", fog:"#eafaff", amp:34, water:"#4fa7d8", clouds:1, prop:"ice" },
  urban:   { gA:"#8d97a8", gB:"#7f8998", sky1:"#3b6ea8", sky2:"#bcd6ee", fog:"#bcd6ee", amp:6,  water:"#3a6f9e", clouds:1, prop:"urban" },
  royal:   { gA:"#77c36a", gB:"#67b25c", sky1:"#3b7fd0", sky2:"#ffe6b8", fog:"#ffe6b8", amp:18, water:"#3b86c8", clouds:1, prop:"royal" },
  shrine:  { gA:"#7fbf6a", gB:"#6faf5c", sky1:"#e0705a", sky2:"#ffd9c2", fog:"#ffd9c2", amp:22, water:"#c9604e", clouds:1, prop:"shrine" },
  dark:    { gA:"#3a4a3c", gB:"#334233", sky1:"#161a2c", sky2:"#3b3550", fog:"#2a2740", amp:26, water:"#22243a", clouds:0, prop:"dark" },
  dragon:  { gA:"#7a5f45", gB:"#6b523b", sky1:"#7a2e20", sky2:"#e6a05a", fog:"#c07a46", amp:58, water:"#8a3a22", clouds:1, prop:"dragon" },
  cyber:   { gA:"#2a3350", gB:"#242c46", sky1:"#0b1030", sky2:"#5a2a86", fog:"#331e58", amp:6,  water:"#1d3f7a", clouds:0, prop:"cyber" },
  volcano: { gA:"#3a2a2a", gB:"#322424", sky1:"#2a0c0c", sky2:"#e0562a", fog:"#7a2a1a", amp:40, water:"#d2431a", clouds:0, prop:"volcano" },
  guild:   { gA:"#6fae7a", gB:"#619e6c", sky1:"#2f7fc8", sky2:"#dff0ff", fog:"#dff0ff", amp:14, water:"#2f7fc8", clouds:1, prop:"guild" },
  mystic:  { gA:"#3e3a72", gB:"#363165", sky1:"#161046", sky2:"#6b4cc0", fog:"#3a2a78", amp:20, water:"#3a2a90", clouds:0, prop:"mystic" },
  storm:   { gA:"#5a6b7a", gB:"#4e5e6c", sky1:"#2a3348", sky2:"#8fa4bc", fog:"#6a7c92", amp:36, water:"#3d5570", clouds:1, prop:"storm" },
  dungeon: { gA:"#3c2c52", gB:"#342749", sky1:"#0e0820", sky2:"#5a1f42", fog:"#2c1533", amp:10, water:"#2a1030", clouds:0, prop:"dungeon" },
};
const themeNow = () => dungeon ? THEMES.dungeon : (THEMES[isleOf(P.island).theme] || THEMES.city);

/* ----------------------------- proyección --------------------------------- */
let cosP = 1, sinP = 0, FOC = 690;
function project(wx, wy, wz){
  const rx = wx - cam.x;
  const ry = wy - (CAM.height + cam.shake * 2.2);
  const rz = (cam.y + CAM.back + cam.dist) - wz;
  const z2 = rz * cosP - ry * sinP;
  if (z2 < 16) return null;
  const y2 = ry * cosP + rz * sinP;
  const s = FOC / z2;
  return { x: W/2 + rx * s + cam.shake * 3, y: H/2 - y2 * s, s, z: z2 };
}
const horizonY = () => H/2 - FOC * (sinP / cosP);

/* ------------------------- terreno y sombreado ---------------------------- */
function terrainH(x, z){
  const a = themeNow().amp;
  if (a <= 0.5) return 0;
  return (Math.sin(x*0.0021) * Math.cos(z*0.0017) * 0.65 + Math.sin((x+z)*0.0009) * 0.35) * a;
}
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n>>16)&255) * f), 0, 255);
  const g = clamp(Math.round(((n>>8)&255) * f), 0, 255);
  const b = clamp(Math.round((n&255) * f), 0, 255);
  return `rgb(${r},${g},${b})`;
}
function drawSky(){

const hCache = new Map();
function cachedH(gx, gz){
  const k = gx * 8192 + gz;
  let v = hCache.get(k);
  if (v === undefined){ v = terrainH(gx*TILE, gz*TILE); hCache.set(k, v); }
  return v;
}
function drawGround(){
  const th = themeNow();
  hCache.clear();
  const gx0 = Math.floor((cam.x - TILE*9)/TILE), gx1 = Math.floor((cam.x + TILE*9)/TILE);
  const gz0 = Math.floor((cam.y - TILE*13)/TILE), gz1 = Math.floor((cam.y + TILE*3)/TILE);
  for (let gz = gz0; gz <= gz1; gz++){
    for (let gx = gx0; gx <= gx1; gx++){
      const x = gx*TILE, z = gz*TILE;
      const h00 = cachedH(gx, gz), h10 = cachedH(gx+1, gz), h11 = cachedH(gx+1, gz+1), h01 = cachedH(gx, gz+1);
      const a = project(x, h01, z+TILE), b = project(x+TILE, h11, z+TILE),
            c = project(x+TILE, h10, z),  d = project(x, h00, z);
      if (!a || !b || !c || !d) continue;
      if (Math.max(a.y,b.y,c.y,d.y) < -30 || Math.min(a.y,b.y,c.y,d.y) > H+30) continue;
      if (Math.max(a.x,b.x,c.x,d.x) < -30 || Math.min(a.x,b.x,c.x,d.x) > W+30) continue;
      // normal aproximada -> lambert
      const nx = (h00 - h10) / TILE, nz = (h00 - h01) / TILE;
      const lam = clamp(0.72 + (nx*LIGHT.x + nz*LIGHT.z) * 2.6, 0.55, 1.25);
      const even = ((gx+gz) & 1) === 0;
      ctx.fillStyle = shade(even ? th.gA : th.gB, lam);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
      ctx.closePath(); ctx.fill();
    }
  }
}

// Caja 3D con rotación opcional (rotX = balanceo de miembros, rotZ = inclinación)
// alrededor de un pivote local, lo que permite articular brazos y piernas.
function box(px, py, pz, w, h, d, color, o){
  o = o || {};
  const hw = w/2, hd = d/2;
  const rx = o.rotX || 0, rz = o.rotZ || 0;
  let V;
  if (rx || rz){
    const pvY = o.pivotY ?? h, pvZ = o.pivotZ ?? 0;
    const cx = Math.cos(rx), sx = Math.sin(rx), cz = Math.cos(rz), sz = Math.sin(rz);
    const tr = (x, y, z) => {
      let yy = y - pvY, zz = z - pvZ, xx = x;
      if (rx){ const ny = yy*cx - zz*sx, nz = yy*sx + zz*cx; yy = ny; zz = nz; }
      if (rz){ const nx = xx*cz - yy*sz, ny2 = xx*sz + yy*cz; xx = nx; yy = ny2; }
      return project(px + xx, py + yy + pvY, pz + zz + pvZ);
    };
    V = [tr(-hw,0,hd), tr(hw,0,hd), tr(-hw,h,hd), tr(hw,h,hd),
         tr(-hw,0,-hd), tr(hw,0,-hd), tr(-hw,h,-hd), tr(hw,h,-hd)];
  } else {
    const y1 = py + h, zF = pz + hd, zB = pz - hd, xL = px - hw, xR = px + hw;
    V = [project(xL,py,zF), project(xR,py,zF), project(xL,y1,zF), project(xR,y1,zF),
         project(xL,py,zB), project(xR,py,zB), project(xL,y1,zB), project(xR,y1,zB)];
  }
  const [fbl, fbr, ftl, ftr, bbl, bbr, btl, btr] = V;
  if (!fbl || !fbr || !ftl || !ftr || !bbl || !bbr || !btl || !btr) return;
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.lineJoin = "round";
  // el contorno solo se paga cuando la caja ocupa lo suficiente en pantalla
  const stroke = (o.outline === false || fbl.s < 0.5) ? null : (o.outline || "rgba(6,10,24,.5)");
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(0.7, fbl.s * 1.2); }
  const face = (pts, fill, outline) => {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (stroke && outline) ctx.stroke();
  };
  if (px < cam.x - 2) face([fbr, ftr, btr, bbr], shade(color, 0.62), true);
  else if (px > cam.x + 2) face([fbl, ftl, btl, bbl], shade(color, 0.62), true);
  face([ftl, ftr, btr, btl], shade(color, 1.18), false);
  face([fbl, fbr, ftr, ftl], shade(color, 0.92), true);
  if (o.glow){
    ctx.globalAlpha = (o.alpha ?? 1) * 0.5;
    ctx.fillStyle = o.glow;
    ctx.beginPath(); ctx.moveTo(fbl.x,fbl.y); ctx.lineTo(fbr.x,fbr.y); ctx.lineTo(ftr.x,ftr.y); ctx.lineTo(ftl.x,ftl.y);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function decal(px, py, pz, w, h, color){
  const a = project(px - w/2, py + h, pz), b = project(px + w/2, py, pz);
  if (!a || !b) return;
  ctx.fillStyle = color; ctx.fillRect(a.x, a.y, b.x-a.x, b.y-a.y);
}
function shadowBlob(px, pz, r, alpha, gh){
  const c = project(px, (gh ?? terrainH(px, pz)) + 1, pz); if (!c) return;
  ctx.globalAlpha = alpha ?? .34; ctx.fillStyle = "#06101f";
  ctx.beginPath(); ctx.ellipse(c.x, c.y, r*c.s, r*c.s*0.42, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}
function groundCircle(x, z, r, color, alpha, lw){
  const c = project(x, terrainH(x,z)+2, z); if (!c) return;
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = (lw ?? 3) * clamp(c.s, .3, 2);
  ctx.beginPath(); ctx.ellipse(c.x, c.y, r*c.s, r*c.s*0.42, 0, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function hash2(x, z){ let h = (x*73856093) ^ (z*19349663); h = (h ^ (h>>>13)) >>> 0; return h; }

function collectProps(items){
  const th = themeNow();
  const gx0 = Math.floor((cam.x - TILE*10)/TILE), gx1 = Math.floor((cam.x + TILE*10)/TILE);
  const gz0 = Math.floor((cam.y - TILE*15)/TILE), gz1 = Math.floor((cam.y + TILE*3)/TILE);
  for (let gz = gz0; gz <= gz1; gz++){
    for (let gx = gx0; gx <= gx1; gx++){
      const h = hash2(gx, gz);
      if (h % 8) continue;
      const x = gx*TILE + (h % 80) - 40, z = gz*TILE + ((h>>8) % 80) - 40;
      if (Math.hypot(x - player.x, z - player.y) < 330) continue;
      const p = project(x, terrainH(x,z), z);
      if (!p || p.z < 200) continue;
      items.push({ z:p.z, f:() => { shadowBlob(x, z, 30, .22); drawProp(th.prop, x, z, h); } });
    }
  }
}

// Tipo de arma según el nombre del equipo, para modelarla con varias piezas.
function weaponKind(id){
  const n = (WEAPONS[id]?.name || "").toLowerCase();
  if (n.includes("axe")) return "axe";
  if (n.includes("scythe")) return "scythe";
  if (n.includes("staff") || n.includes("rod")) return "staff";
  if (n.includes("naginata") || n.includes("trident") || n.includes("maul")) return "polearm";
  return "sword";
}
function drawWeapon(kind, x, y, z, s, color, swing){
  const rot = swing ? -1.15 : 0.35;      // el arma acompaña al brazo
  const o = { rotX:rot, pivotY:0, pivotZ:0 };
  const gx = x + 16.5*s, gy = y + 19*s, gz = z + 5*s;
  switch (kind){
    case "axe":
      box(gx, gy, gz, 4.5*s, 40*s, 4.5*s, "#6b4a2a", o);
      box(gx, gy + 32*s, gz, 16*s, 14*s, 6*s, color, o);
      box(gx - 7*s, gy + 33*s, gz, 6*s, 11*s, 7*s, color, o);
      break;
    case "scythe":
      box(gx, gy, gz, 4*s, 52*s, 4*s, "#4a3a2a", o);
      box(gx, gy + 48*s, gz, 26*s, 5*s, 5*s, color, o);
      box(gx + 11*s, gy + 36*s, gz, 5*s, 14*s, 5*s, color, o);

    case "polearm":

    default:                                  // espada: hoja, guarda y empuñadura

// Cara estilo avatar: ojos con brillo y sonrisa curva sobre la cara frontal.
function drawFace(x, y, z, s, eyes, smile){
  const c = project(x, y + 57*s, z + 9*s);
  if (!c) return;
  const u = c.s * s;
  if (u < 0.35) return;
  ctx.fillStyle = eyes;
  const ew = 3.6*u, eh = 4.6*u, ex = 4.4*u;
  ctx.fillRect(c.x - ex - ew/2, c.y - eh/2, ew, eh);
  ctx.fillRect(c.x + ex - ew/2, c.y - eh/2, ew, eh);
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fillRect(c.x - ex - ew/2 + 0.6*u, c.y - eh/2 + 0.6*u, 1.5*u, 1.6*u);
  ctx.fillRect(c.x + ex - ew/2 + 0.6*u, c.y - eh/2 + 0.6*u, 1.5*u, 1.6*u);
  if (smile !== false){
    ctx.strokeStyle = eyes; ctx.lineWidth = Math.max(1, 1.5*u); ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(c.x, c.y + 2.2*u, 4.4*u, 0.25*Math.PI, 0.75*Math.PI); ctx.stroke();
  }
}
/*  Personaje articulado: los miembros rotan sobre su pivote (hombro/cadera), el
    torso respira en reposo y se inclina al correr, y el golpe tiene anticipación,
    impacto y recuperación.  */
function figure(x, z, y0, o){
  const s = o.scale ?? 1, st = o.step ?? 0;
  const alpha = o.alpha ?? 1;
  const opt = { alpha, outline:o.outline };
  if (o.lod){
    box(x, y0, z, 26*s, 26*s, 15*s, o.pants, opt);
    box(x, y0 + 26*s, z, 27*s, 26*s, 15*s, o.shirt, opt);
    box(x, y0 + 52*s, z, 19*s, 18*s, 17.5*s, o.skin, opt);
    return;
  }
  const near = Math.hypot(x - cam.x, z - cam.y) < 430;      // detalle fino solo de cerca
  const moving = o.moving && (o.speed ?? 1) > 0.05;
  const swing = moving ? Math.sin(st) : Math.sin(st * 0.5) * 0.12;   // reposo: respira
  const atk = o.attack ?? 0;                                          // 0..1 progreso del golpe
  const lean = moving ? 0.1 : 0.02;                                   // inclinación al correr
  const bob = moving ? Math.abs(Math.sin(st)) * 1.6 * s : Math.sin(st*0.5) * 0.7 * s;
  const g = y0 + bob;

  // piernas articuladas desde la cadera
  const legSw = swing * 0.62;
  box(x - 6.5*s, g + 4*s, z, 12*s, 20*s, 13*s, o.pants, { ...opt, rotX: legSw, pivotY:20*s });
  box(x + 6.5*s, g + 4*s, z, 12*s, 20*s, 13*s, o.pants, { ...opt, rotX:-legSw, pivotY:20*s });
  box(x - 6.5*s, g + 4*s, z + Math.sin(legSw)*17*s, 13.5*s, 5*s, 16*s, o.boots || o.pants, opt);
  box(x + 6.5*s, g + 4*s, z - Math.sin(legSw)*17*s, 13.5*s, 5*s, 16*s, o.boots || o.pants, opt);

  // torso, cinturón y cuello
  const torsoRot = { ...opt, rotZ: lean * (o.face ?? 1) * 0.35, pivotY:0 };
  box(x, g + 22*s, z, 27*s, 27*s, 15*s, o.shirt, torsoRot);
  box(x, g + 22*s, z, 28.5*s, 5*s, 16*s, o.belt || o.pants, opt);
  if (o.buckle && near) box(x, g + 23*s, z + 8*s, 7*s, 5*s, 2*s, o.buckle, opt);
  if (o.emblem && near) box(x, g + 33*s, z + 7.7*s, 6*s, 6*s, 1.2*s, o.emblem, opt);
  box(x, g + 47*s, z, 9.5*s, 4.5*s, 9*s, o.skin, opt);
  if (o.cape){
    const flap = moving ? Math.sin(st*1.2) * 0.12 : Math.sin(now()*1.6) * 0.05;
    box(x, g + 24*s, z - 9*s, 26*s, 30*s, 3*s, o.cape, { alpha:alpha*0.96, rotX:-0.12 + flap, pivotY:30*s });
  }

  // brazos: el derecho ejecuta el golpe (anticipación -> impacto)
  // brazos: manga, antebrazo y mano comparten pivote (hombro), así se mueven juntos
  const armSw = swing * 0.55;
  const atkRot = atk > 0 ? (-2.0 + (1 - atk) * 0.75) : armSw * -1;
  const arm = (ax, rot) => {
    const rp = { ...opt, rotX:rot, pivotY:27*s };
    box(ax, g + 38*s, z, 10.5*s, 9*s, 11.5*s, o.sleeve || o.shirt, rp);        // manga corta
    box(ax, g + 21*s, z, 9.5*s, 17*s, 10.5*s, o.skin, rp);                     // brazo
    if (near) box(ax, g + 17*s, z, 10*s, 5*s, 11*s, o.glove || o.skin, rp);    // mano
  };
  arm(x - 16.5*s, armSw);
  arm(x + 16.5*s, atkRot);
  if (o.pauldron){
    box(x - 17*s, g + 45*s, z, 14*s, 7.5*s, 15*s, o.pauldron, opt);
    box(x + 17*s, g + 45*s, z, 14*s, 7.5*s, 15*s, o.pauldron, opt);
  }

  // cabeza, pelo y accesorios
  const headBob = moving ? Math.sin(st*2) * 0.6 * s : 0;
  box(x, g + 51*s + headBob, z, 19*s, 18*s, 17.5*s, o.skin, opt);
  if (o.hair){
    box(x, g + 66.5*s + headBob, z, 20*s, 4.5*s, 18.5*s, o.hair, opt);
    if (near) box(x, g + 59*s + headBob, z - 8.4*s, 19*s, 8*s, 2.5*s, o.hair, opt);
  }

function shadeHex(hex){ return shade(hex, .7).replace("rgb","rgba").replace(")", ",1)"); }
function slashArc(x, z, y, s, color, t, wide){
  const c = project(x, y + 42*s, z + 26*s); if (!c) return;
  ctx.globalAlpha = clamp(t, 0, 1);
  ctx.strokeStyle = color; ctx.lineWidth = (wide ? 10 : 6) * c.s; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(c.x, c.y, (wide ? 46 : 27) * c.s, -1.05 + (1-t)*1.25, 0.85 + (1-t)*1.25); ctx.stroke();
  ctx.globalAlpha = clamp(t,0,1) * .55; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = (wide ? 4 : 2.4) * c.s;
  ctx.stroke(); ctx.globalAlpha = 1;
}
function drawPlayer(){

function drawShadow(s){

function drawEnemy(e){

    shirt: hurt ? "#ffe5e8" : (e.boss ? shade(base, .72) : L.shirt || shade(base, .72)),

    hair: e.boss ? shade(base, 1.2) : L.hair, hat: e.boss ? null : L.hat, backpack: e.boss ? null : L.backpack,
    eyes: e.boss ? "#ffe066" : "#2a1010", smile:false,

    pauldron: e.boss ? "#8a5a2a" : (e.def.kind === "brute" ? shade(L.shirt || base, .6) : null),
    weapon: e.boss ? "#ffd9a8" : (e.def.kind === "brute" ? "#8a7a6a" : null),

  ctx.fillStyle = e.boss ? "#ffd24a" : "#ff4d61";
  ctx.beginPath(); ctx.roundRect(head.x-w/2+1.5, head.y-h+1.5, (w-3)*clamp(e.hp/e.maxHp,0,1), h-3, (h-3)/2); ctx.fill();

function drawCorpse(c){
  const g = terrainH(c.x, c.y);
  const p = project(c.x, g+2, c.y); if (!p) return;
  const pulse = .55 + Math.sin(c.phase*3)*.25;
  const rr = 40 * p.s;
  const gr = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, rr);
  gr.addColorStop(0, `rgba(47,228,255,${.45*pulse})`); gr.addColorStop(1, "rgba(47,228,255,0)");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(p.x, p.y, rr, rr*.45, 0, 0, Math.PI*2); ctx.fill();
  // sello + tendrils
  ctx.strokeStyle = `rgba(47,228,255,${.5+pulse*.35})`; ctx.lineWidth = 2.2;
  for (let i=0;i<2;i++){
    const r2 = rr * (.48 + i*.3 + Math.sin(c.phase*2+i)*.05);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, r2, r2*.45, 0, 0, Math.PI*2); ctx.stroke();
  }
  for (let i=0;i<4;i++){
    const a = c.phase*1.6 + i*Math.PI/2, len = rr*(.5+Math.sin(c.phase*3+i)*.18);
    ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(a)*len, p.y + Math.sin(a)*len*.45);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  box(c.x, g, c.y, 34, 13, 46, "#16284d", { alpha:.85, outline:"rgba(120,200,255,.6)" });
  const tag = project(c.x, g+76, c.y);
  const near = Math.hypot(c.x-player.x, c.y-player.y) < CFG.ARISE_RANGE;
  if (near && tag){
    ctx.textAlign = "center"; ctx.font = `700 ${clamp(15*tag.s,12,22)}px Fredoka, sans-serif`;
    ctx.lineWidth = 4.5; ctx.strokeStyle = "rgba(4,8,20,.92)"; ctx.fillStyle = "#6ef0ff";
    const t = `[B] ARISE · ${c.AttemptsRemaining}`;
    ctx.strokeText(t, tag.x, tag.y); ctx.fillText(t, tag.x, tag.y);
  }
}
function drawPortal(){
  if (!portal) return;
  const g = terrainH(portal.x, portal.y);
  const base = project(portal.x, g, portal.y), top = project(portal.x, g+180, portal.y);
  if (!base || !top) return;
  const h = base.y - top.y, w = h*0.6;
  const col = portal.mode.color;
  ctx.save(); ctx.translate(base.x, base.y - h/2);
  const gr = ctx.createRadialGradient(0, 0, 4, 0, 0, w);
  gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(.55, col); gr.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = .75; ctx.fillStyle = gr;
  ctx.beginPath(); ctx.ellipse(0, 0, w*.7, h*.5, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  for (let i=0;i<3;i++){
    ctx.strokeStyle = col; ctx.globalAlpha = .8 - i*.2; ctx.lineWidth = 4-i;
    const k = 1 + i*.13 + Math.sin(portal.t*2+i)*.04;

  ctx.globalAlpha = 1; ctx.textAlign = "center"; ctx.font = "700 15px Fredoka, sans-serif";
  ctx.lineWidth = 4.5; ctx.strokeStyle = "rgba(4,8,20,.92)"; ctx.fillStyle = "#e8f4ff";
  const label = `${portal.mode.name.toUpperCase()} · [F]`;

}
function drawTelegraphs(){

function render(){
  cosP = Math.cos(CAM.pitch); sinP = Math.sin(CAM.pitch);
  FOC = CAM.focal * (W < 760 ? 0.76 : 1);
  drawSky();
  drawGround();
  drawTelegraphs();
  for (const r of rings){
    const k = 1 - r.life / r.max;
    groundCircle(r.x, r.y, r.r * (0.35 + k*0.75), r.color, (1-k) * .85, 4);
  }

  const items = [];
  collectProps(items);
  if (portal){ const p = project(portal.x, 0, portal.y); if (p) items.push({ z:p.z, f:drawPortal }); }
  for (const c of corpses){ const p = project(c.x, 0, c.y); if (p) items.push({ z:p.z, f:() => drawCorpse(c) }); }
  for (const e of enemies){ const p = project(e.x, 0, e.y); if (p) items.push({ z:p.z, f:() => drawEnemy(e) }); }
  for (const s of shadows){ const p = project(s.x, 0, s.y); if (p) items.push({ z:p.z, f:() => drawShadow(s) }); }
  { const p = project(player.x, 0, player.y); if (p) items.push({ z:p.z, f:drawPlayer }); }
  if (!dungeon){ const p = project(npc.x, 0, npc.y); if (p) items.push({ z:p.z, f:drawNPC }); }
  items.sort((a,b) => b.z - a.z);
  for (const it of items) it.f();

  for (const pt of parts){
    const p = project(pt.x, pt.h, pt.y); if (!p) continue;
    ctx.globalAlpha = clamp(pt.life * 2, 0, 1) * (pt.ghost ? .35 : 1);
    ctx.fillStyle = pt.color;
    const sz = pt.size * p.s * (pt.ghost ? 6 : 1.7);
    ctx.fillRect(p.x - sz/2, p.y - sz/2, sz, sz * (pt.ghost ? 2 : 1));
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = "center";
  for (const f of floaters){
    const p = project(f.x, f.h + (1-f.life)*54, f.y); if (!p) continue;
    ctx.globalAlpha = clamp(f.life*1.7, 0, 1);
    const size = clamp((f.big ? 25 : 18) * p.s * (f.crit ? 1.3 : 1), 12, f.crit ? 46 : 34);
    ctx.font = `700 ${size}px Fredoka, sans-serif`;
    ctx.lineWidth = Math.max(3, size*0.22); ctx.strokeStyle = "rgba(4,8,20,.92)";
    ctx.strokeText(f.text, p.x, p.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, p.x, p.y);
    if (f.crit){
      ctx.font = `700 ${size*0.42}px Fredoka, sans-serif`; ctx.fillStyle = "#ffd24a";
      ctx.strokeText("CRÍTICO", p.x, p.y - size*0.85); ctx.fillText("CRÍTICO", p.x, p.y - size*0.85);
    }
  }
  ctx.globalAlpha = 1;

  if (dungeon){
    ctx.textAlign = "center"; ctx.font = "800 17px Cinzel, serif";
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(4,8,20,.92)"; ctx.fillStyle = dungeon.mode.color;
    const mm = Math.max(0, Math.floor(dungeon.timer/60)), ss = String(Math.max(0, Math.floor(dungeon.timer%60))).padStart(2,"0");
    const t = `${dungeon.mode.name.toUpperCase()} · SALA ${dungeon.room}/${dungeon.rooms} · ${mm}:${ss}`;
    ctx.strokeText(t, W/2, 104); ctx.fillText(t, W/2, 104);
  }
}

    <div class="item"><span class="g">🌀</span>

function panelShadows(){
  const list = Object.values(P.shadows).sort((a,b) => shadowDmgOf(b) - shadowDmgOf(a));
  // merge: 3 copias iguales del mismo nivel -> +1 nivel (regla 08.2)
  const counts = {};
  for (const s of list) counts[`${s.id}|${s.level}`] = (counts[`${s.id}|${s.level}`] || 0) + 1;
  const body = list.length ? list.map(s => {
    const eq = P.squad.includes(s.uuid), col = `var(${TIER_VAR[s.tier]})`;
    const can = counts[`${s.id}|${s.level}`] >= FLAGS.MERGE_COPIES;
    return `<div class="item"><span class="g">${SHADOWS[s.id]?.glyph || "👤"}</span>
      <span class="meta"><b>${s.name} <span style="opacity:.6">Nv ${s.level}</span></b>
        <span><span class="tier" style="color:${col}">${s.tier}</span> · daño ${fmt(shadowDmgOf(s))} · vida ${fmt(shadowHPOf(s))}</span></span>
      ${can ? `<button class="btn green" data-merge="${s.id}|${s.level}">Fusionar ×3</button>` : ""}
      <button class="btn" data-equip="${s.uuid}">${eq ? "Quitar" : "Equipar"}</button></div>`;
  }).join("") : `<p class="hint">Sin sombras todavía. Derrota a un enemigo y pulsa <b>B</b> sobre su cuerpo.</p>`;
  return shell(`Sombras · ${P.squad.length}/${squadCap()}`, `
    <div class="list">${body}</div>
    <p class="hint">Escuadrón lleno: una extracción mejor <b>desequipa automáticamente la sombra de menor daño</b>.
    Tres copias iguales del mismo nivel se fusionan en una de nivel superior.</p>`);
}
