<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lupa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Página de resultados: barra de búsqueda arriba, ficha del juego con galería y una columna de resultados con panel lateral. */
  :root {
    --bg: #fbfbf8;
    --surface: #f1f0ea;
    --line: #dddbd1;
    --fg: #1d1f24;
    --muted: #5d6068;
    --link: #1d5bd6;
    --accent: #0f7a6c;
    --spark: #e2533a;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #20232a; --line: #33363f; --fg: #e9e8e3; --muted: #a2a5ae; --link: #8ab4ff; --accent: #4fd1bd; --spark: #ff7a5c; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #15171b; --surface: #20232a; --line: #33363f; --fg: #e9e8e3; --muted: #a2a5ae; --link: #8ab4ff; --accent: #4fd1bd; --spark: #ff7a5c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  header { border-bottom: 1px solid var(--line); padding-block: 16px 0; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
  .top { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .logo { font: 800 30px/1 var(--display); letter-spacing: -.02em; color: var(--fg); display: flex; align-items: baseline; }
  .logo i { width: 11px; height: 11px; border-radius: 50%; background: var(--spark); display: inline-block; margin-left: 2px; }
  form { flex: 1 1 360px; max-width: 620px; position: relative; }
  #q { width: 100%; font: 500 16px var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 11px 48px 11px 20px; }
  #q:focus { outline: none; border-color: var(--accent); }
  .go { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: var(--accent); color: var(--bg); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  .go svg { width: 16px; height: 16px; }
  #suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  #suggest button { text-align: left; background: none; border: 0; color: var(--fg); font: 500 15px var(--body); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  #suggest button:hover { background: var(--surface); }
  nav.tabs { display: flex; gap: 22px; margin-top: 12px; overflow-x: auto; }
  nav.tabs button { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); padding: 8px 2px 10px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }

  main { padding-block: 22px 60px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  h1 { font: 800 30px/1.1 var(--display); margin: 0; text-wrap: balance; }
  .kind { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .hero { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.1fr) minmax(0, 1.1fr); gap: 12px; margin-top: 16px; }
  .gallery { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; border-radius: 18px; overflow: hidden; min-height: 230px; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .gallery img:first-child { grid-row: span 2; }
  .card { background: var(--surface); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .card .in { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .src { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .src b { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .card h3 { margin: 0; font: 600 14px/1.3 var(--body); color: var(--fg); }
  .card p { margin: 0; color: var(--muted); }
  .side { display: grid; grid-template-rows: auto 1fr; gap: 12px; min-width: 0; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fact { background: var(--surface); border-radius: 16px; padding: 12px 14px; font-size: 13px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 108px; }
  .fact span { color: var(--muted); font-weight: 600; }
  .play { position: relative; display: block; border-radius: 16px; overflow: hidden; min-height: 120px; }
  .play img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
  .play .badge { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.72); color: #fff; font: 700 12px var(--body); padding: 4px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .play .badge::before { content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .play .tag { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.6); color: #fff; font: 600 11px var(--body); padding: 3px 8px; border-radius: 999px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 40px; margin-top: 26px; border-top: 1px solid var(--line); padding-top: 20px; }
  .results { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
  .res .site { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .res .fav { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font: 800 12px var(--display); color: var(--accent); flex: none; }
  .res .site small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .res h2 { margin: 6px 0 2px; font: 500 20px/1.3 var(--body); }
  .res p { margin: 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
  .res p b { color: var(--fg); font-weight: 600; }
  .about h2 { font: 600 18px var(--body); margin: 0 0 8px; }
  .about p { margin: 0 0 12px; font-size: 14px; }
  .about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; background: var(--surface); border-radius: 14px; overflow: hidden; font-size: 13px; }
  .about dt, .about dd { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .about dt { color: var(--muted); font-weight: 600; }
  .about dl > :nth-last-child(-n+2) { border-bottom: 0; }

  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 18px; }
  .imgs figure { margin: 0; }
  .imgs img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 14px; display: block; cursor: zoom-in; }
  .imgs figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .news { display: flex; flex-direction: column; gap: 18px; margin-top: 18px; max-width: 720px; }
  .news article { display: flex; gap: 14px; align-items: flex-start; }
  .news time { font: 600 13px var(--body); color: var(--accent); min-width: 92px; font-variant-numeric: tabular-nums; }
  .news h3 { margin: 0; font: 600 16px var(--body); }
  .news p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .empty { margin-top: 18px; max-width: 60ch; }
  .empty h2 { font: 800 22px var(--display); margin: 0 0 6px; }
  .chipset { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chipset button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 14px var(--body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }

  #zoom { position: fixed; inset: 0; background: rgba(10,10,14,.86); display: grid; place-items: center; padding: 24px; z-index: 20; cursor: zoom-out; }
  #zoom img { max-width: min(1000px, 100%); max-height: 86%; border-radius: 12px; }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding-block: 16px; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr 1fr; }
    .gallery { grid-column: 1 / -1; }
    .cols { grid-template-columns: 1fr; gap: 28px; }
  }
  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; }
    .gallery { min-height: 200px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="#todo" aria-label="Lupa, inicio">lupa<i></i></a>
      <form id="searchForm" role="search" autocomplete="off">
        <label for="q" class="sr" hidden>Buscar en tus juegos</label>
        <input id="q" type="search" placeholder="Busca uno de tus juegos" value="Rampazo 1v1">
        <button class="go" type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg></button>
        <div id="suggest" hidden></div>
      </form>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="todo" aria-selected="true">Todo</button>
      <button role="tab" data-tab="imagenes" aria-selected="false">Imágenes</button>
      <button role="tab" data-tab="novedades" aria-selected="false">Novedades</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>
<footer><div class="wrap">Lupa busca solo entre los juegos de este repositorio: NEXO, TORMENTA y RAMPAZO 1v1. Las imágenes son capturas reales de cada juego.</div></footer>

const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
let tab = 'todo', current = GAMES[0], query = 'Rampazo 1v1';

function find(q) {
  const n = norm(q);
  if (!n) return null;
  return GAMES.find(g => norm(g.name).includes(n) || g.keys.some(k => n.includes(norm(k)) || norm(k).startsWith(n))) || null;
}
const img = (k, alt, extra = '') => `<img src="${IMG[k]}" alt="${alt}" loading="lazy" ${extra}>`;

function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const v = $('#view');
  const g = current;
  if (!g) {
    v.innerHTML = `<div class="empty"><h2>No hay resultados para “${query.replace(/[<>&"]/g, '')}”</h2><p>Lupa solo busca entre tus juegos. Prueba con uno de estos:</p><div class="chipset">${GAMES.map(x => `<button data-go="${x.id}">${x.name}</button>`).join('')}</div></div>`;
    return;
  }
  if (tab === 'imagenes') {
    v.innerHTML = `<div class="count">${g.imgs.length} capturas de ${g.name}</div><div class="imgs">${g.imgs.map(([k, c]) => `<figure>${img(k, c, 'data-zoom')}<figcaption>${c}</figcaption></figure>`).join('')}</div>`;
    return;
  }
  if (tab === 'novedades') {
    v.innerHTML = `<div class="count">Historial de cambios de ${g.name}, sacado de los commits del repositorio</div><div class="news">${g.log.map(([d, t, p]) => `<article><time>${d}</time><div><h3>${t}</h3><p>${p}</p></div></article>`).join('')}</div>`;
    return;
  }
  v.innerHTML = `
    <div class="count">${g.results.length} resultados en tus juegos</div>
    <h1>${g.name}</h1>
    <div class="kind">${g.kind}</div>
    <section class="hero">
      <div class="gallery">${g.imgs.map(([k, c]) => img(k, c, 'data-zoom')).join('')}</div>
      <a class="card" href="${g.results[0].url}" target="_blank" rel="noopener">
        ${img(g.news.img, '')}
        <div class="in"><span class="src"><b></b>${g.news.src}</span><h3>${g.news.title}</h3><p>${g.news.text}</p><p>${g.news.when}</p></div>
      </a>
      <div class="side">
        <div class="facts">${g.facts.map(([a, b]) => `<div class="fact"><span>${a}</span>${b}</div>`).join('')}</div>
        <a class="play" href="${g.play.url}" target="_blank" rel="noopener">${img(g.play.img, '')}<span class="tag">${g.play.tag}</span><span class="badge">${g.play.label}</span></a>
      </div>
    </section>
    <section class="cols">
      <div class="results">${g.results.map(r => `
        <div class="res">
          <div class="site"><span class="fav">${r.fav}</span><div>${r.site}<small>${r.show}</small></div></div>
          <h2><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a></h2>
          <p>${r.text}</p>
        </div>`).join('')}</div>
      <aside class="about">
        <h2>Acerca de</h2>
        <p>${g.about}</p>
        <dl>${g.table.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
      </aside>
    </section>`;
}

function search(q) {
  query = q; $('#q').value = q;
  current = find(q);
  $('#suggest').hidden = true;
  try { localStorage.setItem('lupa-q', q); } catch (e) { /* sin almacenamiento */ }
  render();
  scrollTo({ top: 0 });
}
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); search($('#q').value); });
$('#q').addEventListener('input', () => {
  const n = norm($('#q').value);
  const list = GAMES.filter(g => !n || norm(g.name).includes(n) || g.keys.some(k => norm(k).startsWith(n)));
  $('#suggest').innerHTML = list.map(g => `<button type="button" data-go="${g.id}">${g.name}</button>`).join('');
  $('#suggest').hidden = !list.length;
});
$('#q').addEventListener('focus', () => $('#q').dispatchEvent(new Event('input')));
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { search(GAMES.find(g => g.id === go.dataset.go).name); return; }
  const t = e.target.closest('nav.tabs button');
  if (t) { tab = t.dataset.tab; render(); return; }
  const z = e.target.closest('[data-zoom]');
  if (z) { $('#zoom img').src = z.src; $('#zoom img').alt = z.alt; $('#zoom').hidden = false; return; }
  if (e.target.closest('#zoom')) { $('#zoom').hidden = true; return; }
  if (!e.target.closest('#searchForm')) $('#suggest').hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#zoom').hidden = true; $('#suggest').hidden = true; } });
const hashTab = location.hash.replace('#', '');
if (['todo', 'imagenes', 'novedades'].includes(hashTab)) tab = hashTab;
try { const saved = localStorage.getItem('lupa-q'); if (saved) { query = saved; $('#q').value = saved; current = find(saved); } } catch (e) { /* sin almacenamiento */ }
render();
</script>
