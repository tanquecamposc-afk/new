<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCADE NEXO</title>
<link rel="stylesheet" href="juegos/arcade.css">
<style>
  body{padding-bottom:48px; display:block;}

  /* ---------- Cabecera fija ---------- */
  #cabecera{
    position:sticky; top:0; z-index:100; width:100%;
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    flex-wrap:wrap; padding:16px 26px;
    background:linear-gradient(180deg, rgba(16,20,38,.95), rgba(7,9,19,.95));
    border-bottom:2px solid rgba(0,240,255,.3);
    backdrop-filter:blur(12px);
    box-shadow:0 4px 30px rgba(0,0,0,.7);
  }
  #cabecera .marca{display:flex; align-items:center; gap:15px;}
  #cabecera .icono{font-size:2.2rem; animation:latido 2s infinite alternate;}
  @keyframes latido{
    0%{transform:scale(1); filter:drop-shadow(0 0 10px var(--azul));}
    100%{transform:scale(1.08); filter:drop-shadow(0 0 20px var(--rosa));}
  }
  #cabecera h1{
    font-size:1.8rem; font-weight:900; letter-spacing:2px; line-height:1.1;
    background:linear-gradient(45deg, var(--azul), var(--rosa));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 16px rgba(0,240,255,.35));
  }
  #cabecera .lema{
    font-size:.72rem; color:var(--tenue); letter-spacing:3px; text-transform:uppercase;
  }
  #cartera{
    font-family:var(--fuente-arcade); color:var(--oro); font-size:1.05rem; font-weight:700;
    background:rgba(243,230,0,.1); padding:7px 16px; border-radius:20px;
    border:1px solid rgba(243,230,0,.3); font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:8px;
  }

  /* ---------- Cuerpo ---------- */
  #contenido{width:100%; max-width:1400px; margin:0 auto; padding:2.5rem 1.5rem;}
  #titulo{text-align:center; margin-bottom:2rem;}
  #titulo h2{
    font-size:clamp(1.5rem,4vw,2.2rem); font-weight:900; letter-spacing:1px; margin-bottom:.5rem;
    background:linear-gradient(90deg,#fff,#8b9bb4);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #titulo p{color:var(--tenue); font-size:.95rem;}

  #rejilla{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:2rem;
  }
  .carta{
    display:flex; flex-direction:column; text-decoration:none; color:inherit; position:relative;
    background:var(--panel); border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,255,255,.05);
    transition:transform .3s cubic-bezier(.4,0,.2,1), border-color .3s, box-shadow .3s;
  }
  .carta:hover, .carta:focus-visible{
    transform:translateY(-8px); border-color:var(--azul); outline:none;
    box-shadow:0 15px 35px rgba(0,240,255,.2), 0 0 20px rgba(255,0,127,.15);
  }
  .carta canvas{
    display:block; width:100%; height:auto; background:#03050a;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .carta:hover canvas{transform:scale(1.04);}
  .carta .marco{overflow:hidden;}
  .carta .info{padding:1.3rem; flex:1; display:flex; flex-direction:column;}
  .carta .nom{font-size:1.2rem; font-weight:800; display:flex; align-items:center; gap:8px;}
  .carta .genero{
    font-size:10.5px; font-weight:900; letter-spacing:.8px; text-transform:uppercase;
    color:#04161a; background:var(--azul); border-radius:999px; padding:3px 10px;
    margin-left:auto; box-shadow:0 0 12px rgba(0,240,255,.4);
  }
  .carta .desc{
    color:var(--tenue); font-size:.85rem; line-height:1.45; margin-top:.6rem;
    min-height:38px; flex:1;
  }
  .carta .pie{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:1.1rem; padding-top:.9rem;
    border-top:1px solid rgba(255,255,255,.06); font-size:.8rem;
  }
  .carta .record{color:var(--oro); font-weight:800; font-family:var(--fuente-arcade);}
  .carta .jugar{
    background:linear-gradient(135deg, var(--azul), #0077ff); color:#000;
    border-radius:8px; padding:.6rem 1rem; font-weight:900; font-size:.75rem;
    text-transform:uppercase; letter-spacing:1px; white-space:nowrap;
    transition:filter .2s, box-shadow .2s;
  }
  .carta:hover .jugar{filter:brightness(1.2); box-shadow:0 0 20px rgba(0,240,255,.6);}
  .carta .cinta{
    position:absolute; top:14px; right:-32px; z-index:2; transform:rotate(38deg);
    background:var(--rosa); color:#fff; font-weight:900; font-size:11px;
    padding:4px 36px; letter-spacing:1px; box-shadow:0 3px 12px rgba(0,0,0,.6);
  }
  #pie{
    margin-top:2.5rem; text-align:center; color:var(--tenue); font-size:.8rem; line-height:1.8;
  }
  #pie button{margin-top:10px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<header id="cabecera">
  <div class="marca">
    <div class="icono">🕹️</div>
    <div>
      <h1>ARCADE NEXO</h1>
      <div class="lema">Ultimate Gamer Edition v4.0</div>
    </div>
  </div>
  <div id="cartera" title="Fichas ficticias de Minas y Aviator">
    💎 <span id="fichasTxt">1000</span> NEXO-COINS
  </div>
</header>

<div id="contenido">
  <div id="titulo">
    <h2>SELECCIONA TU JUEGO SUPREMO</h2>
    <p>Nueve motores hechos a mano en HTML5 + Canvas, con renderizado HiDPI y físicas propias.
       Sin instalar nada, sin anuncios y sin conexión.</p>
  </div>

  <div id="rejilla"></div>

  <div id="pie">
    Tus récords se guardan en este navegador (nadie más los ve).<br>
    <button id="btnBorrar">🗑 Borrar todos mis récords</button>
  </div>
</div>

<script src="juegos/arcade.js"></script>
<script>
// ============================================================
//  Portada del arcade: cada carta lleva su miniatura dibujada
// ============================================================
const JUEGOS = [
  {
    id:'td', archivo:'juegos/nexo-tower-defense.html', nuevo:false,
    nombre:'🏰 NEXO Tower Defense', genero:'Estrategia',
    desc:'Coloca 12 tipos de torre, mejóralas y detén 40 oleadas hasta el Coloso del Vacío.',
    record(){
      const mapas = ['pradera','desierto','glaciar'];
      const leer = c => { try { return parseInt(localStorage.getItem(c) || '0', 10) || 0; } catch(e){ return 0; } };
      const m = Math.max(...mapas.map(x => leer('nexo_record_' + x)));
      return m > 0 ? 'Récord: ola ' + m : 'Sin jugar todavía';
    },
    portada: portadaTD
  },
  {
    id:'comecocos', archivo:'juegos/comecocos.html', nuevo:true,
    nombre:'👻 Comecocos', genero:'Arcade',
    desc:'El laberinto de siempre: 244 cocos, cuatro fantasmas con muy mala idea y túneles laterales.',
    record(){ const r = Arcade.record('comecocos'); return r ? 'Récord: ' + r + ' pts' : 'Sin jugar todavía'; },
    portada: portadaComecocos
  },
  {
    id:'pvz', archivo:'juegos/plantas-vs-zombies.html', nuevo:true,
    nombre:'🌻 Plantas vs Zombis', genero:'Defensa',
    desc:'Planta girasoles, lanzaguisantes y cerezas bomba para frenar 20 oleadas de zombis.',
    record(){ const r = Arcade.record('pvz'); return r ? 'Récord: oleada ' + r : 'Sin jugar todavía'; },
    portada: portadaPvz
  },
  {
    id:'minas', archivo:'juegos/minas.html', nuevo:true,
    nombre:'💣 Minas', genero:'Casino',
    desc:'Destapa gemas sin tocar una mina y retírate a tiempo. Fichas ficticias, cero dinero real.',
    record(){
      const s = Arcade.fichas.saldo(), m = Arcade.record('minas_mayor');
      return s.toLocaleString('es-ES') + ' 🪙' + (m ? ' · mejor +' + m.toLocaleString('es-ES') : '');
    },
    portada: portadaMinas
  },
  {
    id:'blockblast', archivo:'juegos/block-blast.html', nuevo:true,
    nombre:'🧩 Block Blast', genero:'Puzle',
    desc:'Encaja las piezas en el tablero de 8x8 y revienta filas y columnas encadenando combos.',
    record(){ const r = Arcade.record('blockblast'); return r ? 'Récord: ' + r + ' pts' : 'Sin jugar todavía'; },
    portada: portadaBlock
  },
  {
    id:'aviator', archivo:'juegos/aviator.html', nuevo:true,
    nombre:'✈ Aviator', genero:'Casino',
    desc:'El avión despega y el multiplicador sube. Retírate antes de que se vaya volando.',
    record(){
      const r = Arcade.record('aviator_mayor');
      const s = Arcade.fichas.saldo();
      return (r ? 'Mejor: ' + r.toFixed(2) + 'x · ' : '') + s.toLocaleString('es-ES') + ' 🪙';
    },
    portada: portadaAviator
  },
  {
    id:'pool', archivo:'juegos/8-ball-pool.html', nuevo:true,
    nombre:'🎱 8 Ball Pool', genero:'Deportes',
    desc:'Billar con física real: efecto, bandas, bola fantasma y un rival que no perdona.',
    record(){ const r = Arcade.record('pool_victorias'); return r ? r + ' victorias' : 'Sin jugar todavía'; },
    portada: portadaPool
  },
  {
    id:'rumble', archivo:'juegos/rumble-stars.html', nuevo:true,
    nombre:'⚽ Rumble Stars', genero:'Arena',
    desc:'Fútbol de arena: lanza bichos al campo, empuja el balón y revienta la portería rival.',
    record(){ const r = Arcade.record('rumble_victorias'); return r ? r + ' victorias' : 'Sin jugar todavía'; },
    portada: portadaRumble
  },
  {
    id:'serpiente', archivo:'juegos/serpiente.html', nuevo:true,
    nombre:'🐍 Serpiente Neón', genero:'Arcade',
    desc:'Come, crece y acelera. Con fruta dorada, rocas por el camino y modo fantasma.',
    record(){ const r = Arcade.record('serpiente'); return r ? 'Récord: ' + r + ' pts' : 'Sin jugar todavía'; },
    portada: portadaSerpiente
  }
];

const A = 340, AL = 170;   // tamaño de las miniaturas

function fondo(c, arriba, abajo){
  const g = c.createLinearGradient(0, 0, 0, AL);
  g.addColorStop(0, arriba); g.addColorStop(1, abajo);
  c.fillStyle = g; c.fillRect(0, 0, A, AL);
}

function portadaTD(c){
  fondo(c, '#2f6b39', '#24512c');
  // camino
  c.strokeStyle = '#b9a077'; c.lineWidth = 26; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-10, 40); c.lineTo(90, 40); c.lineTo(90, 120); c.lineTo(230, 120); c.lineTo(230, 50); c.lineTo(350, 50); c.stroke();
  // enemigos
  [[130,120],[165,120],[200,120]].forEach(([x, y], i) => {
    c.fillStyle = ['#c14b4b','#c98a3b','#8b5ec9'][i];
    c.beginPath(); c.arc(x, y, 9, 0, 6.3); c.fill();
    c.fillStyle = '#0d1220';
    c.beginPath(); c.arc(x - 3, y - 2, 1.6, 0, 6.3); c.arc(x + 3, y - 2, 1.6, 0, 6.3); c.fill();
  });
  // torre
  c.fillStyle = '#2f3f5e';
  c.beginPath(); c.roundRect(150, 55, 44, 44, 9); c.fill();
  c.fillStyle = '#4a628f';
  c.beginPath(); c.arc(172, 77, 15, 0, 6.3); c.fill();
  c.strokeStyle = '#5cc8ff'; c.lineWidth = 6;
  c.beginPath(); c.moveTo(172, 77); c.lineTo(172, 108); c.stroke();
  c.strokeStyle = 'rgba(92,200,255,.35)'; c.lineWidth = 2;
  c.beginPath(); c.arc(172, 77, 58, 0, 6.3); c.stroke();
}

function portadaComecocos(c){
  fondo(c, '#0b1024', '#070b18');
  c.strokeStyle = '#4f7bff'; c.lineWidth = 4; c.lineJoin = 'round';
  [[20,20,120,40],[160,20,160,40],[20,80,80,30],[120,80,90,30],[230,80,90,30],[20,130,300,22]].forEach(([x,y,w,h]) => {
    c.beginPath(); c.roundRect(x, y, w, h, 8); c.stroke();
  });
  // cocos
  c.fillStyle = '#ffe9b0';
  for (let x = 30; x < 320; x += 22) c.fillRect(x, 68, 4, 4);
  // pac
  c.fillStyle = '#ffd21e';
  c.beginPath(); c.moveTo(70, 70); c.arc(70, 70, 17, 0.35, -0.35); c.closePath(); c.fill();
  // fantasmas
  [['#ff5a52', 150], ['#ffb0e0', 195], ['#64e5ff', 240]].forEach(([col, x]) => {
    c.fillStyle = col;
    c.beginPath(); c.arc(x, 68, 15, Math.PI, 0); c.lineTo(x + 15, 82);
    for (let k = 0; k < 3; k++) c.lineTo(x + 15 - k * 10 - 5, k % 2 ? 82 : 76);
    c.lineTo(x - 15, 82); c.closePath(); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(x - 5, 65, 4.5, 0, 6.3); c.arc(x + 5, 65, 4.5, 0, 6.3); c.fill();
    c.fillStyle = '#1b2ea8';
    c.beginPath(); c.arc(x - 6, 65, 2.2, 0, 6.3); c.arc(x + 4, 65, 2.2, 0, 6.3); c.fill();
  });
}

function portadaPvz(c){
  for (let f = 0; f < 4; f++){
    c.fillStyle = f % 2 ? '#458c43' : '#4e9c4a';
    c.fillRect(0, f * 43, A, 43);
  }
  // sol
  c.fillStyle = '#ffd94a';
  c.beginPath(); c.arc(40, 34, 15, 0, 6.3); c.fill();
  c.fillStyle = '#8a5a1f';
  c.beginPath(); c.arc(40, 34, 8, 0, 6.3); c.fill();
  c.strokeStyle = '#3f9142'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(40, 49); c.lineTo(40, 72); c.stroke();
  // lanzaguisantes
  c.fillStyle = '#3f9e46';
  c.beginPath(); c.ellipse(122, 100, 11, 8, 0, 0, 6.3); c.fill();
  c.beginPath(); c.arc(108, 100, 16, 0, 6.3); c.fill();
  c.strokeStyle = '#3f9142'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(108, 116); c.lineTo(108, 140); c.stroke();
  c.fillStyle = '#20301f';
  c.beginPath(); c.arc(104, 97, 2.6, 0, 6.3); c.arc(113, 97, 2.6, 0, 6.3); c.fill();
  // guisantes
  c.fillStyle = '#8de06a';
  [155, 180, 205].forEach(x => { c.beginPath(); c.arc(x, 98, 5, 0, 6.3); c.fill(); });
  // zombi
  c.save(); c.translate(272, 104);
  c.strokeStyle = '#4c6b45'; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-4, 8); c.lineTo(-8, 24); c.moveTo(4, 8); c.lineTo(8, 24); c.stroke();
  c.fillStyle = '#4a5f7a';
  c.beginPath(); c.roundRect(-12, -10, 24, 22, 5); c.fill();
  c.strokeStyle = '#7aa06a'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(-6, -5); c.lineTo(-24, -2); c.moveTo(-6, 1); c.lineTo(-23, 6); c.stroke();
  c.fillStyle = '#7aa06a';
  c.beginPath(); c.arc(-1, -22, 11, 0, 6.3); c.fill();
  c.fillStyle = '#e2712c';
  c.beginPath(); c.moveTo(-1, -50); c.lineTo(-12, -28); c.lineTo(10, -28); c.closePath(); c.fill();
  c.fillStyle = '#1d2a1a';
  c.beginPath(); c.arc(-5, -24, 1.9, 0, 6.3); c.arc(2, -24, 1.9, 0, 6.3); c.fill();
  c.restore();
}

function portadaMinas(c){
  fondo(c, '#1d2740', '#141b2c');
  const t = 34, hu = 8, x0 = 62, y0 = 16;
  const contenido = ['g','g','g','g','g', 'g','g','b','g','g', 'g','b','g','g','b', 'g','g','g','b','g'];
  for (let j = 0; j < 4; j++){
    for (let i = 0; i < 5; i++){
      const x = x0 + i * (t + hu), y = y0 + j * (t + hu), k = j * 5 + i;
      const abierta = k < 7;
      c.fillStyle = !abierta ? '#39496e' : (contenido[k] === 'b' ? '#b83b3b' : '#2f9e6f');
      c.beginPath(); c.roundRect(x, y, t, t, 8); c.fill();
      c.strokeStyle = !abierta ? '#46577d' : (contenido[k] === 'b' ? '#ff8080' : '#4fdca0');
      c.lineWidth = 2; c.stroke();
      if (abierta){
        c.font = '17px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(contenido[k] === 'b' ? '💣' : '💎', x + t / 2, y + t / 2 + 1);
      }
    }
  }
  c.fillStyle = 'rgba(8,14,24,.9)';
  c.beginPath(); c.roundRect(96, 58, 150, 52, 12); c.fill();
  c.strokeStyle = '#6fe08b'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#6fe08b'; c.font = '900 27px "Segoe UI", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('3.12x', 171, 76);
  c.fillStyle = '#ffd25e'; c.font = '800 13px "Segoe UI", sans-serif';
  c.fillText('+1.060 🪙', 171, 97);
}

function portadaBlock(c){
  fondo(c, '#1a2338', '#101728');
  const t = 26, hu = 4, x0 = 24, y0 = 12;
  const cols = [['#ff6b8a','#c22b52'],['#5cc8ff','#1f6fa8'],['#6fe08b','#238a4a'],
                ['#ffd25e','#b98a1f'],['#b18cff','#6b3fc4']];
  const mapa = ['11..2233', '11..2233', '..444...', '55776688'];
  for (let j = 0; j < mapa.length; j++){
    for (let i = 0; i < 8; i++){
      const x = x0 + i * (t + hu), y = y0 + j * (t + hu);
      c.fillStyle = '#1d2740';
      c.beginPath(); c.roundRect(x, y, t, t, 6); c.fill();
      const ch = mapa[j][i];
      if (ch === '.') continue;
      const col = cols[(ch.charCodeAt(0) - 49) % cols.length];
      const g = c.createLinearGradient(x, y, x, y + t);
      g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
      c.fillStyle = g;
      c.beginPath(); c.roundRect(x + 1, y + 1, t - 2, t - 2, 6); c.fill();
      c.fillStyle = 'rgba(255,255,255,.28)';
      c.beginPath(); c.roundRect(x + 4, y + 4, t - 8, 7, 3); c.fill();
    }
  }
  c.fillStyle = 'rgba(255,210,94,.16)';
  c.beginPath(); c.roundRect(x0 - 2, y0 + 3 * (t + hu) - 2, 8 * (t + hu), t + 4, 8); c.fill();
  c.fillStyle = '#b18cff'; c.font = '900 17px "Segoe UI", sans-serif';
  c.textAlign = 'right'; c.textBaseline = 'middle';
  c.fillText('COMBO x3', A - 16, AL - 18);
}

function portadaSerpiente(c){
  fondo(c, '#0a1120', '#070c16');
  c.strokeStyle = 'rgba(90,120,190,.12)'; c.lineWidth = 1;
  c.beginPath();
  for (let x = 0; x < A; x += 24){ c.moveTo(x, 0); c.lineTo(x, AL); }
  for (let y = 0; y < AL; y += 24){ c.moveTo(0, y); c.lineTo(A, y); }
  c.stroke();
  const ruta = [[40,124],[64,124],[88,124],[88,100],[88,76],[112,76],[136,76],[160,76],[160,52],[184,52],[208,52],[232,52]];
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.shadowColor = '#6fe08b'; c.shadowBlur = 20;
  c.strokeStyle = '#6fe08b'; c.lineWidth = 17;
  c.beginPath(); ruta.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
  c.shadowBlur = 0;
  c.strokeStyle = '#c8ffd8'; c.lineWidth = 7;
  c.beginPath(); ruta.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
  c.fillStyle = '#0b1220';
  c.beginPath(); c.arc(236, 46, 3.2, 0, 6.3); c.arc(236, 58, 3.2, 0, 6.3); c.fill();
  // manzana
  c.shadowColor = '#ff5a72'; c.shadowBlur = 18;
  c.fillStyle = '#ff5a72';
  c.beginPath(); c.arc(288, 52, 11, 0, 6.3); c.fill();
  c.shadowBlur = 0;
  c.strokeStyle = '#6fe08b'; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(288, 41); c.quadraticCurveTo(293, 33, 300, 36); c.stroke();
  // fantasma
  c.font = '22px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('👻', 120, 130);
}

function portadaAviator(c){
  fondo(c, '#131b2e', '#0a0f1a');
  const halo = c.createRadialGradient(250, 60, 8, 250, 60, 190);
  halo.addColorStop(0, 'rgba(255,77,94,.22)'); halo.addColorStop(1, 'rgba(255,77,94,0)');
  c.fillStyle = halo; c.fillRect(0, 0, A, AL);
  c.fillStyle = '#cfe0ff';
  for (let i = 0; i < 40; i++) c.fillRect(azar(0, A), azar(0, AL), azar(0.8, 1.8), azar(0.8, 1.8));

  c.strokeStyle = 'rgba(180,200,240,.28)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(26, 12); c.lineTo(26, 146); c.lineTo(A-10, 146); c.stroke();

  // curva de vuelo
  const pts = [];
  for (let i = 0; i <= 40; i++){
    const u = 1 - Math.exp(-i/40 * 2.6), v = Math.pow(u, 2.1);
    pts.push([26 + (250-26)*u, 146 - (146-30)*v]);
  }
  c.beginPath(); c.moveTo(26, 146);
  pts.forEach(p => c.lineTo(p[0], p[1]));
  c.lineTo(pts[pts.length-1][0], 146); c.closePath();
  const rel = c.createLinearGradient(0, 20, 0, 146);
  rel.addColorStop(0, 'rgba(255,77,94,.35)'); rel.addColorStop(1, 'rgba(255,77,94,0)');
  c.fillStyle = rel; c.fill();
  c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
  c.strokeStyle = '#ff4d5e'; c.lineWidth = 3.5; c.lineJoin = 'round';
  c.shadowColor = '#ff4d5e'; c.shadowBlur = 14; c.stroke(); c.shadowBlur = 0;

  // avión
  const p = pts[pts.length-1];
  c.save(); c.translate(p[0], p[1]); c.rotate(-0.62);
  c.fillStyle = '#e4283c';
  c.beginPath(); c.moveTo(17, 0); c.quadraticCurveTo(6, -6, -12, -5);
  c.quadraticCurveTo(-18, -3, -18, 0); c.quadraticCurveTo(-18, 3, -12, 5);
  c.quadraticCurveTo(6, 6, 17, 0); c.closePath(); c.fill();
  c.fillStyle = '#a3162a';
  c.beginPath(); c.moveTo(2, 0); c.lineTo(-8, -12); c.lineTo(-13, -11); c.lineTo(-5, 0); c.closePath(); c.fill();
  c.fillStyle = 'rgba(200,230,255,.9)';
  c.beginPath(); c.ellipse(5, -2, 5, 2.6, 0, 0, 6.283); c.fill();
  c.restore();

  c.font = '900 42px "Segoe UI", system-ui, sans-serif';
  c.textAlign = 'right'; c.textBaseline = 'middle';
  c.fillStyle = '#c08bff'; c.shadowColor = '#c08bff'; c.shadowBlur = 16;
  c.fillText('2.47x', A - 18, 58);
  c.shadowBlur = 0;
}

function portadaPool(c){
  // marco de madera
  const m = c.createLinearGradient(0, 0, 0, AL);
  m.addColorStop(0, '#7a4c2a'); m.addColorStop(1, '#4f2d15');
  c.fillStyle = m; c.fillRect(0, 0, A, AL);
  const pano = c.createRadialGradient(A/2, AL/2, 20, A/2, AL/2, 230);
  pano.addColorStop(0, '#228554'); pano.addColorStop(1, '#0f4d30');
  c.fillStyle = pano; c.fillRect(20, 18, A-40, AL-36);

  // troneras
  [[20,18],[A/2,18],[A-20,18],[20,AL-18],[A/2,AL-18],[A-20,AL-18]].forEach(([x,y]) => {
    c.fillStyle = '#05070c';
    c.beginPath(); c.arc(x, y, 13, 0, 6.283); c.fill();
  });

  const bola = (x, y, col, num, rayada) => {
    c.fillStyle = 'rgba(0,0,0,.35)';
    c.beginPath(); c.ellipse(x+2, y+3, 11, 9, 0, 0, 6.283); c.fill();
    const g = c.createRadialGradient(x-4, y-5, 1.5, x, y, 12);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, col); g.addColorStop(1, '#00000066');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, 11, 0, 6.283); c.fill();
    if (rayada){
      c.save(); c.beginPath(); c.arc(x, y, 11, 0, 6.283); c.clip();
      c.fillStyle = '#f7f7f2';
      c.beginPath(); c.ellipse(x, y, 12, 4.6, 0, 0, 6.283); c.fill();
      c.restore();
    }
    if (num){
      c.fillStyle = '#f7f7f2';
      c.beginPath(); c.arc(x, y, 5, 0, 6.283); c.fill();
      c.fillStyle = '#15171d'; c.font = '700 8px "Segoe UI", sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(num, x, y + 0.5);
    }
    c.fillStyle = 'rgba(255,255,255,.6)';
    c.beginPath(); c.ellipse(x-4, y-5, 3, 2, -0.6, 0, 6.283); c.fill();
  };

  bola(232, 66, '#15171d', '8');
  bola(258, 88, '#f2c010', '9', true);
  bola(212, 100, '#cf2020', '3');
  bola(276, 52, '#1f4fc4', '2');
  // blanca y taco
  bola(96, 86, '#f7f7f2');
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.6;
  c.setLineDash([5, 5]);
  c.beginPath(); c.moveTo(96, 86); c.lineTo(214, 74); c.stroke();
  c.setLineDash([]);
  const t = c.createLinearGradient(70, 88, -40, 92);
  t.addColorStop(0, '#e8d3a8'); t.addColorStop(0.4, '#a9773f'); t.addColorStop(1, '#3d2210');
  c.strokeStyle = t; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(72, 88); c.lineTo(-30, 96); c.stroke();
}

function portadaRumble(c){
  const g = c.createLinearGradient(0, 0, 0, AL);
  g.addColorStop(0, '#2b2447'); g.addColorStop(1, '#1a1630');
  c.fillStyle = g; c.fillRect(0, 0, A, AL);
  for (let i = 0; i < 9; i++){
    c.fillStyle = i % 2 ? '#2f8f45' : '#288040';
    c.fillRect(14 + i*(A-28)/9, 14, (A-28)/9, AL-28);
  }
  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2;
  c.strokeRect(14, 14, A-28, AL-28);
  c.beginPath(); c.moveTo(A/2, 14); c.lineTo(A/2, AL-14); c.stroke();
  c.beginPath(); c.arc(A/2, AL/2, 34, 0, 6.283); c.stroke();
  // porterías
  c.strokeStyle = '#2f7fd8'; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(14, AL/2-34); c.lineTo(14, AL/2+34); c.stroke();
  c.strokeStyle = '#d8452f';
  c.beginPath(); c.moveTo(A-14, AL/2-34); c.lineTo(A-14, AL/2+34); c.stroke();

  const bicho = (x, y, icono, col, aro) => {
    c.fillStyle = 'rgba(0,0,0,.3)';
    c.beginPath(); c.ellipse(x, y+16, 16, 6, 0, 0, 6.283); c.fill();
    c.fillStyle = aro;
    c.beginPath(); c.arc(x, y, 21, 0, 6.283); c.fill();
    const gg = c.createRadialGradient(x-6, y-7, 3, x, y, 17);
    gg.addColorStop(0, '#ffffff'); gg.addColorStop(0.35, col); gg.addColorStop(1, '#00000055');
    c.fillStyle = gg;
    c.beginPath(); c.arc(x, y, 17, 0, 6.283); c.fill();
    c.font = '23px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(icono, x, y+1);
  };
  bicho(112, 96, '🦏', '#8fa0b5', '#2f7fd8');
  bicho(186, 62, '🐘', '#9aa7c4', '#2f7fd8');
  bicho(238, 108, '🐺', '#b58f7a', '#d8452f');

  // balón con destello
  c.fillStyle = '#ffd25e';
  for (let k = 0; k < 8; k++){
    const a = k * 0.785;
    c.globalAlpha = 0.5;
    c.beginPath();
    c.moveTo(150 + Math.cos(a)*16, 118 + Math.sin(a)*16);
    c.lineTo(150 + Math.cos(a+0.3)*26, 118 + Math.sin(a+0.3)*26);
    c.lineTo(150 + Math.cos(a-0.3)*26, 118 + Math.sin(a-0.3)*26);
    c.closePath(); c.fill();
  }
  c.globalAlpha = 1;
  const b = c.createRadialGradient(146, 114, 2, 150, 118, 13);
  b.addColorStop(0, '#fff'); b.addColorStop(1, '#9aa2b4');
  c.fillStyle = b;
  c.beginPath(); c.arc(150, 118, 13, 0, 6.283); c.fill();
  c.fillStyle = '#20242e';
  c.beginPath();
  for (let k = 0; k < 5; k++){
    const a = k * 1.2566 - Math.PI/2;
    c.lineTo(150 + Math.cos(a)*5.5, 118 + Math.sin(a)*5.5);
  }
  c.closePath(); c.fill();
}

// ---------- Montaje de las cartas ----------
const rejilla = document.getElementById('rejilla');
JUEGOS.forEach(j => {
  const a = document.createElement('a');
  a.className = 'carta';
  a.href = j.archivo;
  a.innerHTML =
    (j.nuevo ? '<div class="cinta">NUEVO</div>' : '') +
    '<div class="marco"><canvas width="' + A + '" height="' + AL + '"></canvas></div>' +
    '<div class="info">' +
      '<div class="nom">' + j.nombre + '<span class="genero">' + j.genero + '</span></div>' +
      '<div class="desc">' + j.desc + '</div>' +
      '<div class="pie"><span class="record">' + j.record() + '</span><span class="jugar">JUGAR ▸</span></div>' +
    '</div>';
  rejilla.appendChild(a);
  j.portada(a.querySelector('canvas').getContext('2d'));
});

// Al volver de un juego se repintan la cartera y los récords de las tarjetas
function refrescarPortada(){
  document.getElementById('fichasTxt').textContent =
    Arcade.fichas.saldo().toLocaleString('es-ES');
  JUEGOS.forEach((j, i) => {
    const marca = rejilla.children[i] && rejilla.children[i].querySelector('.record');
    if (marca) marca.textContent = j.record();
  });
}
window.refrescarPortada = refrescarPortada;
refrescarPortada();
addEventListener('pageshow', refrescarPortada);
addEventListener('focus', refrescarPortada);

document.getElementById('btnBorrar').onclick = () => {
  if (!confirm('¿Seguro que quieres borrar todos tus récords y el saldo de Minas?')) return;
  try {
    Object.keys(localStorage)
      .filter(k => k.startsWith('arcade_') || k.startsWith('nexo_record_'))
      .forEach(k => localStorage.removeItem(k));
  } catch(e){}
  location.reload();
};
