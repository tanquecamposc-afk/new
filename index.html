<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tiny Fishing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Interfaz de Usuario -->
        <div id="ui-layer">
            <div class="top-bar">
                <div class="money-container">$<span id="cash">0</span></div>
            </div>

            <!-- Notificaciones flotantes -->
            <div id="floating-text-container"></div>

            <!-- Menú Inferior -->
            <div id="upgrade-menu" class="menu-panel">
                <button id="btn-play" class="btn-play" aria-label="Lanzar anzuelo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M15 3v10a5 5 0 0 1-10 0v-2" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
                        <circle cx="15" cy="3" r="1.7" fill="#fff"/>
                    </svg>
                    <span>PLAY</span>
                </button>
                <div class="upgrade-cards">
                    <div class="card" id="card-fish">
                        <h4>Capacidad</h4>
                        <p>Nvl <span id="lvl-fish">1</span></p>
                        <button id="btn-upg-fish" class="btn-buy">$10</button>
                    </div>
                    <div class="card" id="card-depth">
                        <h4>Profundidad</h4>
                        <p>Nvl <span id="lvl-depth">1</span></p>
                        <button id="btn-upg-depth" class="btn-buy">$10</button>
                    </div>
                    <div class="card" id="card-offline">
                        <h4>Offline $</h4>
                        <p>Nvl <span id="lvl-offline">1</span></p>
                        <button id="btn-upg-offline" class="btn-buy">$10</button>
                    </div>
                    <div class="card" id="card-speed">
                        <h4>Carrete</h4>
                        <p>Nvl <span id="lvl-speed">1</span></p>
                        <button id="btn-upg-speed" class="btn-buy">$10</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
