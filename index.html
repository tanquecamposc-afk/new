<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Perfect Tiny Fishing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Interfaz de Usuario -->
        <div id="ui-layer">
            <div class="top-bar">
                <div class="money-container">
                    <span class="icon">💰</span> $<span id="cash">0</span>
                </div>
            </div>

            <!-- Notificaciones flotantes -->
            <div id="floating-text-container"></div>

            <!-- Menú Inferior -->
            <div id="upgrade-menu" class="menu-panel">
                <div class="upgrade-cards">
                    <div class="card" id="card-fish">
                        <h4>Peces Max</h4>
                        <p>Nvl <span id="lvl-fish">1</span></p>
                        <button id="btn-upg-fish" class="btn-buy">$10</button>
                    </div>
                    <div class="card" id="card-depth">
                        <h4>Profundidad</h4>
                        <p>Nvl <span id="lvl-depth">1</span></p>
                        <button id="btn-upg-depth" class="btn-buy">$10</button>
                    </div>
                    <div class="card" id="card-offline">
                        <h4>Offline $</h4>
                        <p>Nvl <span id="lvl-offline">1</span></p>
                        <button id="btn-upg-offline" class="btn-buy">$10</button>
                    </div>
                </div>
                <button id="btn-play" class="btn-massive">¡LANZAR ANZUELO!</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
