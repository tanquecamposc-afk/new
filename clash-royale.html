/* ------------------------------ TORRES -------------------------------- */
function drawTowerB(b) {
  const px = b.pos.x, py = b.pos.y;
  const mine = b.team === 'player';
  const king = b.kind === 'king';
  const col = mine
    ? { main: '#3f7fd6', dark: '#204a80', lite: '#8fc4ff' }
    : { main: '#d24a44', dark: '#7d251f', lite: '#ff9c96' };
  const w = king ? 62 : 50, h = king ? 66 : 58;
  const top = py - h / 2, bot = py + h / 2;
  const dim = king && !b.active;

  ctx.save();
  if (dim) ctx.globalAlpha = 0.72;

  /* sombra */
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(px, bot - 2, w * .56, 8, 0, 0, TAU); ctx.fill();

  /* cuerpo de piedra con juntas */
  const sg = ctx.createLinearGradient(px - w / 2, 0, px + w / 2, 0);
  sg.addColorStop(0, '#7d8391'); sg.addColorStop(.35, '#a7adba'); sg.addColorStop(1, '#6e7482');
  ctx.fillStyle = sg;
  rr(px - w / 2, top + 12, w, h - 12, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.2;
  for (let i = 1; i < 4; i++) {
    const yy = top + 12 + ((h - 12) / 4) * i;
    ctx.beginPath(); ctx.moveTo(px - w / 2 + 3, yy); ctx.lineTo(px + w / 2 - 3, yy); ctx.stroke();
    const off = (i % 2) ? -w / 6 : w / 6;
    ctx.beginPath(); ctx.moveTo(px + off, yy); ctx.lineTo(px + off, yy - (h - 12) / 4); ctx.stroke();
  }
  /* zócalo */
  ctx.strokeStyle = 'rgba(12,16,26,.45)'; ctx.lineWidth = 2;
  rr(px - w / 2, top + 12, w, h - 12, 7); ctx.stroke();
  ctx.fillStyle = '#5d6371';
  rr(px - w / 2 - 2, bot - 11, w + 4, 11, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(12,16,26,.45)'; ctx.lineWidth = 1.5;
  rr(px - w / 2 - 2, bot - 11, w + 4, 11, 4); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.13)';
  rr(px - w / 2 - 2, bot - 11, w + 4, 3.5, 2); ctx.fill();

  /* franja del equipo + emblema */
  ctx.fillStyle = col.main;
  rr(px - w / 2 + 3, top + 14, w - 6, 17, 4); ctx.fill();
  ctx.fillStyle = col.dark;
  rr(px - w / 2 + 3, top + 26, w - 6, 5, 2); ctx.fill();
  if (king) {
    ctx.fillStyle = b.active ? '#ffd75e' : '#9a9686';
    const cx = px, cy = py + 12;
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy + 6); ctx.lineTo(cx - 14, cy - 7); ctx.lineTo(cx - 6, cy - 1);
    ctx.lineTo(cx, cy - 10); ctx.lineTo(cx + 6, cy - 1); ctx.lineTo(cx + 14, cy - 7);
    ctx.lineTo(cx + 12, cy + 6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  } else {
    /* saetera */
    ctx.fillStyle = '#2a2f3d';
    rr(px - 3, py + 4, 6, 15, 3); ctx.fill();
  }

  /* almenas */
  const n = king ? 5 : 4, seg = (w + 4) / n;
  ctx.fillStyle = '#b6bcc9';
  for (let i = 0; i < n; i++) {
    if (i % 2 === 0) {
      const bx = px - w / 2 - 2 + i * seg;
      rr(bx, top - 5, seg - 2, 12, 2); ctx.fill();
    }
  }
  ctx.fillStyle = '#8f96a4';
  rr(px - w / 2 - 3, top + 4, w + 6, 9, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  rr(px - w / 2 - 3, top + 4, w + 6, 3, 2); ctx.fill();

  /* torreta que apunta al objetivo */
  const gy = top + 8;
  const rBase = king ? 12 : 10.5;
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.ellipse(px, gy + 4, rBase + 1, rBase * .55, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(px, gy);
  ctx.rotate(b.angle);
  const recoil = b.fire > 0 ? -3.5 : 0;
  const len = king ? 19 : 16, gr = king ? 5.5 : 5;
  ctx.fillStyle = '#1d2230';
  rr(recoil, -gr - 1, len + 2, gr * 2 + 2, gr); ctx.fill();
  ctx.fillStyle = '#454c60';
  rr(recoil + 1, -gr, len, gr * 2, gr); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  rr(recoil + 2, -gr + .5, len - 3, gr * .7, gr * .5); ctx.fill();
  ctx.fillStyle = '#20263a';
  circle(recoil + len, 0, gr * .92); ctx.fill();
  if (b.fire > 0) {
    ctx.fillStyle = 'rgba(255,214,130,' + clamp(b.fire * 6, 0, 1).toFixed(2) + ')';
    circle(recoil + len + 3, 0, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + clamp(b.fire * 5, 0, 1).toFixed(2) + ')';
    circle(recoil + len + 2, 0, 2.6); ctx.fill();
  }
  ctx.restore();
  const tg = ctx.createRadialGradient(px - 3, gy - 4, 1, px, gy, rBase);
  tg.addColorStop(0, mine ? '#7fb4ff' : '#ff9b95');
  tg.addColorStop(1, mine ? '#245291' : '#8e2e28');
  ctx.fillStyle = tg;
  circle(px, gy, rBase); ctx.fill();
  ctx.strokeStyle = 'rgba(10,14,24,.55)'; ctx.lineWidth = 2; ctx.stroke();

  /* estandarte ondeando */
  if (!king) {
    const wav = Math.sin(G.t * 3 + px) * 2.2;
    ctx.strokeStyle = '#464c5e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px + w / 2 - 4, top - 4); ctx.lineTo(px + w / 2 - 4, top - 22); ctx.stroke();
    ctx.fillStyle = col.main;
    ctx.beginPath();
    ctx.moveTo(px + w / 2 - 4, top - 22);
    ctx.quadraticCurveTo(px + w / 2 - 12 + wav, top - 20, px + w / 2 - 19, top - 17 + wav);
    ctx.lineTo(px + w / 2 - 19, top - 11 + wav);
    ctx.quadraticCurveTo(px + w / 2 - 12 - wav, top - 12, px + w / 2 - 4, top - 10);
    ctx.closePath(); ctx.fill();
  }

  /* grietas y humo al bajar la vida */
  if (b.pct < 0.62) {
    ctx.strokeStyle = 'rgba(25,20,18,' + (0.35 + (0.62 - b.pct)).toFixed(2) + ')';
    ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px - w * .22, top + 34); ctx.lineTo(px - w * .05, top + 42);
    ctx.lineTo(px - w * .16, top + 49); ctx.lineTo(px - w * .02, bot - 12);
    ctx.stroke();
    if (b.pct < 0.34) {
      ctx.beginPath();
      ctx.moveTo(px + w * .28, top + 30); ctx.lineTo(px + w * .12, top + 40);
      ctx.lineTo(px + w * .26, top + 47);
      ctx.stroke();
      for (let i = 0; i < 3; i++) {
        const t = (G.t * .6 + i * .33) % 1;
        ctx.fillStyle = 'rgba(60,60,66,' + (0.30 * (1 - t)).toFixed(2) + ')';
        circle(px + Math.sin(G.t * 1.6 + i * 2) * 7, top + 8 - t * 26, 4 + t * 8);
        ctx.fill();
      }
    }
  }

  /* destello al recibir daño */
  if (b.hitFlash > 0) {
    ctx.globalAlpha = clamp(b.hitFlash * 3.6, 0, .7);
    ctx.fillStyle = '#fff';
    rr(px - w / 2 - 3, top - 5, w + 6, h + 5, 7); ctx.fill();
    ctx.globalAlpha = dim ? 0.72 : 1;
  }
  ctx.restore();

  if (dim) {
    ctx.save();
    ctx.font = '900 8px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.fillText('DORMIDO', px, bot + 10);
    ctx.restore();
  }
  healthBar(b, king ? 56 : 46, h / 2 + (king ? 26 : 30));
}

function drawStructure(b) {
  const px = b.pos.x, py = b.pos.y;
  const art = b.card.art;
  const cannon = b.card.id === 'CANNON';
  ctx.save();
  const sc = b.deployed ? 1 : clamp(1 - b.deployT, .35, 1);
  ctx.translate(px, py); ctx.scale(sc, sc); ctx.translate(-px, -py);

  /* sombra y base de piedra */
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(px, py + 13, 19, 7, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7c8290';
  rr(px - 18, py - 1, 36, 16, 5); ctx.fill();
  ctx.fillStyle = '#5d6371';
  rr(px - 18, py + 8, 36, 7, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(12,16,26,.5)'; ctx.lineWidth = 1.8;
  rr(px - 18, py - 1, 36, 16, 5); ctx.stroke();

  if (cannon) {
    /* cureña + tubo */
    ctx.fillStyle = art.trim;
    rr(px - 13, py - 9, 26, 12, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(12,16,26,.55)'; ctx.lineWidth = 1.6;
    rr(px - 13, py - 9, 26, 12, 4); ctx.stroke();
    ctx.fillStyle = '#2f3542';
    circle(px - 9, py + 3, 5); ctx.fill();
    circle(px + 9, py + 3, 5); ctx.fill();
    ctx.save();
    ctx.translate(px, py - 8);
    ctx.rotate(b.angle);
    const rec = b.fire > 0 ? -3 : 0;
    ctx.fillStyle = '#1d2230';
    rr(rec - 1, -6, 24, 12, 6); ctx.fill();
    ctx.fillStyle = art.body;
    rr(rec, -5, 22, 10, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    rr(rec + 2, -4.2, 17, 3, 2); ctx.fill();
    ctx.fillStyle = '#181d29';
    circle(rec + 22, 0, 4.6); ctx.fill();
    if (b.fire > 0) {
      ctx.fillStyle = 'rgba(255,214,130,' + clamp(b.fire * 6, 0, 1).toFixed(2) + ')';
      circle(rec + 26, 0, 6); ctx.fill();
    }
    ctx.restore();
  } else {
    /* torre infierno */
    ctx.fillStyle = art.body;
    ctx.beginPath();
    ctx.moveTo(px - 13, py + 1);
    ctx.lineTo(px - 9, py - 20);
    ctx.lineTo(px + 9, py - 20);
    ctx.lineTo(px + 13, py + 1);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(12,16,26,.55)'; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.fillStyle = '#2a1c18';
    rr(px - 11, py - 25, 22, 8, 3); ctx.fill();
    const glow = 0.45 + 0.55 * Math.abs(Math.sin(G.t * 6));
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255,140,40,.9)';
    ctx.fillStyle = 'rgba(255,150,50,' + glow.toFixed(2) + ')';
    circle(px, py - 22, 6.5); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffeab0';
    circle(px, py - 22, 3); ctx.fill();
  }

  if (b.hitFlash > 0) {
    ctx.globalAlpha = clamp(b.hitFlash * 3.6, 0, .7); ctx.fillStyle = '#fff';
    rr(px - 18, py - 26, 36, 42, 6); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.restore();

  /* cuenta atrás de vida, pegada a la base */
  if (b.life > 0 && b.card.life) {
    const f = clamp(b.life / b.card.life, 0, 1);
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(px, py + 6, 21, 0.14 * Math.PI, 0.86 * Math.PI); ctx.stroke();
    ctx.strokeStyle = b.team === 'player' ? 'rgba(140,215,255,.95)' : 'rgba(255,150,150,.95)';
    ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(px, py + 6, 21, 0.86 * Math.PI - (0.72 * Math.PI) * f, 0.86 * Math.PI);
    ctx.stroke();
  }

  /* rayo de la torre infierno */
  if (b.beam && b.beam.alive) {
    ctx.save();
    const w = 2 + b.ramp * 1.2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,140,40,.85)'; ctx.lineWidth = w + 4;
    ctx.beginPath(); ctx.moveTo(px, py - 22); ctx.lineTo(b.beam.pos.x, b.beam.pos.y); ctx.stroke();
    ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = Math.max(1.2, w * .5);
    ctx.beginPath(); ctx.moveTo(px, py - 22); ctx.lineTo(b.beam.pos.x, b.beam.pos.y); ctx.stroke();
    ctx.restore();
  }
  healthBar(b, 34, 34);
}

/* ------------------------- PERSONAJES (TROPAS) ------------------------ */
/* ink != null dibuja la silueta (contorno) con un único color */
function weapon(art, R, u, ink) {
  const w = art.weapon;
  if (!w || w === 'claw' || w === 'fire') return;
  ctx.save();
  const sw = u.swing > 0 ? Math.sin((0.24 - u.swing) / 0.24 * Math.PI) : 0;
  ctx.translate(R * 0.58, -R * 0.26);
  ctx.rotate(-sw * 1.6);
  const madera = ink || '#7a5230', metal = ink || '#dfe6f2', oscuro = ink || '#3c4356';
  switch (w) {
    case 'sword':
      ctx.fillStyle = oscuro; rr(-2.5, -2, 6, 9, 1.5); ctx.fill();
      ctx.fillStyle = metal; rr(-1.8, -R * 1.0, 4, R * 1.0, 2); ctx.fill();
      break;
    case 'greatsword':
      ctx.fillStyle = oscuro; rr(-3.5, -1, 8, 10, 2); ctx.fill();
      ctx.fillStyle = ink || art.trim; rr(-3, -R * 1.55, 6.5, R * 1.55, 2.5); ctx.fill();
      break;
    case 'axe':
      ctx.fillStyle = madera; rr(-2, -R * 1.05, 4, R * 1.3, 2); ctx.fill();
      ctx.fillStyle = ink || '#cfd8e6';
      ctx.beginPath();
      ctx.moveTo(1, -R * 1.05); ctx.quadraticCurveTo(R * .85, -R * .95, R * .8, -R * .45);
      ctx.quadraticCurveTo(R * .4, -R * .3, 1, -R * .35); ctx.closePath(); ctx.fill();
      break;
    case 'hammer':
      ctx.fillStyle = madera; rr(-2, -R * 1.05, 4, R * 1.25, 2); ctx.fill();
      ctx.fillStyle = ink || '#98a0b0'; rr(-R * .28, -R * 1.25, R * .9, R * .5, 3); ctx.fill();
      break;
    case 'pick':
      ctx.fillStyle = madera; rr(-2, -R * 1.05, 4, R * 1.25, 2); ctx.fill();
      ctx.strokeStyle = ink || '#b9c2d0'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, -R * 1.0, R * .6, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
      break;
    case 'bow':
      ctx.strokeStyle = ink || '#8a5a2a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, -R * 0.42, R * 0.66, -1.15, 1.15); ctx.stroke();
      ctx.strokeStyle = ink || 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(R * 0.27, -R * 1.05); ctx.lineTo(R * 0.27, R * 0.2); ctx.stroke();
      break;
    case 'gun':
      ctx.fillStyle = ink || '#39404f'; rr(-R * .25, -R * .6, R * 1.35, R * .32, 3); ctx.fill();
      ctx.fillStyle = madera; rr(-R * .38, -R * .5, R * .42, R * .5, 3); ctx.fill();
      break;
    case 'staff':
      ctx.fillStyle = madera; rr(-2, -R * 1.15, 4, R * 1.6, 2); ctx.fill();
      if (!ink) {
        ctx.save();
        ctx.shadowBlur = 8; ctx.shadowColor = art.trim;
        ctx.fillStyle = art.trim; circle(0, -R * 1.32, R * 0.32); ctx.fill();
        ctx.restore();
      } else { ctx.fillStyle = ink; circle(0, -R * 1.32, R * 0.36); ctx.fill(); }
      break;
    case 'coil':
      ctx.strokeStyle = ink || art.trim; ctx.lineWidth = 2.4;
      circle(0, -R * 0.62, R * 0.42); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-R * .32, -R * .62); ctx.lineTo(0, -R * .95);
      ctx.lineTo(R * .1, -R * .5); ctx.lineTo(R * .42, -R * .85);
      ctx.stroke();
      break;
    case 'bone':
      ctx.fillStyle = ink || '#efefe6'; rr(-2, -R * .95, 4, R * .95, 2); ctx.fill();
      circle(0, -R * 1.0, 3); ctx.fill();
      break;
    case 'fist':
      ctx.fillStyle = ink || shade(art.body, 34);
      circle(R * 0.12, -R * 0.3, R * 0.42); ctx.fill();
      if (!ink) {
        ctx.strokeStyle = art.trim; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        circle(R * 0.04, -R * 0.4, R * 0.15); ctx.fill();
      }
      break;
    default: break;
  }
  ctx.restore();
}

function troopBody(u, art, R, ink) {
  const shape = art.shape || 'humano';
  const legs = u.walking ? Math.sin(u.anim) * R * 0.32 : 0;
  const cuerpo = ink || art.body, piel = ink || art.skin, adorno = ink || art.trim;

  if (shape === 'volador') {
    const flap = Math.sin(G.t * 12 + u.hover) * 0.55;
    ctx.fillStyle = ink || shade(art.body, -32);
    ctx.beginPath();
    ctx.moveTo(-R * .2, -R * .35);
    ctx.quadraticCurveTo(-R * 1.2, -R * (1.05 + flap), -R * 1.55, -R * (.5 + flap));
    ctx.quadraticCurveTo(-R * .9, -R * .2, -R * .3, R * .22);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(R * .2, -R * .35);
    ctx.quadraticCurveTo(R * 1.2, -R * (1.05 - flap), R * 1.55, -R * (.5 - flap));
    ctx.quadraticCurveTo(R * .9, -R * .2, R * .3, R * .22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = cuerpo;
    ctx.beginPath(); ctx.ellipse(0, 0, R * .64, R * .74, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = ink || shade(art.body, 25);
    ctx.beginPath(); ctx.ellipse(-R * .05, R * .12, R * .38, R * .45, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = piel;
    circle(R * .22, -R * .78, R * .46); ctx.fill();
    if (!ink) {
      ctx.fillStyle = '#20242f';
      circle(R * .4, -R * .86, R * .11); ctx.fill();
      if (art.weapon === 'fire') {
        ctx.fillStyle = 'rgba(255,150,50,.95)'; circle(R * .66, -R * .64, R * .17); ctx.fill();
        ctx.fillStyle = '#ffe9a8'; circle(R * .68, -R * .64, R * .08); ctx.fill();
      }
    }
    return;
  }
  if (shape === 'hueso') {
    ctx.strokeStyle = cuerpo; ctx.lineWidth = R * 0.3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-R * .26 + legs, R * .62); ctx.lineTo(-R * .1, -R * .12);
    ctx.moveTo(R * .26 - legs, R * .62); ctx.lineTo(R * .1, -R * .12);
    ctx.moveTo(0, -R * .12); ctx.lineTo(0, -R * .62);
    ctx.stroke();
    ctx.fillStyle = piel;
    circle(0, -R * .98, R * .45); ctx.fill();
    if (!ink) {
      ctx.fillStyle = '#1b1f2a';
      circle(-R * .16, -R * 1.02, R * .11); ctx.fill();
      circle(R * .19, -R * 1.02, R * .11); ctx.fill();
      ctx.fillRect(-R * .12, -R * .82, R * .24, R * .07);
    }
    weapon(art, R, u, ink);
    return;
  }
  if (shape === 'maquina') {
    ctx.fillStyle = ink || '#343a48';
    circle(-R * .48, R * .38, R * .32); ctx.fill();
    circle(R * .48, R * .38, R * .32); ctx.fill();
    ctx.fillStyle = cuerpo;
    rr(-R * .72, -R * .58, R * 1.44, R * 1.0, R * .3); ctx.fill();
    ctx.fillStyle = ink || shade(art.body, -30);
    rr(-R * .72, -R * .12, R * 1.44, R * .2, R * .1); ctx.fill();
    const charge = clamp(1 - u.cool / u.rate, 0, 1);
    if (ink) { ctx.fillStyle = ink; circle(R * .08, -R * .98, R * .5); ctx.fill(); }
    else {
      ctx.fillStyle = 'rgba(70,215,255,' + (0.25 + charge * 0.7).toFixed(2) + ')';
      circle(R * .08, -R * .98, R * .46 * (0.72 + charge * 0.45)); ctx.fill();
      ctx.strokeStyle = art.trim; ctx.lineWidth = 2.2;
      circle(R * .08, -R * .98, R * .46); ctx.stroke();
      if (charge > 0.8) {
        ctx.strokeStyle = '#d8f8ff'; ctx.lineWidth = 1.6;
        for (let i = 0; i < 3; i++) {
          const a = rnd(TAU);
          ctx.beginPath();
          ctx.moveTo(R * .08, -R * .98);
          ctx.lineTo(R * .08 + Math.cos(a) * R * .95, -R * .98 + Math.sin(a) * R * .95);
          ctx.stroke();
        }
      }
    }
    return;
  }
  if (shape === 'jinete') {
    ctx.fillStyle = ink || '#6d4a2c';
    rr(-R * .9, -R * .12, R * 1.8, R * .8, R * .36); ctx.fill();
    ctx.fillStyle = ink || '#5a3c22';
    rr(R * .58, -R * .34, R * .6, R * .5, R * .22); ctx.fill();
    if (!ink) { ctx.fillStyle = '#241a12'; circle(R * 1.06, -R * .12, R * .09); ctx.fill(); }
    ctx.fillStyle = ink || '#2b2b2b';
    rr(-R * .62 + legs, R * .56, R * .3, R * .34, 2); ctx.fill();
    rr(R * .34 - legs, R * .56, R * .3, R * .34, 2); ctx.fill();
    ctx.fillStyle = cuerpo;
    rr(-R * .48, -R * 1.0, R * .9, R * 1.0, R * .32); ctx.fill();
    ctx.fillStyle = piel;
    circle(0, -R * 1.3, R * .4); ctx.fill();
    ctx.fillStyle = adorno;
    ctx.beginPath(); ctx.arc(0, -R * 1.3, R * .42, Math.PI, TAU); ctx.fill();
    weapon(art, R, u, ink);
    return;
  }

  /* humano / gigante / armadura */
  const big = shape === 'gigante' || shape === 'armadura';
  const bw = big ? .82 : .64;
  ctx.fillStyle = ink || shade(art.body, -52);
  rr(-R * .52 + legs, R * .02, R * .4, R * .72, 3); ctx.fill();
  rr(R * .12 - legs, R * .02, R * .4, R * .72, 3); ctx.fill();
  ctx.fillStyle = ink || '#2c313d';
  rr(-R * .56 + legs, R * .62, R * .46, R * .18, 3); ctx.fill();
  rr(R * .1 - legs, R * .62, R * .46, R * .18, 3); ctx.fill();
  ctx.fillStyle = cuerpo;
  rr(-R * bw, -R * .88, R * bw * 2, R * 1.02, R * .38); ctx.fill();
  ctx.fillStyle = ink || shade(art.body, -22);
  rr(-R * bw, -R * .2, R * bw * 2, R * .34, R * .14); ctx.fill();
  ctx.fillStyle = adorno;
  rr(-R * bw, -R * .16, R * bw * 2, R * .17, R * .06); ctx.fill();
  if (shape === 'armadura') {
    ctx.fillStyle = ink || shade(art.body, 30);
    rr(-R * (bw + .18), -R * .9, R * .46, R * .54, R * .2); ctx.fill();
    rr(R * (bw - .28), -R * .9, R * .46, R * .54, R * .2); ctx.fill();
  }
  ctx.fillStyle = piel;
  circle(0, -R * 1.18, R * .46); ctx.fill();
  ctx.fillStyle = adorno;
  ctx.beginPath(); ctx.arc(0, -R * 1.18, R * .48, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = adorno;
  rr(-R * .5, -R * 1.22, R * 1.0, R * .1, R * .05); ctx.fill();
  if (!ink) {
    if (shape === 'armadura') {
      ctx.save();
      ctx.shadowBlur = 7; ctx.shadowColor = art.trim;
      ctx.fillStyle = art.trim;
      rr(-R * .3, -R * 1.22, R * .62, R * .12, R * .05); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#222733';
      circle(R * .16, -R * 1.14, R * .085); ctx.fill();
      circle(-R * .1, -R * 1.14, R * .085); ctx.fill();
    }
  }
  weapon(art, R, u, ink);
}

function drawTroop(u) {
  const art = u.card.art || { body: '#888', trim: '#eee', skin: '#ddd', shape: 'humano' };
  const x = u.pos.x, y = u.pos.y, R = u.radius * 1.22;
  ctx.save();

  if (!u.deployed) {
    const total = u.card.tunnel ? 1.3 : 1.0;
    const t = clamp(1 - u.deployT / total, 0, 1);
    if (u.card.tunnel) {
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(x, y + 3, 14 + t * 7, 6 + t * 3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#6b4a24';
      ctx.beginPath(); ctx.ellipse(x, y, 12 + t * 6, 5 + t * 3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a6430';
      ctx.beginPath(); ctx.ellipse(x, y - 2, 8 + t * 4, 3 + t * 2, 0, 0, TAU); ctx.fill();
      if (Math.random() < 0.3) G.parts.push(new Part(x + rnd(8, -8), y, { c: '#8a6430', s: 2.5, life: .4, vy: -40, g: 140 }));
      ctx.restore(); return;
    }
    ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    ctx.strokeStyle = 'rgba(170,220,255,' + (1 - t).toFixed(2) + ')';
    ctx.lineWidth = 2.5;
    circle(x, y, R + 4 + 24 * (1 - t)); ctx.stroke();
    ctx.translate(x, y); ctx.scale(0.4 + t * 0.6, 0.4 + t * 0.6); ctx.translate(-x, -y);
  }

  const hover = u.air ? -16 + Math.sin(G.t * 4 + u.hover) * 2.6 : 0;
  const bob = u.walking && !u.air ? Math.abs(Math.sin(u.anim)) * 1.7 : 0;
  const mine = u.team === 'player';

  /* sombra */
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath();
  ctx.ellipse(x, y + R * 0.55, R * (u.air ? 0.55 : 0.8), R * 0.32, 0, 0, TAU);
  ctx.fill();

  /* base de color del equipo */
  const rg = ctx.createRadialGradient(x, y + R * .55, 1, x, y + R * .55, R * .95);
  rg.addColorStop(0, mine ? 'rgba(90,180,255,.55)' : 'rgba(255,100,100,.55)');
  rg.addColorStop(1, mine ? 'rgba(90,180,255,0)' : 'rgba(255,100,100,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.ellipse(x, y + R * .55, R * .95, R * .42, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = mine ? 'rgba(120,200,255,.95)' : 'rgba(255,125,125,.95)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y + R * .55, R * .82, R * .34, 0, 0, TAU); ctx.stroke();
  if (u.card.rarity === 'Legendary') {
    ctx.strokeStyle = 'rgba(90,235,255,.75)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, y + R * .55, R * .96, R * .42, 0, 0, TAU); ctx.stroke();
  }
  if (u.rage) {
    ctx.save(); ctx.globalAlpha = .32; ctx.fillStyle = '#d24bff';
    circle(x, y + hover - R * 0.3, R * 1.3); ctx.fill(); ctx.restore();
  }

  ctx.save();
  ctx.translate(x, y + hover - bob);
  const lean = u.swing > 0 ? Math.sin((0.24 - u.swing) / 0.24 * Math.PI) * 0.16 : 0;
  ctx.rotate(lean * u.face);
  ctx.scale(u.face, 1);
  /* silueta oscura para recortar sobre el césped */
  ctx.save();
  ctx.translate(0, -R * .3); ctx.scale(1.14, 1.14); ctx.translate(0, R * .3);
  troopBody(u, art, R, 'rgba(14,18,30,.9)');
  ctx.restore();
  troopBody(u, art, R, null);
  ctx.restore();

  if (u.hitFlash > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(u.hitFlash * 3.5, 0, .7);
    ctx.fillStyle = '#fff';
    circle(x, y + hover - R * .35, R * 1.05); ctx.fill();
    ctx.restore();
  }
  if (u.stun > 0) {
    ctx.save();
    ctx.strokeStyle = '#ffe37a'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = G.t * 7 + i * TAU / 3;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 10, y + hover - R * 1.75 + Math.sin(a) * 3.5, 2.2, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
  healthBar(u, clamp(R * 1.75, 16, 30), R * 2.05 + (u.air ? 18 : 0));
}

/* ------------------------- EFECTOS Y DISPAROS ------------------------- */
function drawShot(s) {
  ctx.save();
  if (s.kind === 'arrow') {
    ctx.translate(s.pos.x, s.pos.y); ctx.rotate(s.angle);
    ctx.strokeStyle = '#e8e2cf'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(6, 0); ctx.stroke();
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(1, -2.5); ctx.lineTo(1, 2.5); ctx.closePath(); ctx.fill();
  } else if (s.kind === 'bolt') {
    ctx.strokeStyle = s.color; ctx.lineWidth = 2.5;
    ctx.shadowBlur = 8; ctx.shadowColor = s.color;
    ctx.beginPath();
    ctx.moveTo(s.pos.x - Math.cos(s.angle) * 9, s.pos.y - Math.sin(s.angle) * 9);
    ctx.lineTo(s.pos.x + rnd(3, -3), s.pos.y + rnd(3, -3));
    ctx.lineTo(s.pos.x + Math.cos(s.angle) * 5, s.pos.y + Math.sin(s.angle) * 5);
    ctx.stroke();
  } else {
    const r = s.o.splash ? 6 : 4.5;
    const g = ctx.createRadialGradient(s.pos.x, s.pos.y, 0, s.pos.x, s.pos.y, r * 2.2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.35, s.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    circle(s.pos.x, s.pos.y, r * 2.2); ctx.fill();
  }
  ctx.restore();
}
function drawPart(p) {
  const a = clamp(p.life / p.max, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  if (p.shape === 'ring') {
    ctx.strokeStyle = p.c; ctx.lineWidth = 3 * a;
    circle(p.x, p.y, p.s * (1.15 - a * 0.55)); ctx.stroke();
  } else if (p.shape === 'ci') {
    ctx.fillStyle = p.c; circle(p.x, p.y, p.s * a); ctx.fill();
  } else {
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.restore();
}
function drawZone(z) {
  const a = clamp(z.life / z.max, 0, 1);
  ctx.save();
  const grd = ctx.createRadialGradient(z.x, z.y, z.r * .2, z.x, z.y, z.r);
  grd.addColorStop(0, 'rgba(210,75,255,.30)');
  grd.addColorStop(.7, 'rgba(180,60,255,.20)');
  grd.addColorStop(1, 'rgba(140,40,220,.04)');
  ctx.globalAlpha = .75 + .25 * Math.abs(Math.sin(G.t * 3));
  ctx.fillStyle = grd;
  circle(z.x, z.y, z.r); ctx.fill();
  ctx.globalAlpha = .6 * a;
  ctx.strokeStyle = '#f0a6ff'; ctx.lineWidth = 2;
  circle(z.x, z.y, z.r); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const ang = G.t * 1.4 + i * TAU / 6;
    const rr2 = z.r * .72;
    ctx.beginPath();
    ctx.moveTo(z.x + Math.cos(ang) * rr2, z.y + Math.sin(ang) * rr2 - 6);
    ctx.lineTo(z.x + Math.cos(ang) * rr2 - 4, z.y + Math.sin(ang) * rr2 + 2);
    ctx.lineTo(z.x + Math.cos(ang) * rr2 + 4, z.y + Math.sin(ang) * rr2 + 2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawCast(c) {
  const p = clamp(1 - c.delay / c.total, 0, 1);
  ctx.save();
  ctx.strokeStyle = c.card.color; ctx.lineWidth = 2;
  ctx.globalAlpha = .8;
  ctx.setLineDash([6, 5]);
  circle(c.x, c.y, c.card.radius); ctx.stroke();
  ctx.setLineDash([]);
  if (!c.card.rage) {
    const fy = c.y - 260 * (1 - p);
    const g = ctx.createRadialGradient(c.x, fy, 0, c.x, fy, 14);
    g.addColorStop(0, '#fff'); g.addColorStop(.4, c.card.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g;
    circle(c.x, fy, 14); ctx.fill();
  }
  ctx.restore();
}
function drawFloat(f) {
  const a = clamp(f.life / f.max, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '900 15px system-ui, sans-serif';
  ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  const yy = f.y - (1 - a) * 26;
  ctx.strokeText(f.text, f.x, yy);
  ctx.fillStyle = f.color;
  ctx.fillText(f.text, f.x, yy);
  ctx.restore();
}
function drawEmote(e) {
  const a = clamp(e.life / 2.2, 0, 1);
  const yy = e.y - (1 - a) * 22;
  ctx.save();
  ctx.globalAlpha = clamp(a * 1.6, 0, 1);
  ctx.fillStyle = 'rgba(12,16,28,.88)';
  circle(e.x, yy, 19); ctx.fill();
  ctx.strokeStyle = e.team === 'player' ? '#6fc0ff' : '#ff8f8f';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.font = '22px "Segoe UI Emoji", system-ui, sans-serif';
  ctx.fillText(e.text, e.x, yy + 1);
  ctx.restore();
}

/* ---------------------------- RENDER MASTER --------------------------- */
function render() {
  ctx.save();
  if (G.shake > 0.2) ctx.translate(rnd(G.shake, -G.shake) * .35, rnd(G.shake, -G.shake) * .35);
  drawArena();
  for (const z of G.zones) drawZone(z);

  const held = heldCard();
  if (held) drawDeployZone(held);

  const ents = [];
  for (const b of G.buildings) if (b.alive) ents.push(b);
  for (const u of G.units) if (u.alive) ents.push(u);
  ents.sort((a, b) => (a.air ? 1 : 0) - (b.air ? 1 : 0) || a.pos.y - b.pos.y);
  for (const e of ents) {
    if (e.isBuilding) { if (e.isTower) drawTowerB(e); else drawStructure(e); }
    else drawTroop(e);
  }
  for (const p of G.parts) drawPart(p);
  for (const s of G.shots) drawShot(s);
  for (const c of G.casts) drawCast(c);
  for (const f of G.floats) drawFloat(f);
  for (const e of G.emotes) drawEmote(e);

  /* fantasma de colocación */
  if (held && G.pointer.inside) {
    const ok = canDeploy(held, G.pointer.x, G.pointer.y);
    ctx.save();
    ctx.globalAlpha = .85;
    ctx.strokeStyle = ok ? '#7dff9e' : '#ff6b6b';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([7, 5]);
    const rad = held.type === 'spell' ? held.radius : (held.count ? 24 : (held.r || 12) + 6);
    circle(G.pointer.x, G.pointer.y, rad); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = .28;
    ctx.fillStyle = ok ? '#7dff9e' : '#ff6b6b';
    circle(G.pointer.x, G.pointer.y, rad); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = '22px "Segoe UI Emoji", system-ui, sans-serif';
    ctx.fillText(held.icon, G.pointer.x, G.pointer.y - rad - 14);
    ctx.restore();
  }
  ctx.restore();
}

/* ============================ PARTIDA ================================= */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function after(sec, fn) { G.timers.push({ t: sec, fn, done: false }); }
G.timers = [];
G.openLanes = [];

function heldCard() {
  if (G.selected === null || G.selected === undefined) return null;
  const id = G.hand[G.selected];
  return id ? CARDS[id] : null;
}
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1200);
}
function banner(text) {
  const b = $('banner');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(banner._t);
  banner._t = setTimeout(() => b.classList.remove('show'), 1800);
}

function newMatch() {
  G.arena = arenaFor(P.trophies);
  G.enemyLevel = clamp(Math.round(avgDeckLevel()) + (P.trophies >= 1400 ? 1 : 0), 1, MAX_LEVEL);
  G.aiSkill = clamp(1 + P.trophies / 3000, 1, 1.6);
  G.units = []; G.buildings = []; G.shots = []; G.parts = [];
  G.zones = []; G.casts = []; G.emotes = []; G.floats = []; G.timers = [];
  G.openLanes = [];
  G.crowns = { player: 0, enemy: 0 };
  G.time = 180; G.phase = 'normal'; G.mult = 1;
  G.elixir = 5; G.aiElixir = 5; G.abilityCd = 0; G.shake = 0; G.t = 0;
  G.selected = null; G.result = null; G.over = false;
  G.stats = { player: 0, enemy: 0 };
  G.matchId = (G.matchId || 0) + 1;

  G.buildings.push(new Building(PRINCESS[0].x, PRINCESS[0].y, 'enemy', 'princess'));
  G.buildings.push(new Building(PRINCESS[1].x, PRINCESS[1].y, 'enemy', 'princess'));
  G.buildings.push(new Building(240, KING_Y.enemy, 'enemy', 'king'));
  G.buildings.push(new Building(PRINCESS[2].x, PRINCESS[2].y, 'player', 'princess'));
  G.buildings.push(new Building(PRINCESS[3].x, PRINCESS[3].y, 'player', 'princess'));
  G.buildings.push(new Building(240, KING_Y.player, 'player', 'king'));

  G.queue = shuffle(P.deck.slice());
  G.hand = G.queue.splice(0, 4);
  aiInit();

  renderCrowns(); renderHand(true); updateHud();
  banner('¡ADELANTE!');
  G.running = true; G.lastFrame = 0;
  if (!G.raf) G.raf = requestAnimationFrame(loop);
}

function playHandSlot(i) {
  const id = G.hand[i];
  G.queue.push(id);
  G.hand[i] = G.queue.shift();
}

function deployCard(id, x, y, team, level) {
  const c = CARDS[id];
  if (G.stats) G.stats[team] = (G.stats[team] || 0) + 1;
  if (c.type === 'spell') {
    G.casts.push(new Cast(id, x, y, team, level));
    Snd.deploy();
    return;
  }
  if (c.type === 'building') {
    G.buildings.push(new Building(x, y, team, 'card', id));
  } else {
    spawnTroops(id, x, y, team, c.count || 1, level);
  }
  ring(x, y, 22, team === 'player' ? '#7fd0ff' : '#ff9a9a');
  Snd.deploy();
}

function tryDeploy(slot, x, y) {
  if (!G.running) return false;
  const id = G.hand[slot];
  if (!id) return false;
  const card = CARDS[id];
  if (G.elixir < card.cost) { toast('¡Te falta elixir!'); return false; }
  if (!canDeploy(card, x, y)) { toast('Solo puedes desplegar en tu zona'); return false; }
  G.elixir -= card.cost;
  deployCard(id, x, y, 'player', cardLevel(id));
  playHandSlot(slot);
  G.selected = null;
  renderHand(true);
  return true;
}

/* ------------------------- HABILIDAD LEGENDARIA ----------------------- */
function abilityUnit() {
  for (const u of G.units) if (u.team === 'player' && u.alive && u.deployed && u.card.ability) return u;
  return null;
}
function useAbility() {
  const u = abilityUnit();
  if (!u || G.abilityCd > 0 || G.elixir < 1 || !G.running) return;
  G.elixir -= 1; G.abilityCd = 8;
  Snd.ability();
  poof(u.pos.x, u.pos.y, '#7fe8ff', 14);
  const m = levelMult(u.level);
  if (u.card.ability === 'salto') {
    const tg = acquire(u);
    if (tg) {
      const a = Math.atan2(u.pos.y - tg.pos.y, u.pos.x - tg.pos.x);
      u.pos.x = tg.pos.x + Math.cos(a) * (tg.radius + u.radius);
      u.pos.y = tg.pos.y + Math.sin(a) * (tg.radius + u.radius);
      constrain(u);
      dealArea(u.pos.x, u.pos.y, 78, 330 * m, u.team, { knock: 26 });
      boom(u.pos.x, u.pos.y, 78, '#7fd0ff');
      G.shake = 12; Snd.boom();
    }
  } else if (u.card.ability === 'carga') {
    u.cool = 0;
    spark(u.pos.x, u.pos.y, '#7fe8ff', 16);
  } else if (u.card.ability === 'lluvia') {
    for (let i = 0; i < 4; i++) {
      after(i * 0.22, () => {
        if (!G.running || !u.alive) return;
        const tg = acquire(u);
        if (!tg) return;
        G.shots.push(new Shot(u.pos.x, u.pos.y - 8, tg, 120 * m, u.team, 'arrow', { splash: 44, color: '#ffd75e', speed: 340 }));
        Snd.shoot();
      });
    }
  }
  renderHand(true);
}

/* ------------------------------- IA ----------------------------------- */
const AI_POOL = [
  ['KNIGHT', 'ARCHERS', 'GIANT', 'ARROWS', 'MINIONS', 'MUSKETEER', 'ZAP', 'CANNON'],
  ['VALKYRIE', 'HOG_RIDER', 'WIZARD', 'FIREBALL', 'SKELETONS', 'MUSKETEER', 'ZAP', 'CANNON'],
  ['PEKKA', 'WITCH', 'BABY_DRAGON', 'FIREBALL', 'MINIONS', 'KNIGHT', 'ZAP', 'INFERNO'],
  ['MEGA_KNIGHT', 'ELECTRO_WIZARD', 'BABY_DRAGON', 'ARROWS', 'VALKYRIE', 'HOG_RIDER', 'ZAP', 'INFERNO'],
  ['GIANT', 'WITCH', 'PRINCESS', 'LUMBERJACK', 'FIREBALL', 'MINIONS', 'ZAP', 'CANNON']
];
function aiInit() {
  const idx = clamp(Math.floor(P.trophies / 500), 0, AI_POOL.length - 1);
  const deck = AI_POOL[Math.min(idx, AI_POOL.length - 1)].slice();
  G.ai.queue = shuffle(deck);
  G.ai.hand = G.ai.queue.splice(0, 4);
  G.ai.think = 2.2;
  G.ai.pushCd = rnd(8, 4);
}
function aiPlay(slot, x, y) {
  const id = G.ai.hand[slot];
  const c = CARDS[id];
  G.aiElixir -= c.cost;
  deployCard(id, clamp(x, 20, W - 20), clamp(y, 20, RIVER_TOP - 10), 'enemy', G.enemyLevel);
  G.ai.queue.push(id);
  G.ai.hand[slot] = G.ai.queue.shift();
}
function aiScore(card, ctxInfo) {
  let s = 10 - card.cost * 1.5;
  if (ctxInfo.swarm && card.splash) s += 22;
  if (ctxInfo.swarm && card.type === 'spell' && card.dmg) s += 26;
  if (ctxInfo.air && (card.targets === 'all' || card.targets === 'air')) s += 20;
  if (ctxInfo.air && card.targets === 'ground') s -= 40;
  if (ctxInfo.tank) {
    const dps = card.dmg && card.hitSpeed ? card.dmg / card.hitSpeed : 0;
    if (dps > 100) s += 18;
    if (card.type === 'building') s += 24;
    if (card.type === 'spell') s -= 20;
  }
  if (ctxInfo.threat && card.type === 'troop' && card.targets === 'buildings') s -= 25;
  if (!ctxInfo.threat && card.type === 'spell') s -= 30;
  if (card.type === 'building' && !ctxInfo.threat) s -= 15;
  return s + rnd(6);
}
function aiPickSlot(info, filter) {
  let bestSlot = -1, best = -Infinity;
  for (let i = 0; i < G.ai.hand.length; i++) {
    const c = CARDS[G.ai.hand[i]];
    if (!c || c.cost > G.aiElixir) continue;
    if (filter && !filter(c)) continue;
    const sc = aiScore(c, info);
    if (sc > best) { best = sc; bestSlot = i; }
  }
  return bestSlot;
}
function aiCluster(list, radius) {
  let best = { n: 0, x: 0, y: 0 };
  for (const t of list) {
    let n = 0;
    for (const o of list) if (dist(t.pos, o.pos) <= radius) n++;
    if (n > best.n) best = { n, x: t.pos.x, y: t.pos.y };
  }
  return best;
}
function aiCast(slot, x, y) {
  const id = G.ai.hand[slot];
  G.aiElixir -= CARDS[id].cost;
  G.casts.push(new Cast(id, clamp(x, 20, W - 20), clamp(y, 20, H - 20), 'enemy', G.enemyLevel));
  if (G.stats) G.stats.enemy = (G.stats.enemy || 0) + 1;
  Snd.deploy();
  G.ai.queue.push(id);
  G.ai.hand[slot] = G.ai.queue.shift();
}
function aiUpdate(dt) {
  G.aiElixir = Math.min(10, G.aiElixir + dt * (1 / 2.8) * G.mult);
  G.ai.think -= dt;
  G.ai.pushCd -= dt;
  if (G.ai.think > 0) return;
  G.ai.think = rnd(1.8, 0.9) / G.aiSkill;

  const mine = G.units.filter(u => u.team === 'player' && u.alive && u.deployed);
  const near = mine.filter(u => u.pos.y < RIVER_BOT + 70);   /* ya cruzando o cruzado */
  const coming = mine.filter(u => u.pos.y < 520);            /* empuje en camino */
  const list = near.length ? near : coming;
  const info = {
    threat: near.length > 0,
    swarm: list.length >= 3,
    air: list.some(t => t.air),
    tank: list.some(t => t.maxHp >= 1800)
  };

  /* 1. DEFENSA inmediata */
  if (near.length) {
    let ref = near[0];
    for (const t of near) if (t.pos.y < ref.pos.y || t.maxHp > ref.maxHp * 1.4) ref = t;

    const spellSlot = aiPickSlot(info, c => c.type === 'spell' && c.dmg);
    if (spellSlot >= 0) {
      const card = CARDS[G.ai.hand[spellSlot]];
      const cl = aiCluster(near, card.radius);
      const worth = cl.n >= 3 || (cl.n >= 2 && card.cost <= 3) ||
        (cl.n >= 1 && ref.maxHp <= 700 && ref.hp <= card.dmg * levelMult(G.enemyLevel) * 1.1);
      if (worth) { aiCast(spellSlot, cl.x, cl.y); return; }
    }
    const slot = aiPickSlot(info, c => c.type !== 'spell');
    if (slot >= 0) {
      const card = CARDS[G.ai.hand[slot]];
      const px = card.type === 'building'
        ? clamp(ref.pos.x < 240 ? 165 : 315, 40, W - 40)
        : clamp(ref.pos.x + rnd(26, -26), 30, W - 30);
      const py = clamp(ref.pos.y - (card.range > 100 ? 105 : 62), 45, RIVER_TOP - 16);
      aiPlay(slot, px, py);
      if (Math.random() < 0.1) aiEmote();
    }
    return;
  }

  /* 2. PREPARARSE ante un empuje que viene */
  if (coming.length && G.aiElixir >= 6) {
    const slot = aiPickSlot(info, c => c.type === 'troop' && c.targets !== 'buildings');
    if (slot >= 0) {
      const lane = coming[0].pos.x < 240 ? 150 : 330;
      aiPlay(slot, clamp(lane + rnd(30, -30), 40, W - 40), rnd(215, 165));
      return;
    }
  }

  /* 3. ATAQUE */
  if (G.ai.pushCd > 0 && G.aiElixir < 9) return;
  const slot = aiPickSlot({ threat: false, swarm: false, air: false, tank: false },
    c => c.type === 'troop');
  if (slot < 0) return;
  const card = CARDS[G.ai.hand[slot]];
  const lane = Math.random() < 0.5 ? BRIDGES[0] : BRIDGES[1];
  const x = clamp(lane.cx + rnd(26, -26), 28, W - 28);
  const y = card.targets === 'buildings' ? RIVER_TOP - 26 : rnd(160, 95);
  aiPlay(slot, x, y);
  G.ai.pushCd = rnd(8, 3.5) / G.aiSkill;
  if (Math.random() < 0.08) aiEmote();
}
function aiEmote() {
  const king = G.buildings.find(b => b.team === 'enemy' && b.kind === 'king' && b.alive);
  if (!king) return;
  G.emotes.push({ x: king.pos.x, y: king.pos.y + 46, text: pick(['😎', '😂', '👑', '🔥', '😴']), life: 2.2, team: 'enemy' });
  Snd.emote();
}

/* --------------------------- BUCLE PRINCIPAL --------------------------- */
function update(dt) {
  G.t += dt;

  for (const tm of G.timers) {
    tm.t -= dt;
    if (tm.t <= 0 && !tm.done) { tm.done = true; try { tm.fn(); } catch (e) { /* nada */ } }
  }
  if (G.timers.length) G.timers = G.timers.filter(t => !t.done);

  G.time -= dt;
  if (G.phase === 'normal') {
    if (G.time <= 60 && G.mult < 2) { G.mult = 2; banner('¡ELIXIR x2!'); $('elixir-bar').classList.add('x2'); }
    if (G.time <= 0) {
      if (G.crowns.player !== G.crowns.enemy) { endMatch(); return; }
      G.phase = 'overtime'; G.time = 60; G.mult = 3;
      banner('¡PRÓRROGA x3!');
    }
  } else if (G.time <= 0) { endMatch(); return; }

  G.elixir = Math.min(10, G.elixir + dt * (1 / 2.8) * G.mult);
  aiUpdate(dt);
  if (G.abilityCd > 0) G.abilityCd = Math.max(0, G.abilityCd - dt);

  for (let i = 0; i < G.units.length; i++) { const u = G.units[i]; if (u.alive) u.update(dt); }
  for (let i = 0; i < G.buildings.length; i++) { const b = G.buildings[i]; if (b.alive) b.update(dt); }
  separate();
  for (const s of G.shots) s.update(dt);
  for (const c of G.casts) c.update(dt);
  for (const p of G.parts) p.update(dt);
  for (const z of G.zones) z.life -= dt;
  for (const f of G.floats) f.life -= dt;
  for (const e of G.emotes) e.life -= dt;

  G.units = G.units.filter(u => u.alive);
  G.buildings = G.buildings.filter(b => b.alive);
  G.shots = G.shots.filter(s => s.alive);
  G.casts = G.casts.filter(c => c.alive);
  G.parts = G.parts.filter(p => p.life > 0);
  G.zones = G.zones.filter(z => z.life > 0);
  G.floats = G.floats.filter(f => f.life > 0);
  G.emotes = G.emotes.filter(e => e.life > 0);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 45);
}

function loop(ts) {
  G.raf = requestAnimationFrame(loop);
  if (!G.lastFrame) G.lastFrame = ts;
  let dt = (ts - G.lastFrame) / 1000;
  G.lastFrame = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  if (G.running) update(dt);
  render();
  updateHud();
}

/* ---------------------------- FIN DE PARTIDA --------------------------- */
function lowestTowerPct(team) {
  let low = 1;
  for (const b of G.buildings) if (b.team === team && b.isTower && b.alive) low = Math.min(low, b.pct);
  const alive = G.buildings.filter(b => b.team === team && b.isTower && b.alive).length;
  if (alive < 3) low -= (3 - alive);
  return low;
}
function decideResult() {
  if (G.crowns.player > G.crowns.enemy) return 'win';
  if (G.crowns.enemy > G.crowns.player) return 'lose';
  const a = lowestTowerPct('player'), b = lowestTowerPct('enemy');
  if (a > b + 0.005) return 'win';
  if (b > a + 0.005) return 'lose';
  return 'draw';
}
function endMatch(forced) {
  if (!G.running) return;
  G.running = false; G.over = true;
  G.selected = null;
  const res = forced === 'lose' ? 'lose' : decideResult();
  G.result = res;
  const rw = { gold: 0, trophies: 0, chest: null };
  if (res === 'win') {
    rw.trophies = 26 + G.crowns.player * 3;
    rw.gold = 90 + G.crowns.player * 35;
    P.wins++;
    const slot = P.chests.indexOf(null);
    if (slot !== -1) {
      const roll = Math.random();
      const type = roll > 0.94 ? 'Legendario' : roll > 0.75 ? 'Mágico' : roll > 0.4 ? 'Oro' : 'Plata';
      P.chests[slot] = { type };
      rw.chest = type;
    }
    Snd.win(); banner('¡VICTORIA!');
  } else if (res === 'lose') {
    rw.trophies = -(16 + G.crowns.enemy * 3);
    rw.gold = 18;
    P.losses++;
    Snd.lose(); banner('DERROTA');
  } else {
    rw.gold = 40;
    banner('EMPATE');
  }
  P.trophies = Math.max(0, P.trophies + rw.trophies);
  P.gold += rw.gold;
  save();
  /* el identificador evita que un resultado atrasado aparezca sobre otra partida */
  const id = G.matchId;
  setTimeout(() => { if (G.matchId === id && !G.running) showResult(res, rw); }, 1100);
}

/* ============================== INTERFAZ =============================== */
function renderCrowns() {
  const mk = (n, cls) => {
    let h = '';
    if (cls === 'enemy') h += '<span class="tag enemy">RIVAL</span>';
    for (let i = 0; i < 3; i++) h += '<span class="cslot' + (i < n ? ' on' : '') + '">' + (i < n ? '👑' : '') + '</span>';
    if (cls === 'mine') h += '<span class="tag mine">TÚ</span>';
    return h;
  };
  $('crowns-enemy').innerHTML = mk(G.crowns.enemy, 'enemy');
  $('crowns-player').innerHTML = mk(G.crowns.player, 'mine');
}

const hudCache = { el: -1, tm: '', ab: '', poor: '' };
function updateHud() {
  const e = Math.floor(G.elixir);
  const pctE = clamp(G.elixir / 10, 0, 1) * 100;
  $('elixir-fill').style.width = pctE.toFixed(1) + '%';
  if (e !== hudCache.el) {
    hudCache.el = e;
    $('elixir-txt').textContent = '💧 ' + e + '/10' + (G.mult > 1 ? '  ×' + G.mult : '');
  }
  const t = Math.max(0, G.time);
  const tm = Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  if (tm !== hudCache.tm) {
    hudCache.tm = tm;
    const el = $('timer');
    el.textContent = (G.phase === 'overtime' ? '⏱ ' : '') + tm;
    el.classList.toggle('urgent', G.time <= 60 || G.phase === 'overtime');
  }
  /* botón de poder */
  const ab = $('ability-btn');
  const u = G.running ? abilityUnit() : null;
  let state = 'off';
  if (u) state = G.abilityCd > 0 ? 'cd' : 'on';
  const label = state === 'cd' ? '⏳ ' + Math.ceil(G.abilityCd) + 's' : (u ? '✨ ' + u.card.name.split(' ')[0] : '');
  const sig = state + label;
  if (sig !== hudCache.ab) {
    hudCache.ab = sig;
    ab.className = state === 'off' ? '' : state;
    ab.textContent = label;
  }
  /* cartas que no se pueden pagar */
  let sig2 = '';
  for (let i = 0; i < G.hand.length; i++) sig2 += (G.elixir >= CARDS[G.hand[i]].cost ? '1' : '0');
  sig2 += '|' + G.selected;
  if (sig2 !== hudCache.poor) {
    hudCache.poor = sig2;
    const nodes = $('hand').children;
    for (let i = 0; i < nodes.length; i++) {
      const id = G.hand[i];
      if (!id) continue;
      nodes[i].classList.toggle('poor', G.elixir < CARDS[id].cost);
      nodes[i].classList.toggle('sel', G.selected === i);
    }
  }
}

function renderHand(force) {
  const sig = G.hand.join(',');
  const box = $('hand');
  if (force || box.dataset.sig !== sig) {
    box.dataset.sig = sig;
    box.innerHTML = '';
    G.hand.forEach((id, i) => {
      const c = CARDS[id];
      const d = document.createElement('div');
      d.className = 'card ' + c.rarity;
      d.innerHTML = '<div class="ccost">' + c.cost + '</div>' +
        '<div class="cicon">' + c.icon + '</div>' +
        '<div class="cname">' + c.name + '</div>' +
        '<div class="clvl">N' + cardLevel(id) + '</div>';
      d.addEventListener('pointerdown', ev => {
        ev.preventDefault();
        Snd.init();
        if (!G.running) return;
        if (G.elixir < c.cost) { G.selected = null; toast('¡Te falta elixir!'); return; }
        G.selected = (G.selected === i) ? null : i;
        updatePointer(ev);
        hudCache.poor = '';
      });
      box.appendChild(d);
    });
    hudCache.poor = '';
  }
  const nx = G.queue[0] ? CARDS[G.queue[0]] : null;
  const nc = $('next-card');
  if (nx && nc.dataset.id !== nx.id) {
    nc.dataset.id = nx.id;
    nc.innerHTML = '<div class="nl">SIGUE</div><div class="ni">' + nx.icon + '</div><div class="nc">' + nx.cost + ' 💧</div>';
  }
}

const CHESTS = {
  Plata: { gold: [70, 150], cards: 8, rare: .25, epic: .05, leg: .01 },
  Oro: { gold: [170, 300], cards: 16, rare: .38, epic: .10, leg: .03 },
  'Mágico': { gold: [330, 560], cards: 26, rare: .5, epic: .2, leg: .07 },
  Legendario: { gold: [600, 900], cards: 34, rare: .5, epic: .25, leg: 1 }
};
function rollRarity(cfg) {
  const r = Math.random();
  if (r < cfg.leg) return 'Legendary';
  if (r < cfg.leg + cfg.epic) return 'Epic';
  if (r < cfg.leg + cfg.epic + cfg.rare) return 'Rare';
  return 'Common';
}
function openChest(i) {
  const ch = P.chests[i];
  if (!ch || !CHESTS[ch.type]) return;
  const cfg = CHESTS[ch.type];
  const gold = rndInt(cfg.gold[0], cfg.gold[1]);
  P.gold += gold;
  const won = {};
  let left = cfg.cards;
  let guard = 0;
  while (left > 0 && guard++ < 200) {
    const rar = rollRarity(cfg);
    const pool = CARD_IDS.filter(id => CARDS[id].rarity === rar);
    if (!pool.length) { left--; continue; }
    const id = pick(pool);
    const n = Math.min(left, rar === 'Legendary' ? 1 : rar === 'Epic' ? rndInt(1, 3) : rndInt(2, 6));
    won[id] = (won[id] || 0) + n;
    P.copies[id] = (P.copies[id] || 0) + n;
    left -= n;
  }
  P.chests[i] = null;
  save();
  Snd.chest();
  let h = '<h2 class="win">🧰 Cofre ' + ch.type + '</h2><div class="rewards"><div class="rw">+' + gold + ' 🪙 de oro</div>';
  for (const id of Object.keys(won)) {
    h += '<div class="rw">' + CARDS[id].icon + ' ' + CARDS[id].name + ' ×' + won[id] + '</div>';
  }
  h += '</div><div class="modal-actions"><button class="btn-big" id="m-ok">¡GENIAL!</button></div>';
  modal(h);
  $('m-ok').onclick = () => { closeModal(); renderMenu(); renderCards(); };
}

/* --------------------------- MAZO Y COLECCIÓN -------------------------- */
function upgradeCost(id) {
  const lvl = cardLevel(id);
  const u = UPGRADE[CARDS[id].rarity];
  return { copies: u.copies * lvl, gold: u.gold * lvl, lvl };
}
function upgradeCard(id) {
  const c = upgradeCost(id);
  if (c.lvl >= MAX_LEVEL) return;
  if ((P.copies[id] || 0) < c.copies || P.gold < c.gold) return;
  P.copies[id] -= c.copies;
  P.gold -= c.gold;
  P.levels[id] = c.lvl + 1;
  save();
  Snd.crown();
  renderCards(); renderMenu();
}
function toggleDeck(id) {
  const i = P.deck.indexOf(id);
  if (i !== -1) {
    P.deck.splice(i, 1);
  } else {
    if (P.deck.length >= 8) { flashMsg('El mazo ya tiene 8 cartas. Quita una primero.'); return; }
    P.deck.push(id);
  }
  save(); renderCards();
}
function flashMsg(msg) {
  modal('<h2>Aviso</h2><p>' + msg + '</p><div class="modal-actions"><button class="btn-big alt" id="m-ok">VALE</button></div>');
  $('m-ok').onclick = closeModal;
}
function randomDeck() {
  P.deck = shuffle(CARD_IDS.slice()).slice(0, 8);
  save(); renderCards();
}
function cardTile(id, inDeck) {
  const c = CARDS[id];
  const lvl = cardLevel(id);
  const cost = upgradeCost(id);
  const copies = P.copies[id] || 0;
  const maxed = lvl >= MAX_LEVEL;
  const can = !maxed && copies >= cost.copies && P.gold >= cost.gold;
  const d = document.createElement('div');
  d.className = 'col-card ' + c.rarity + (inDeck ? ' in' : '');
  d.innerHTML =
    '<div class="cst">' + c.cost + '</div>' +
    (inDeck ? '<div class="mark">MAZO</div>' : '') +
    '<div class="ico">' + c.icon + '</div>' +
    '<div class="nm">' + c.name + '</div>' +
    '<div class="lv">Nivel ' + lvl + '</div>' +
    '<div class="prog"><i style="width:' + (maxed ? 100 : clamp(copies / cost.copies, 0, 1) * 100) + '%"></i></div>' +
    '<div style="font-size:7.5px;color:#8f9ab9">' + (maxed ? 'MÁX' : copies + '/' + cost.copies) + '</div>' +
    '<button class="up-btn" ' + (can ? '' : 'disabled') + '>' + (maxed ? '★ MÁX' : '⬆ ' + cost.gold + '🪙') + '</button>';
  d.querySelector('.up-btn').addEventListener('click', ev => { ev.stopPropagation(); upgradeCard(id); });
  d.addEventListener('click', () => toggleDeck(id));
  d.title = c.name + ' — ' + RARITY_ES[c.rarity] + '. ' + c.desc;
  return d;
}
function renderCards() {
  $('deck-count').textContent = P.deck.length;
  $('col-count').textContent = CARD_IDS.length;
  const dg = $('deck-grid');
  dg.innerHTML = '';
  P.deck.forEach(id => dg.appendChild(cardTile(id, true)));
  for (let i = P.deck.length; i < 8; i++) {
    const e = document.createElement('div');
    e.className = 'empty-slot'; e.textContent = '+';
    dg.appendChild(e);
  }
  const cg = $('collection-grid');
  cg.innerHTML = '';
  CARD_IDS.slice().sort((a, b) =>
    RARITY_ORDER[CARDS[a].rarity] - RARITY_ORDER[CARDS[b].rarity] || CARDS[a].cost - CARDS[b].cost
  ).forEach(id => cg.appendChild(cardTile(id, P.deck.includes(id))));
}
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $('page-battle').classList.toggle('active', name === 'battle');
  $('page-cards').classList.toggle('active', name === 'cards');
  if (name === 'cards') renderCards(); else renderMenu();
}

/* ------------------------------ ENTRADA -------------------------------- */
function updatePointer(ev) {
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const x = (ev.clientX - r.left) * (W / r.width);
  const y = (ev.clientY - r.top) * (H / r.height);
  G.pointer.x = clamp(x, 0, W);
  G.pointer.y = clamp(y, 0, H);
  G.pointer.inside = x >= 0 && x <= W && y >= 0 && y <= H;
}
cv.addEventListener('pointerdown', ev => { Snd.init(); updatePointer(ev); ev.preventDefault(); });
window.addEventListener('pointermove', ev => { if (G.selected !== null) updatePointer(ev); }, { passive: true });
window.addEventListener('pointerup', ev => {
  if (G.selected === null || !G.running) return;
  updatePointer(ev);
  if (G.pointer.inside) tryDeploy(G.selected, G.pointer.x, G.pointer.y);
});
window.addEventListener('keydown', ev => {
  if (!G.running) return;
  if (ev.key >= '1' && ev.key <= '4') {
    const i = parseInt(ev.key, 10) - 1;
    if (G.hand[i] && G.elixir >= CARDS[G.hand[i]].cost) { G.selected = i; hudCache.poor = ''; }
  } else if (ev.key === 'Escape') {
    G.selected = null; hudCache.poor = '';
  } else if (ev.key.toLowerCase() === 'q') {
    useAbility();
  }
});

const EMOJIS = ['👑', '😂', '😭', '😡', '🔥', '💀', '👍', '🤝'];
function buildEmotes() {
  const p = $('emote-picker');
  p.innerHTML = '';
  EMOJIS.forEach(em => {
    const s = document.createElement('span');
    s.textContent = em;
    s.onclick = () => {
      const k = G.buildings.find(b => b.team === 'player' && b.kind === 'king' && b.alive);
      if (k) G.emotes.push({ x: k.pos.x, y: k.pos.y - 46, text: em, life: 2.2, team: 'player' });
      Snd.emote();
      p.classList.remove('open');
    };
    p.appendChild(s);
  });
}

/* ---------------------------- ESCALADO ---------------------------------- */
function fitScreen() {
  const f = $('frame');
  const s = Math.min(window.innerWidth / 480, window.innerHeight / 812);
  f.style.transform = 'scale(' + s.toFixed(4) + ')';
}
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', () => setTimeout(fitScreen, 120));

/* ------------------------------ ARRANQUE -------------------------------- */
function showHelp() {
  modal('<h2>Cómo se juega</h2><div class="help-list">' +
    '<b>Objetivo:</b> destruye más torres que el rival en 3 minutos. Cada torre lateral vale 1 corona 👑 y la del Rey da la victoria inmediata.<br>' +
    '<b>Elixir:</b> se llena solo. Cada carta cuesta elixir (el número rosa). En el último minuto se genera ×2 y en la prórroga ×3.<br>' +
    '<b>Jugar cartas:</b> toca una carta y luego el campo, o arrástrala. Solo puedes desplegar en <b>tu mitad</b> hasta que derribes una torre rival.<br>' +
    '<b>Tipos:</b> las tropas de asedio (Gigante, Montapuercos) solo golpean edificios; los hechizos caen donde quieras; los edificios defienden y caducan.<br>' +
    '<b>Poder ✨:</b> con una carta legendaria en el campo se activa un botón especial (1 de elixir).<br>' +
    '<b>Teclas:</b> 1-4 elegir carta · Q poder · Esc cancelar.' +
    '</div><div class="modal-actions"><button class="btn-big" id="m-ok">¡ENTENDIDO!</button></div>');
  $('m-ok').onclick = closeModal;
}

/* Abre una copia estática del juego en una pestaña about:blank.
   Esa pestaña vive en un origen "null": no comparte localStorage con
   esta página, así que su progreso se guarda aparte. */
function abrirEnAboutBlank() {
  const nuevaVentana = window.open('about:blank', '_blank');
  if (!nuevaVentana) {
    alert('El navegador bloqueó la ventana emergente. Por favor, activa los pop-ups para este sitio.');
    return;
  }
  const contenidoHTML = document.documentElement.outerHTML;
  nuevaVentana.document.open();
  nuevaVentana.document.write(contenidoHTML);
  nuevaVentana.document.close();
}

function init() {
  buildEmotes();
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });
  $('start-btn').addEventListener('click', startBattle);
  $('help-btn').addEventListener('click', showHelp);
  $('sound-btn').addEventListener('click', () => {
    Snd.init();
    Snd.setMuted(!Snd.muted);
    $('sound-btn').textContent = Snd.muted ? '🔇' : '🔊';
  });
  $('popout-btn').addEventListener('click', abrirEnAboutBlank);
  $('random-deck').addEventListener('click', randomDeck);
  $('emote-btn').addEventListener('click', () => $('emote-picker').classList.toggle('open'));
  $('ability-btn').addEventListener('click', useAbility);
  $('surrender-btn').addEventListener('click', () => {
    if (!G.running) return;
    modal('<h2>¿Rendirse?</h2><p>Perderás la partida y tus trofeos.</p><div class="modal-actions">' +
      '<button class="btn-big alt" id="m-no">SEGUIR</button><button class="btn-big" id="m-yes" style="background:linear-gradient(180deg,#ff6b6b,#a92626);box-shadow:0 5px 0 #7a1c1c">RENDIRSE</button></div>');
    $('m-no').onclick = closeModal;
    $('m-yes').onclick = () => { closeModal(); endMatch('lose'); };
  });

  G.arena = arenaFor(P.trophies);
  renderMenu(); renderCards(); renderCrowns();
  fitScreen();
  render();
}
init();
</script>
