<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d18">
<title>Choque Real — Clash Royale Clone</title>
<style>
:root{
  --oro:#ffcf4d; --oro-osc:#a97c10;
  --elixir:#e0459f; --elixir-cl:#ff9ad8;
  --azul:#4aa3ff; --azul-osc:#1b4f86;
  --rojo:#ff5f5f; --verde:#4fd07a;
  --tinta:#070a14; --panel:#151c31; --panel2:#1e2740; --panel3:#2a3555;
  --borde:#3a4670; --borde-cl:#5b6a9e;
  --texto:#eaf0ff; --tenue:#94a1c6;
  --leg:#3ee0ff; --epi:#c569ff; --rar:#ffa63d; --com:#a3aec9;
  --display:ui-rounded,"SF Pro Rounded","Segoe UI Rounded","Baloo 2",Nunito,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --texto-fam:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  background:
    radial-gradient(680px 420px at 50% -6%, #24325c 0%, rgba(36,50,92,0) 70%),
    radial-gradient(900px 700px at 50% 110%, #171f3c 0%, rgba(23,31,60,0) 65%),
    #05070f;
  color:var(--texto); font-family:var(--texto-fam);
  display:flex; align-items:center; justify-content:center;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ====== MARCO ====== */
#frame{
  position:relative;width:480px;height:812px;flex:none;transform-origin:center center;
  background:#080c17;border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 2px #2f3a5e, 0 0 0 6px rgba(10,14,26,.9), 0 26px 70px rgba(0,0,0,.75), 0 0 120px rgba(74,163,255,.10);
}

/* ====== ARENA ====== */
#arena-wrap{position:absolute;top:0;left:0;width:480px;height:640px;overflow:hidden;background:#2d5c22;}
#arena{display:block;width:480px;height:640px;touch-action:none;}

/* ====== HUD ====== */
#battle-hud{
  position:absolute;top:0;left:0;width:100%;height:48px;z-index:6;pointer-events:none;
  display:flex;align-items:center;justify-content:space-between;padding:7px 10px;gap:8px;
  background:linear-gradient(180deg,rgba(5,8,16,.80),rgba(5,8,16,0));
}
.crown-box{display:flex;align-items:center;gap:5px;}
.crown-box .cslot{
  width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.5);
  border:1.5px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;
  font-size:10px;line-height:1;transition:transform .2s,box-shadow .2s;
}
.crown-box .cslot.on{
  background:radial-gradient(circle at 35% 25%,#fff0b8,#e0a200);
  border-color:#fff3c4;box-shadow:0 0 10px rgba(255,207,77,.85);transform:scale(1.12);
}
.tag{
  font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.6px;
  padding:2px 9px;border-radius:10px;text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.tag.enemy{background:linear-gradient(180deg,rgba(200,50,50,.85),rgba(120,25,25,.85));border:1px solid #ff8b8b;}
.tag.mine{background:linear-gradient(180deg,rgba(35,105,200,.85),rgba(15,55,110,.85));border:1px solid #7cc6ff;}
#timer{
  font-family:var(--display);font-size:17px;font-weight:800;color:#fff;
  background:rgba(6,9,18,.72);padding:2px 14px;border-radius:12px;
  border:1.5px solid rgba(255,255,255,.20);min-width:78px;text-align:center;
  letter-spacing:.5px;font-variant-numeric:tabular-nums;text-shadow:0 2px 3px rgba(0,0,0,.6);
}
#timer.urgent{color:var(--oro);border-color:rgba(255,207,77,.75);box-shadow:0 0 14px rgba(255,207,77,.35);}

#banner{
  position:absolute;top:32%;left:0;width:100%;text-align:center;z-index:8;pointer-events:none;
  font-family:var(--display);font-size:36px;font-weight:800;color:var(--oro);letter-spacing:.5px;
  text-shadow:0 0 22px rgba(255,120,0,.75),0 3px 0 rgba(0,0,0,.85),0 0 6px #000;
  opacity:0;transform:scale(.6);transition:opacity .25s,transform .4s cubic-bezier(.2,1.7,.5,1);
}
#banner.show{opacity:1;transform:scale(1);}
#toast{
  position:absolute;bottom:190px;left:50%;transform:translateX(-50%) translateY(10px);
  z-index:9;pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;
  background:rgba(7,10,20,.94);border:1px solid var(--borde-cl);border-radius:20px;
  padding:7px 15px;font-size:12px;font-weight:700;color:var(--oro);white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.65);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ====== PANEL ====== */
#panel{
  position:absolute;left:0;top:640px;width:100%;height:172px;z-index:5;
  background:linear-gradient(180deg,#1c2440 0%,#0a0e1c 100%);
  display:flex;flex-direction:column;padding:8px 10px 10px;gap:8px;
}
#panel::before{
  content:"";position:absolute;top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,207,77,.7),transparent);
}
.panel-row{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:36px;height:32px;border-radius:10px;font-size:15px;flex:none;
  background:linear-gradient(180deg,#39496f,#232d4a);border:1px solid #55659a;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 #0e1424,inset 0 1px 0 rgba(255,255,255,.14);
}
.icon-btn:active{transform:translateY(2px);box-shadow:none;}
#ability-btn{
  display:none;padding:0 12px;height:32px;border-radius:10px;flex:none;white-space:nowrap;
  font-family:var(--display);font-size:12px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#d24bff,#6d1594);border:1px solid #f0a6ff;
  box-shadow:0 0 16px rgba(210,75,255,.55),inset 0 1px 0 rgba(255,255,255,.3);
}
#ability-btn.on{display:block;animation:pulseAb .85s infinite alternate ease-in-out;}
#ability-btn.cd{display:block;background:linear-gradient(180deg,#3b4363,#252d44);
  border-color:#5b6489;box-shadow:none;opacity:.7;animation:none;}
@keyframes pulseAb{from{transform:scale(1);}to{transform:scale(1.06);}}

.elixir-bar{
  position:relative;flex:1;height:24px;border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,#210b1b,#3a1230);
  border:2px solid #6d2450;box-shadow:inset 0 2px 7px rgba(0,0,0,.8);
}
.elixir-fill{
  position:absolute;inset:0;width:0%;
  background:linear-gradient(90deg,#98105f,#e0459f 55%,#ffa8de);
  box-shadow:0 0 16px rgba(224,69,159,.8);transition:width .06s linear;
}
.elixir-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%);
}
.elixir-pips{position:absolute;inset:0;display:flex;}
.elixir-pips i{flex:1;border-right:1px solid rgba(0,0,0,.5);}
.elixir-pips i:last-child{border-right:0;}
.elixir-txt{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3px;
  font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.4px;
  text-shadow:0 1px 3px #000,0 0 7px rgba(0,0,0,.9);
}
.elixir-bar.x2{border-color:var(--oro);box-shadow:inset 0 2px 7px rgba(0,0,0,.8),0 0 14px rgba(255,207,77,.5);}

/* ====== CARTAS EN MANO ====== */
.hand-row{display:flex;gap:7px;align-items:stretch;height:112px;}
.next-card{
  width:54px;flex:none;border-radius:10px;
  background:linear-gradient(180deg,#232d4c,#141a2e);border:2px solid #3d4a75;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}
.next-card .nl{font-family:var(--display);font-size:8px;color:var(--tenue);font-weight:800;letter-spacing:1px;}
.next-card .ni{font-size:25px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));}
.next-card .nc{font-family:var(--display);font-size:10px;font-weight:800;color:var(--elixir-cl);}
.hand-cards{display:flex;gap:7px;flex:1;}
.card{
  position:relative;flex:1;border-radius:11px;cursor:pointer;overflow:visible;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--cbg);border:2px solid var(--cbd);
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .13s cubic-bezier(.2,1.6,.5,1),box-shadow .13s,filter .13s;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;
  background:linear-gradient(158deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.04) 38%,rgba(255,255,255,0) 60%);
}
.card .cicon{font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
.card .cname{font-family:var(--display);font-size:9px;font-weight:700;text-align:center;line-height:1.05;padding:0 3px;color:#e7eeff;}
.card .clvl{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  font-family:var(--display);font-size:8px;font-weight:800;color:#241b02;
  background:linear-gradient(180deg,#ffe07a,#e2a300);padding:0 5px;border-radius:5px;
}
.card .ccost,.col-card .cst{
  position:absolute;border-radius:50%;color:#fff;font-family:var(--display);font-weight:800;
  background:radial-gradient(circle at 34% 28%,#ff9fdd,#b60e73);
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.75);
}
.card .ccost{top:-8px;left:-7px;width:25px;height:25px;font-size:13px;}
.card.Common{--cbd:#9aa6c2;--cbg:linear-gradient(180deg,#3b4568,#1c2440);}
.card.Rare{--cbd:var(--rar);--cbg:linear-gradient(180deg,#4d3a1d,#241d33);}
.card.Epic{--cbd:var(--epi);--cbg:linear-gradient(180deg,#452a63,#221838);}
.card.Legendary{--cbd:var(--leg);--cbg:linear-gradient(180deg,#123f57,#101c39);}
.card.Legendary::after{
  content:"";position:absolute;inset:-2px;border-radius:11px;pointer-events:none;
  background:linear-gradient(130deg,rgba(62,224,255,.35),rgba(197,105,255,.25),rgba(62,224,255,.35));
  mix-blend-mode:screen;opacity:.5;
}
.card.sel{transform:translateY(-12px) scale(1.05);border-color:var(--oro)!important;
  box-shadow:0 0 20px rgba(255,207,77,.75),0 8px 0 rgba(0,0,0,.45);}
.card.poor{filter:grayscale(.9) brightness(.58);cursor:not-allowed;}
.card.poor .ccost{background:radial-gradient(circle at 34% 28%,#96a0b6,#4b5164);}

/* ====== EMOTES ====== */
#emote-picker{
  position:absolute;left:10px;top:590px;z-index:9;display:none;gap:7px;padding:8px 10px;
  background:rgba(8,12,24,.96);border:2px solid var(--oro);border-radius:14px;
  box-shadow:0 10px 26px rgba(0,0,0,.8);
}
#emote-picker.open{display:flex;}
#emote-picker span{font-size:26px;cursor:pointer;transition:transform .12s;}
#emote-picker span:hover,#emote-picker span:active{transform:scale(1.32);}

/* ====== MENÚ ====== */
#overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#111a33 0%,#070b16 55%,#05070f 100%);}
#overlay.hidden{display:none;}
.tabs{display:flex;background:#0e1526;border-bottom:2px solid #232d4a;flex:none;}
.tab{
  flex:1;padding:14px 4px;text-align:center;position:relative;color:#7c88ab;
  font-family:var(--display);font-weight:700;font-size:14px;transition:color .15s,background .15s;
}
.tab.active{color:var(--oro);background:linear-gradient(180deg,#1c2440,#161d33);}
.tab.active::after{content:"";position:absolute;left:0;bottom:-2px;width:100%;height:3px;
  background:linear-gradient(90deg,transparent,var(--oro),transparent);}
.page{flex:1;display:none;flex-direction:column;gap:12px;padding:14px;overflow-y:auto;overscroll-behavior:contain;
  justify-content:safe center;}
.page.active{display:flex;}
.page::-webkit-scrollbar{width:6px;}
.page::-webkit-scrollbar-thumb{background:#33406b;border-radius:3px;}

.profile{
  position:relative;overflow:hidden;flex:none;text-align:center;
  background:linear-gradient(155deg,#222d4e,#141a2e);
  border:1px solid rgba(255,207,77,.32);border-radius:16px;padding:16px 14px;
  box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
}
.profile::before{
  content:"";position:absolute;top:-70px;left:50%;transform:translateX(-50%);
  width:260px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,207,77,.18),rgba(255,207,77,0) 70%);
}
.profile .tro{
  position:relative;font-family:var(--display);font-size:34px;font-weight:800;color:var(--oro);
  line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 20px rgba(255,207,77,.35);
}
.profile .ar{position:relative;font-family:var(--display);font-size:15px;font-weight:700;color:var(--leg);margin-top:3px;}
.profile .stats{
  position:relative;display:flex;justify-content:center;gap:16px;margin-top:10px;
  font-size:12px;font-weight:700;color:var(--tenue);
}
.profile .stats b{color:var(--verde);font-family:var(--display);}
.bar-track{position:relative;height:8px;background:#0a0e1c;border-radius:5px;margin-top:10px;
  overflow:hidden;border:1px solid #2b3350;}
.bar-fill{height:100%;background:linear-gradient(90deg,#ffcf4d,#ff9f2e);border-radius:5px;transition:width .35s;}
.hint{position:relative;font-size:10.5px;color:#7d89ac;margin-top:6px;}

h3.sec{font-family:var(--display);font-size:12px;color:#8f9bc0;text-transform:uppercase;
  letter-spacing:1.6px;font-weight:700;flex:none;}

.deck-preview{display:flex;gap:5px;flex:none;}
.deck-preview .mini{
  flex:1;border-radius:9px;padding:5px 2px;text-align:center;position:relative;
  background:var(--cbg,linear-gradient(180deg,#3b4568,#1c2440));border:1.5px solid var(--cbd,#3b466e);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.deck-preview .mini.Common{--cbd:#9aa6c2;--cbg:linear-gradient(180deg,#3b4568,#1c2440);}
.deck-preview .mini.Rare{--cbd:var(--rar);--cbg:linear-gradient(180deg,#4d3a1d,#241d33);}
.deck-preview .mini.Epic{--cbd:var(--epi);--cbg:linear-gradient(180deg,#452a63,#221838);}
.deck-preview .mini.Legendary{--cbd:var(--leg);--cbg:linear-gradient(180deg,#123f57,#101c39);}
.deck-preview .mini .mi{font-size:18px;line-height:1.15;}
.deck-preview .mini .mc{font-family:var(--display);font-size:9px;font-weight:800;color:var(--elixir-cl);}
.avg-cost{font-size:11px;color:var(--tenue);text-align:right;font-weight:600;margin-top:-6px;}

/* --- cofres dibujados en CSS --- */
.chests{display:flex;gap:8px;flex:none;}
.chest{
  flex:1;height:96px;border-radius:12px;border:2px dashed #33406b;background:#111827;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-family:var(--display);font-size:10px;font-weight:700;color:#66739a;text-align:center;padding:5px;
  transition:transform .13s,box-shadow .13s;
}
.chest.full{border-style:solid;cursor:pointer;color:#fff;}
.chest.full:hover{transform:translateY(-2px);}
.chest.full:active{transform:scale(.95);}
.chest .vacio{font-size:22px;opacity:.5;}
.cofre{position:relative;width:40px;height:31px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));}
.cofre::before{
  content:"";position:absolute;left:0;top:0;width:40px;height:16px;
  border:2px solid var(--c3);border-bottom:0;border-radius:10px 10px 0 0;
  background:linear-gradient(180deg,var(--c1),var(--c2));
}
.cofre::after{
  content:"";position:absolute;left:0;top:14px;width:40px;height:17px;
  border:2px solid var(--c3);border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,var(--c2),var(--c1));
}
.cofre i{
  position:absolute;left:50%;top:9px;transform:translateX(-50%);z-index:2;
  width:10px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.5);
  background:linear-gradient(180deg,#ffe07a,#c78d05);
}
.chest.Plata{--c1:#e2e9f5;--c2:#8f9bb5;--c3:#f4f8ff;border-color:#c8d2e6;
  background:linear-gradient(180deg,#232c42,#141a2b);box-shadow:0 0 14px rgba(200,210,230,.16);}
.chest.Oro{--c1:#ffe07a;--c2:#c78d05;--c3:#fff3c4;border-color:var(--oro);
  background:linear-gradient(180deg,#2d2718,#171410);box-shadow:0 0 16px rgba(255,207,77,.22);}
.chest.Mágico{--c1:#dba6ff;--c2:#7a26c0;--c3:#f1cfff;border-color:var(--epi);
  background:linear-gradient(180deg,#291a3d,#150f20);box-shadow:0 0 16px rgba(197,105,255,.26);}
.chest.Legendario{--c1:#9df3ff;--c2:#1794b8;--c3:#d6faff;border-color:var(--leg);
  background:linear-gradient(180deg,#0f2f3d,#0a1a24);box-shadow:0 0 18px rgba(62,224,255,.3);
  animation:brillo 1.6s infinite alternate ease-in-out;}
@keyframes brillo{from{box-shadow:0 0 12px rgba(62,224,255,.24);}to{box-shadow:0 0 24px rgba(62,224,255,.5);}}

/* --- botones --- */
.btn-big{
  padding:15px;border-radius:32px;flex:none;color:#fff;
  font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:.6px;
  background:linear-gradient(180deg,#57e089,#1f9a4f);
  text-shadow:0 2px 3px rgba(0,0,0,.45);
  box-shadow:0 5px 0 #12653a,0 10px 22px rgba(45,190,100,.26),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .09s,box-shadow .09s,filter .12s;
}
.btn-big:hover{filter:brightness(1.06);}
.btn-big:active{transform:translateY(4px);box-shadow:0 1px 0 #12653a,inset 0 1px 0 rgba(255,255,255,.3);}
.btn-big.alt{background:linear-gradient(180deg,#5cb2ff,#1a63b8);box-shadow:0 5px 0 #10457f,0 10px 22px rgba(60,150,255,.24),inset 0 1px 0 rgba(255,255,255,.32);}
.btn-big.alt:active{box-shadow:0 1px 0 #10457f;}
.btn-sm{
  padding:9px 14px;border-radius:11px;font-family:var(--display);font-size:12.5px;font-weight:700;
  background:linear-gradient(180deg,#3c4a73,#26304e);border:1px solid #55639a;
  box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
}
.btn-sm:active{transform:translateY(2px);box-shadow:none;}

/* --- colección --- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.col-card{
  position:relative;border-radius:10px;padding:7px 4px 6px;
  background:var(--cbg,linear-gradient(180deg,#3b4568,#1c2440));
  border:2px solid var(--cbd,#3b466e);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);transition:transform .1s,box-shadow .15s;
}
.col-card:active{transform:scale(.95);}
.col-card.Common{--cbd:#9aa6c2;--cbg:linear-gradient(180deg,#3b4568,#1c2440);}
.col-card.Rare{--cbd:var(--rar);--cbg:linear-gradient(180deg,#4d3a1d,#241d33);}
.col-card.Epic{--cbd:var(--epi);--cbg:linear-gradient(180deg,#452a63,#221838);}
.col-card.Legendary{--cbd:var(--leg);--cbg:linear-gradient(180deg,#123f57,#101c39);}
.col-card.in{box-shadow:0 0 12px rgba(255,207,77,.35),inset 0 1px 0 rgba(255,255,255,.18);}
.col-card .cst{top:-6px;left:-6px;width:19px;height:19px;font-size:10px;border-width:1.5px;}
.col-card .mark{
  position:absolute;top:-6px;right:-6px;background:linear-gradient(180deg,#ffe07a,#e2a300);
  color:#241b02;font-family:var(--display);font-size:7.5px;font-weight:800;padding:1px 5px;border-radius:6px;
}
.col-card .ico{font-size:23px;line-height:1.1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
.col-card .nm{font-family:var(--display);font-size:8.5px;font-weight:700;text-align:center;line-height:1.05;
  height:19px;display:flex;align-items:center;}
.col-card .lv{font-family:var(--display);font-size:8.5px;color:var(--oro);font-weight:700;}
.prog{width:100%;height:5px;background:#0a0e1c;border-radius:3px;overflow:hidden;margin-top:3px;}

.up-btn{
  margin-top:4px;width:100%;border-radius:6px;padding:4px 2px;

/* ====== MODAL ====== */
#modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(3,5,11,.86);backdrop-filter:blur(2px);}
#modal.open{display:flex;}
.modal-box{
  width:100%;background:linear-gradient(160deg,#212b47,#141b2f);
  border:2px solid var(--borde);border-radius:18px;padding:22px 18px;text-align:center;
  box-shadow:0 20px 55px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);

@keyframes pop{from{transform:scale(.72);opacity:0;}to{transform:scale(1);opacity:1;}}

.help-list{text-align:left;font-size:12.5px;color:#c6cfe8;line-height:1.75;}

/* ---------------------------- UTILIDADES ---------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndInt = (a, b) => Math.floor(rnd(b + 1, a));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const $ = id => document.getElementById(id);

/* Almacenamiento tolerante a fallos (modo incógnito, cookies bloqueadas...) */
const Store = {
  get(key, def) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null || raw === undefined) return def;
      return JSON.parse(raw);
    } catch (e) { return def; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* sin persistencia */ }
  }
};

/* ------------------------------ AUDIO ------------------------------- */
const Snd = {
  ctx: null, master: null, muted: Store.get('cr2_muted', false),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = m; Store.set('cr2_muted', m);
    if (this.master) this.master.gain.value = m ? 0 : 0.5;
  },
  tone(freq, type, dur, vol, slideTo) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch (e) { /* ignorar */ }
  },
  noise(dur, vol, freq) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime;
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = freq || 900;
      const g = this.ctx.createGain(); g.gain.value = vol;
      src.connect(filt); filt.connect(g); g.connect(this.master);
      src.start(t);
    } catch (e) { /* ignorar */ }
  },
  deploy() { this.tone(330, 'triangle', 0.12, 0.10, 520); this.noise(0.12, 0.06, 1400); },
  melee() { this.noise(0.07, 0.09, 1800); },
  shoot() { this.tone(700, 'square', 0.06, 0.045, 380); },
  hit() { this.noise(0.05, 0.05, 2600); },
  boom() { this.noise(0.4, 0.22, 420); this.tone(70, 'sine', 0.35, 0.16, 30); },
  zap() { this.tone(1500, 'sawtooth', 0.16, 0.10, 220); },
  towerDown() { this.noise(0.7, 0.3, 300); this.tone(120, 'square', 0.6, 0.2, 40); },
  crown() { this.tone(880, 'sine', 0.16, 0.14); setTimeout(() => this.tone(1320, 'sine', 0.28, 0.14), 130); },

};

(function sanitize() {

  P.chests.length = 4;
  for (let i = 0; i < 4; i++) if (P.chests[i] === undefined) P.chests[i] = null;

  for (const id of CARD_IDS) {

  let deck = Array.isArray(P.deck) ? P.deck.filter(id => CARDS[id]) : [];
  deck = deck.filter((id, i) => deck.indexOf(id) === i).slice(0, 8);

}

  let best = null, bd = u.sight;
  for (const t of G.units) {
    if (t.team !== foe || !t.alive || !t.deployed || !canTarget(u, t)) continue;
    const d = dist(u.pos, t.pos) - t.radius;
    if (d < bd) { bd = d; best = t; }
  }
  for (const b of G.buildings) {
    if (b.team !== foe || !b.alive || !b.deployed || !canTarget(u, b)) continue;
    const d = dist(u.pos, b.pos) - b.radius;

    if (t.air && b.targets === 'ground') continue;

/* --------------------------- MOVIMIENTO ------------------------------- */
function bridgeUnder(x) {

  let best = BRIDGES[0], bd = Infinity;

    return { x: b.cx, y: ds === 'top' ? RIVER_TOP - 16 : RIVER_BOT + 16 };

function separate() {

      const dx = v.pos.x - u.pos.x, dy = v.pos.y - u.pos.y;
      const rr = u.radius + v.radius;

      if (d2 >= rr * rr || d2 < 0.001) continue;
      const d = Math.sqrt(d2);
      const ov = (rr - d) * 0.5;
      const ux = dx / d, uy = dy / d;
      const tu = v.mass / (u.mass + v.mass), tv = 1 - tu;
      u.pos.x -= ux * ov * tu; u.pos.y -= uy * ov * tu;
      v.pos.x += ux * ov * tv; v.pos.y += uy * ov * tv;
    }
    if (!u.air) {
      for (const b of G.buildings) {
        if (!b.alive) continue;
        const dx = u.pos.x - b.pos.x, dy = u.pos.y - b.pos.y;
        const rr = u.radius + b.radius * 0.92;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 < 0.001) continue;
        const d = Math.sqrt(d2);
        u.pos.x = b.pos.x + dx / d * rr;
        u.pos.y = b.pos.y + dy / d * rr;
      }
    }
    constrain(u);
  }
}

/* ---------------------------- PROYECTILES ------------------------------ */
class Shot {
  constructor(x, y, target, dmg, team, kind, opts) {
    this.pos = { x, y }; this.target = target;
    this.tp = { x: target.pos.x, y: target.pos.y - (target.isBuilding ? 8 : 4) };
    this.dmg = dmg; this.team = team; this.kind = kind || 'arrow';
    this.o = opts || {};
    this.speed = this.o.speed || (this.kind === 'arrow' ? 320 : 250);
    this.alive = true; this.angle = 0; this.t = 0;
    this.color = this.o.color || (this.kind === 'bolt' ? '#7fe8ff' : '#ffd75e');
  }
  update(dt) {
    this.t += dt;
    if (this.target && this.target.alive) {
      this.tp.x = this.target.pos.x;
      this.tp.y = this.target.pos.y - (this.target.isBuilding ? 8 : 4);
    }
    const dx = this.tp.x - this.pos.x, dy = this.tp.y - this.pos.y;
    const d = Math.hypot(dx, dy);
    this.angle = Math.atan2(dy, dx);
    const step = this.speed * dt;
    if (d <= step || d < 2) { this.pos.x = this.tp.x; this.pos.y = this.tp.y; this.hit(); return; }
    this.pos.x += dx / d * step;
    this.pos.y += dy / d * step;
    if (this.kind === 'magic' && Math.random() < dt * 30) {
      G.parts.push(new Part(this.pos.x, this.pos.y, { c: this.color, s: 2, life: .25, vx: 0, vy: 0 }));
    }
  }
  hit() {
    this.alive = false;
    if (this.o.splash) {
      dealArea(this.pos.x, this.pos.y, this.o.splash, this.dmg, this.team, { stun: this.o.stun });
      ring(this.pos.x, this.pos.y, this.o.splash, this.color);
      spark(this.pos.x, this.pos.y, this.color, 8);
      Snd.hit();
      return;
    }
    if (this.target && this.target.alive) {
      this.target.hurt(this.dmg, this);
      if (this.o.stun) this.target.stun = Math.max(this.target.stun, this.o.stun);
      spark(this.pos.x, this.pos.y, this.color, 4);
      Snd.hit();
    } else {
      spark(this.pos.x, this.pos.y, '#cccccc', 2);
    }
  }
}

/* ------------------------------ HECHIZOS ------------------------------- */
class Cast {
  constructor(cardId, x, y, team, level) {
    this.card = CARDS[cardId]; this.x = x; this.y = y; this.team = team;
    this.level = level || 1;
    this.delay = this.card.rage ? 0.25 : (this.card.id === 'ZAP' ? 0.12 : 0.55);
    this.total = this.delay; this.alive = true;
  }
  update(dt) {
    this.delay -= dt;
    if (this.delay <= 0) { this.apply(); this.alive = false; }
  }
  apply() {
    const c = this.card, m = levelMult(this.level);
    if (c.rage) {
      G.zones.push({ x: this.x, y: this.y, r: c.radius, team: this.team, life: c.duration, max: c.duration });
      ring(this.x, this.y, c.radius, c.color);
      Snd.zap();
      return;
    }
    dealArea(this.x, this.y, c.radius, c.dmg * m, this.team, {
      towerMult: c.towerMult, stun: c.stun, knock: c.knock, falloff: c.id === 'FIREBALL'
    });
    ring(this.x, this.y, c.radius, c.color);
    if (c.id === 'ZAP') {
      Snd.zap();
      for (let i = 0; i < 10; i++) spark(this.x + rnd(40, -40), this.y + rnd(40, -40), c.color, 2);
    } else {
      boom(this.x, this.y, c.radius, c.color);
      Snd.boom();
      G.shake = Math.max(G.shake, c.id === 'FIREBALL' ? 10 : 5);
    }
  }
}

function dealArea(x, y, r, dmg, team, opts) {
  opts = opts || {};
  const foe = enemyOf(team), p = { x, y };
  const list = G.units.concat(G.buildings);
  for (const e of list) {
    if (!e.alive || e.team !== foe || !e.deployed) continue;
    const d = dist(e.pos, p);
    if (d > r + e.radius) continue;
    let dm = dmg;
    if (opts.towerMult && e.isTower) dm *= opts.towerMult;
    if (opts.falloff) dm *= lerp(1, 0.6, clamp(d / (r + e.radius), 0, 1));
    e.hurt(dm, null);
    if (opts.stun) e.stun = Math.max(e.stun || 0, opts.stun);
    if (opts.knock && !e.isBuilding && e.alive) {
      const a = Math.atan2(e.pos.y - y, e.pos.x - x) || 0;
      e.pos.x += Math.cos(a) * opts.knock;
      e.pos.y += Math.sin(a) * opts.knock;
      constrain(e);
    }
  }
}

/* ------------------------------ EFECTOS -------------------------------- */
class Part {
  constructor(x, y, o) {
    this.x = x; this.y = y;
    this.vx = o.vx !== undefined ? o.vx : rnd(60, -60);
    this.vy = o.vy !== undefined ? o.vy : rnd(60, -60);
    this.g = o.g || 0; this.c = o.c || '#fff'; this.s = o.s || 3;
    this.life = o.life || 0.5; this.max = this.life; this.shape = o.shape || 'sq';
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vy += this.g * dt; this.life -= dt;
  }
}
function spark(x, y, c, n) {
  for (let i = 0; i < n; i++) G.parts.push(new Part(x, y, { c, s: rnd(3, 1.5), life: rnd(.4, .2), g: 120 }));
}
function poof(x, y, c, n) {
  for (let i = 0; i < n; i++) G.parts.push(new Part(x, y, { c, s: rnd(5, 2), life: rnd(.6, .3), vx: rnd(45, -45), vy: rnd(20, -55), g: 40, shape: 'ci' }));
}
function boom(x, y, r, c) {
  G.parts.push(new Part(x, y, { c, s: r, life: .35, vx: 0, vy: 0, shape: 'ring' }));
  for (let i = 0; i < 16; i++) {
    const a = rnd(TAU);
    const sp = rnd(r * 4, r);
    G.parts.push(new Part(x, y, { c, s: rnd(5, 2), life: rnd(.6, .25), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 90 }));
  }
}
function ring(x, y, r, c) {
  G.parts.push(new Part(x, y, { c, s: r, life: .4, vx: 0, vy: 0, shape: 'ring' }));
}
function floatText(x, y, text, color) {
  G.floats.push({ x, y, text, color, life: 1.3, max: 1.3 });
}

/* ============================== DIBUJO ================================= */
const cv = $('arena');
const ctx = cv.getContext('2d');
let DPR = 1;
function setupCanvas() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
}
setupCanvas();

function rr(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
  ctx.lineTo(x + w, y + h - rad); ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  ctx.lineTo(x + rad, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
  ctx.lineTo(x, y + rad); ctx.quadraticCurveTo(x, y, x + rad, y);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ------------------------------- ARENA -------------------------------- */
/* Ruido determinista: la decoración de cada arena siempre sale igual */
function seeded(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const bgCv = document.createElement('canvas');
const bgCtx = bgCv.getContext('2d');
let bgKey = '';

function padRects() {
  const out = [];
  for (const p of PRINCESS) out.push({ x: p.x, y: p.y, w: 74, h: 74 });
  out.push({ x: 240, y: KING_Y.enemy, w: 92, h: 86 });
  out.push({ x: 240, y: KING_Y.player, w: 92, h: 86 });
  return out;
}

function buildBackground() {
  const A = G.arena;
  const key = A.name + '|' + DPR;
  if (bgKey === key) return;
  bgKey = key;
  bgCv.width = W * DPR; bgCv.height = H * DPR;
  const c = bgCtx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rnd2 = seeded(ARENAS.indexOf(A) * 7919 + 13);

  /* césped base con degradado suave */
  const gg = c.createLinearGradient(0, 0, 0, H);
  gg.addColorStop(0, shade(A.grass, -14));
  gg.addColorStop(.45, A.grass);
  gg.addColorStop(1, shade(A.grass, -10));
  c.fillStyle = gg; c.fillRect(0, 0, W, H);

  /* damero */
  c.fillStyle = 'rgba(255,255,255,.032)';
  for (let y = 0; y < H; y += 40) {
    for (let x = 0; x < W; x += 40) if (((x / 40) + (y / 40)) % 2 === 0) c.fillRect(x, y, 40, 40);
  }

  /* plataformas de las torres */
  for (const p of padRects()) {
    c.save();
    c.fillStyle = 'rgba(0,0,0,.16)';
    rrIn(c, p.x - p.w / 2, p.y - p.h / 2 + 4, p.w, p.h, 12); c.fill();
    const pg = c.createRadialGradient(p.x, p.y, 4, p.x, p.y, p.w * .62);
    pg.addColorStop(0, shade(A.grass, -20));
    pg.addColorStop(.75, shade(A.grass, -13));
    pg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = pg;
    c.beginPath(); c.ellipse(p.x, p.y + 2, p.w * .60, p.h * .52, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = 1.5;
    c.beginPath(); c.ellipse(p.x, p.y + 2, p.w * .52, p.h * .45, 0, 0, TAU); c.stroke();
    c.restore();
  }

  /* decoración: matas, piedras y flores fuera de zonas de juego */
  const libre = (x, y) => {
    if (y > RIVER_TOP - 22 && y < RIVER_BOT + 22) return false;
    for (const p of padRects()) {
      if (Math.abs(x - p.x) < p.w / 2 + 14 && Math.abs(y - p.y) < p.h / 2 + 14) return false;
    }
    return true;
  };
  const florCol = { nieve: '#dff0ff', magia: '#e2a8ff', oro: '#ffe08a', electro: '#8affc0', brasas: '#ff9a5a' }[A.fx] || '#ffe9a8';
  for (let i = 0; i < 130; i++) {
    const x = 14 + rnd2() * (W - 28), y = 16 + rnd2() * (H - 32);
    if (!libre(x, y)) continue;
    const r = rnd2();
    if (r < .55) {
      /* mata de hierba */
      c.strokeStyle = shade(A.grass, -26); c.lineWidth = 1.6; c.lineCap = 'round';
      for (let k = -1; k <= 1; k++) {
        c.beginPath(); c.moveTo(x + k * 2.6, y + 2);
        c.quadraticCurveTo(x + k * 3.6, y - 2, x + k * 4.4, y - 5.5);
        c.stroke();
      }
    } else if (r < .82) {
      /* piedra */
      c.fillStyle = 'rgba(0,0,0,.14)';
      c.beginPath(); c.ellipse(x, y + 2, 4.4, 2.4, 0, 0, TAU); c.fill();
      c.fillStyle = shade(A.grass, 34);
      c.beginPath(); c.ellipse(x, y, 4, 2.8, rnd2(), 0, TAU); c.fill();
    } else {
      /* florecilla */
      c.fillStyle = florCol;
      for (let k = 0; k < 4; k++) {
        const ang = k * TAU / 4;
        c.beginPath(); c.arc(x + Math.cos(ang) * 1.8, y + Math.sin(ang) * 1.8, 1.3, 0, TAU); c.fill();
      }
      c.fillStyle = '#f7d774';
      c.beginPath(); c.arc(x, y, 1.1, 0, TAU); c.fill();
    }
  }

  /* lecho del río */
  const rg = c.createLinearGradient(0, RIVER_TOP, 0, RIVER_BOT);
  rg.addColorStop(0, shade(A.river, -34));
  rg.addColorStop(.45, A.river);
  rg.addColorStop(1, shade(A.river, -40));
  c.fillStyle = rg;
  c.fillRect(0, RIVER_TOP, W, RIVER_BOT - RIVER_TOP);
  /* orillas de tierra */
  for (const [y0, dir] of [[RIVER_TOP - 7, 1], [RIVER_BOT, -1]]) {
    const og = c.createLinearGradient(0, y0, 0, y0 + 7);
    og.addColorStop(dir > 0 ? 0 : 1, 'rgba(0,0,0,0)');
    og.addColorStop(dir > 0 ? 1 : 0, 'rgba(20,12,6,.5)');
    c.fillStyle = og; c.fillRect(0, y0, W, 7);
  }

  /* muros de arena arriba y abajo */
  for (const top of [true, false]) {
    const y = top ? 0 : H - 12;
    c.fillStyle = 'rgba(10,14,22,.55)';
    c.fillRect(0, y, W, 12);
    c.fillStyle = 'rgba(255,255,255,.10)';
    for (let x = 4; x < W; x += 24) c.fillRect(x, y + (top ? 6 : 0), 14, 6);
  }
  c.fillStyle = 'rgba(10,14,22,.42)';
  c.fillRect(0, 0, 9, H); c.fillRect(W - 9, 0, 9, H);
  /* viñeteado */
  const vg = c.createRadialGradient(W / 2, H / 2, H * .32, W / 2, H / 2, H * .78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.30)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
}

/* rr() sobre un contexto concreto (el fondo se dibuja fuera de pantalla) */
function rrIn(c, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rad, y);
  c.lineTo(x + w - rad, y); c.quadraticCurveTo(x + w, y, x + w, y + rad);
  c.lineTo(x + w, y + h - rad); c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  c.lineTo(x + rad, y + h); c.quadraticCurveTo(x, y + h, x, y + h - rad);
  c.lineTo(x, y + rad); c.quadraticCurveTo(x, y, x + rad, y);
  c.closePath();
}

function drawArena() {
  const A = G.arena;
  buildBackground();
  ctx.drawImage(bgCv, 0, 0, W, H);

  /* agua en movimiento */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, RIVER_TOP, W, RIVER_BOT - RIVER_TOP); ctx.clip();
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.22 - i * 0.05) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    const yy = RIVER_TOP + 9 + i * 13;
    for (let x = -10; x <= W + 10; x += 10) {
      const y = yy + Math.sin((x * 0.055) + G.t * (1.5 + i * .4) + i * 1.3) * 2.6;
      if (x <= -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  /* espuma en las orillas */
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  for (let x = 0; x < W; x += 16) {
    const h1 = 2 + Math.sin(x * .12 + G.t * 2) * 1.4;
    ctx.fillRect(x, RIVER_TOP + 1, 11, Math.max(.6, h1));
    ctx.fillRect(x + 5, RIVER_BOT - 3, 11, Math.max(.6, 2 + Math.sin(x * .1 - G.t * 2.2) * 1.4));
  }
  /* destellos */
  for (let i = 0; i < 6; i++) {
    const x = ((i * 97 + G.t * 12) % (W + 40)) - 20;
    const y = RIVER_TOP + 8 + ((i * 13) % 26);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.10 + 0.08 * Math.sin(G.t * 3 + i)).toFixed(2) + ')';
    ctx.fillRect(x, y, 9, 1.6);
  }
  ctx.restore();

  /* puentes */
  for (const b of BRIDGES) {
    const y0 = RIVER_TOP - 9, hh = (RIVER_BOT - RIVER_TOP) + 18;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    rr(b.x - 4, y0 + 3, b.w + 8, hh, 6); ctx.fill();
    ctx.fillStyle = shade(A.bridge, -38);
    rr(b.x - 4, y0, b.w + 8, hh, 6); ctx.fill();
    ctx.fillStyle = A.bridge;
    rr(b.x, y0 + 3, b.w, hh - 6, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.4;
    for (let y = y0 + 8; y < y0 + hh - 6; y += 8) {
      ctx.beginPath(); ctx.moveTo(b.x + 2, y); ctx.lineTo(b.x + b.w - 2, y); ctx.stroke();
    }
    ctx.fillStyle = shade(A.bridge, 34);
    ctx.fillRect(b.x - 1, y0 + 3, 4, hh - 6);
    ctx.fillRect(b.x + b.w - 3, y0 + 3, 4, hh - 6);
    /* postes en los cuatro extremos */
    ctx.fillStyle = shade(A.bridge, -20);
    for (const py of [y0 + 1, y0 + hh - 7]) {
      rr(b.x - 6, py, 9, 8, 2); ctx.fill();
      rr(b.x + b.w - 3, py, 9, 8, 2); ctx.fill();
    }
  }

  /* línea de medio campo */
  ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 2;
  ctx.setLineDash([7, 9]);
  ctx.beginPath(); ctx.moveTo(240, 14); ctx.lineTo(240, RIVER_TOP - 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(240, RIVER_BOT + 8); ctx.lineTo(240, H - 14); ctx.stroke();
  ctx.setLineDash([]);
}

function unlockedLanes() { return G.openLanes; }
function canDeploy(card, x, y) {
  if (x < 14 || x > W - 14 || y < 14 || y > H - 14) return false;
  if (card.type === 'spell' || card.anywhere) return true;
  if (y > RIVER_BOT + 6) return true;

  for (const l of unlockedLanes()) ctx.strokeRect(l.x0 + 2, l.y0, l.x1 - l.x0 - 4, RIVER_TOP - l.y0);

}

/* ------------------------- BARRA DE VIDA ------------------------------ */
function healthBar(e, w, yoff) {
  if (e.hp >= e.maxHp - 0.01 && !e.isTower) return;
  const h = e.isTower ? 6 : 3.6, x = e.pos.x - w / 2, y = e.pos.y - yoff;

  rr(x - 1.5, y - 1.5, w + 3, h + 3, 3); ctx.stroke();

  if (pw > 0.5) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    if (e.team === 'player') { g.addColorStop(0, '#7ff0a6'); g.addColorStop(1, '#2fa85c'); }
    else { g.addColorStop(0, '#ff9a9a'); g.addColorStop(1, '#c93b3b'); }
    ctx.fillStyle = g;
    rr(x, y, pw, h, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    rr(x, y, pw, h * .42, 2); ctx.fill();
  }
  if (e.isTower) {

      ctx.beginPath(); ctx.moveTo(x + (w / 4) * i, y); ctx.lineTo(x + (w / 4) * i, y + h); ctx.stroke();
    }
