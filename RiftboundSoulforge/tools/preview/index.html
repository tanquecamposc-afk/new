// procedural noise textures for material variety
const texCache = {};
function noiseTex(kind) {

  const img = g.createImageData(128, 128);

const MAT = {
  Neon: { neon: true }, ForceField: { ff: true }, Glass: { glass: true },
  Metal: { metal: 0.8, rough: 0.35 }, Marble: { rough: 0.3 }, SmoothPlastic: { rough: 0.5 }, Plastic: { rough: 0.6 },
  Slate: { tex: 'slate' }, Basalt: { tex: 'rock' }, Rock: { tex: 'rock' }, Cobblestone: { tex: 'cobble' }, Brick: { tex: 'brick' },
  WoodPlanks: { tex: 'planks' }, Wood: { tex: 'planks' }, Grass: { tex: 'grass' }, Ground: { tex: 'grass' }, Sandstone: { tex: 'slate' },
  Pavement: { tex: 'slate' }, Fabric: { tex: 'grass', rough: 1 },

const matCache = {};
function material(p) {

  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}

}
function textPlane(p) {

  c.width = Math.max(64, sx * s); c.height = Math.max(32, sy * s); const g = c.getContext('2d');
  g.fillStyle = `rgb(${p.col.map(v => v * 255).join(',')})`; g.fillRect(0, 0, c.width, c.height);

const world = await (await fetch('world.json')).json();
const lights = [];

  const geo = p.s === 'Ball' ? GEO.ball : p.s === 'Cylinder' ? GEO.cyl : (p.c === 'WedgePart' || p.c === 'CornerWedgePart') ? GEO.wedge : GEO.box;

// nearest point lights to the view target

}

world.terrain.forEach((f, i) => {
  const col = new THREE.Color(...(tcol[f.mat] || [0.5, 0.5, 0.5]));
  const texKind = f.mat.includes('Grass') ? 'grass' : f.mat === 'CrackedLava' ? 'cobble' : 'rock';
  const m = f.mat === 'CrackedLava' ? new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(1.8) }) : new THREE.MeshStandardMaterial({ color: col, roughness: 0.95, map: noiseTex(texKind) });
  let mesh;
  if (f.k === 'ball') { mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(f.r, 3), m); mesh.position.set(...f.p); }
  else if (f.k === 'block') { mesh = new THREE.Mesh(GEO.box, m); const h = new THREE.Object3D(); h.matrixAutoUpdate = false; h.matrix.copy(matrix([f.p[0], f.p[1] + i * 0.004, f.p[2]], f.m)); mesh.scale.set(...f.sz); h.add(mesh); mesh.receiveShadow = true; scene.add(h); return; }
  else { mesh = new THREE.Mesh(new THREE.CylinderGeometry(f.r, f.r, f.h, 64), m); mesh.position.set(f.p[0], f.p[1], f.p[2]); }
  mesh.receiveShadow = true; mesh.castShadow = false; scene.add(mesh);
});

// grass decoration (Terrain.Decoration = true in the place)
{
  const blade = new THREE.ConeGeometry(0.07, 0.85, 3).translate(0, 0.42, 0);
  const n = 60000;
  const inst = new THREE.InstancedMesh(blade, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }), n);
  const d = new THREE.Object3D(); let k = 0; const c = new THREE.Color();
  const green = new THREE.Color(...tcol.Grass), autumn = new THREE.Color(...tcol.LeafyGrass);
  while (k < n) {
    let x, z;
    if (k % 3 === 0) { const a = Math.random() * Math.PI * 2, r = 62 + Math.random() * 100; x = Math.cos(a) * r; z = Math.sin(a) * r; }
    else { x = E.x + Math.random() * 300 - 40; z = Math.random() * 196 - 98; if (Math.abs(z) < 7 || (x > E.x - 40 && x < E.x + 50 && Math.abs(z) < 50)) continue; }
    d.position.set(x, 0, z); d.rotation.set((Math.random() - .5) * .5, Math.random() * 6, (Math.random() - .5) * .5);
    const s = 0.6 + Math.random() * 0.9; d.scale.set(s, s, s); d.updateMatrix(); inst.setMatrixAt(k, d.matrix);
    c.copy(green).lerp(autumn, Math.random() * 0.6).multiplyScalar(0.8 + Math.random() * 0.4); inst.setColorAt(k, c); k++;

}

// scene extras per view: VFX the game spawns during play (telegraphs, slash arcs, auras)
function telegraphCircle(center, r, color = 0xff4632) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.CircleGeometry(r, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.28, depthWrite: false }));
  const fill = new THREE.Mesh(new THREE.CircleGeometry(r * 0.62, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, depthWrite: false }));

}
function telegraphLine(origin, dir, len, width, color = 0xff4632) {
  const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.PlaneGeometry(width, len), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, depthWrite: false }));
  const f = new THREE.Mesh(new THREE.PlaneGeometry(width, len * 0.6), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, depthWrite: false }));

function slashArc(root, facing, tilt, from, to, radius, color, width = 1.8) {

    const p1 = new THREE.Vector3(-Math.sin(t1) * radius, 0, -Math.cos(t1) * radius).applyMatrix4(base.matrixWorld);
