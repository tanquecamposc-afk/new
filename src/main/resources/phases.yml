# ---------------------------------------------------------------
#  OneBlock - las 10 fases
# ---------------------------------------------------------------
#  El orden y los temas siguen al mapa original: Llanuras, Subterraneo,
#  Tundra, Oceano, Jungla, Desierto Rojo, Nether, Idilio, Tierra Desolada
#  y El End. Al terminar la ultima empieza la Fase Infinita, que mezcla
#  bloques de todas (ver 'infinite' en config.yml).
#
#  blocks / mobs usan el formato  NOMBRE:peso  (peso = probabilidad relativa)
#  chest-loot se divide por rareza: common, uncommon, rare, epic.
#  Cada linea de botin acepta tres formatos:
#      NOMBRE:cantidad            -> cantidad fija, siempre sale
#      NOMBRE:min-max             -> cantidad aleatoria, siempre sale
#      NOMBRE:min-max:prob        -> cantidad aleatoria con probabilidad en %
#  required-blocks es el total acumulado de bloques picados.
# ---------------------------------------------------------------

