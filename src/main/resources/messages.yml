# <shift> anima el degradado, <bar> dibuja la barra unicode, <phase_color> es el color de la fase.
hologram:
  island:
    - '<gradient:#00ffcc:#0088ff:<shift>><bold>◆ <owner> ◆</bold></gradient>'
    - '<phase_color><bold><phase></bold></phase_color> <dark_gray>❘</dark_gray> <white><blocks></white> <gray>bloques</gray>'
    - '<bar> <yellow><progress>%</yellow>'
    - '<dark_gray>▸</dark_gray> <gray>Siguiente <white><next></white> <dark_gray>en <remaining></dark_gray>'

