  title: '<gradient:#00e0ff:#a56bff><bold>✦ <phase> ✦</bold></gradient>'
  subtitle: '<gray>Fase desbloqueada</gray>'

void:
  rescued: '<light_purple>El vacio no te queria. Te devolvemos al bloque.</light_purple>'

hud:
  bossbar: '<white><bold><phase></bold></white> <dark_gray>❘</dark_gray> <yellow><progress>%</yellow> <dark_gray>❘</dark_gray> <gray>faltan</gray> <white><remaining></white> <gray>para</gray> <aqua><next></aqua>'
