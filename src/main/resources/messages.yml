# ---------------------------------------------------------------

prefix: '<gradient:#ff0055:#ff8a00><bold>ONE</bold></gradient><gradient:#ff8a00:#ffd000><bold>BLOCK</bold></gradient> <dark_gray>❘</dark_gray> '

