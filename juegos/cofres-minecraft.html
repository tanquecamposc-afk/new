<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cofres Minecraft — Arcade NEXO</title>
<link rel="stylesheet" href="arcade.css">
<style>
  /* Interfaz de bloques: biseles duros, texto con sombra y píxeles nítidos.
     Los iconos se dibujan a 16x16 por código y se amplían sin suavizar, así
     que el arcade sigue sin depender de fuentes ni imágenes externas. */
  #juego{width:min(1060px,100vw);}
  #mc{font-family:"Courier New", Courier, monospace; display:flex; flex-direction:column; gap:14px;}
  #mc *{image-rendering:pixelated;}

  /* --- Ventana de interfaz --- */
  .ventana{
    background:#c6c6c6; border:4px solid; border-color:#fff #555 #555 #fff;
    box-shadow:0 8px 0 #000; padding:14px; color:#373737;
    display:flex; flex-direction:column; gap:12px;
  }
  .rotulo{font-size:12px; font-weight:700; color:#fff; text-shadow:2px 2px #000;}

  .mcbtn{
    background:#727272; border:3px solid; border-color:#a8a8a8 #373737 #373737 #a8a8a8;
    color:#fff; padding:9px 13px; font-size:11px; font-weight:700; cursor:pointer;
    font-family:inherit; text-shadow:2px 2px #000; border-radius:0;
    box-shadow:inset -2px -2px 0 0 #212121; transition:background .06s;
  }
  .mcbtn:hover{background:#8b8b8b;}
  .mcbtn:active{border-color:#373737 #a8a8a8 #a8a8a8 #373737; box-shadow:inset 2px 2px 0 0 #212121;}
  .mcbtn:disabled{background:#4a4a4a; border-color:#666 #222 #222 #666; color:#888; cursor:not-allowed;}
  .mcbtn.rojo{background:#a02020; border-color:#d05050 #601010 #601010 #d05050;}
  .mcbtn.verde{background:#2e7d32; border-color:#4caf50 #1b5e20 #1b5e20 #4caf50;}
  .mcbtn.sel{background:#3f3fbf; border-color:#8080ff #1a1a80 #1a1a80 #8080ff;}

  /* --- Cabecera: esmeraldas y experiencia --- */
  #cabeza{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    background:#8b8b8b; border:3px solid; border-color:#373737 #fff #fff #373737; padding:11px;
  }
  #cabeza .saldo{
    display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700;
    color:#00c400; text-shadow:2px 2px #000;
  }
  #cabeza .saldo.coins{color:#ffd24d;}
  #xp{display:flex; flex-direction:column; align-items:center; width:230px; max-width:45vw;}
  #xpTubo{width:100%; height:12px; background:#000; border:2px solid #373737; position:relative;}
  #xpRelleno{height:100%; width:0%; background:#55ff55; box-shadow:inset 0 -2px 0 #00aa00; transition:width .3s;}
  #xpTexto{font-size:11px; font-weight:700; color:#55ff55; text-shadow:2px 2px #000; margin-top:4px;}

  /* --- Ruleta --- */
  #ruleta{
    position:relative; height:158px; background:#090909; overflow:hidden;
    border:4px solid; border-color:#373737 #fff #fff #373737;
  }
  #aguja{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:4px; height:100%; background:#ff5555; box-shadow:0 0 10px #ff0000; z-index:20;
  }
  #ruleta::before, #ruleta::after{
    content:''; position:absolute; top:0; bottom:0; width:60px; z-index:10; pointer-events:none;
  }
  #ruleta::before{left:0; background:linear-gradient(90deg,#090909,transparent);}
  #ruleta::after{right:0; background:linear-gradient(270deg,#090909,transparent);}
  #cinta{display:flex; position:absolute; left:0; top:11px; height:136px; will-change:transform;}

  .casilla{
    min-width:120px; width:120px; height:136px; background:#8b8b8b; margin:0 4px;
    border:3px solid; border-color:#373737 #fff #fff #373737;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px; position:relative;
  }
  .casilla .nom{
    font-size:8.5px; font-weight:700; margin-top:6px; text-align:center;
    height:22px; overflow:hidden; line-height:1.3; text-shadow:1px 1px #000;
  }

  /* Icono con brillo de encantamiento */
  .icono{position:relative; width:56px; height:56px; display:flex; align-items:center; justify-content:center;}
  .icono img{width:52px; height:52px; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.6));}
  .icono.encantado::after{
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:3px;
    background:linear-gradient(135deg, transparent 20%, rgba(180,70,255,.7) 48%,
      rgba(255,150,255,.9) 50%, rgba(180,70,255,.7) 52%, transparent 80%);
    background-size:200% 200%; mix-blend-mode:color-dodge;
    animation:glint 2s linear infinite;
  }
  @keyframes glint{from{background-position:-100% -100%;} to{background-position:100% 100%;}}

  /* --- Cofres --- */
  #rejillaCofres{display:grid; grid-template-columns:repeat(auto-fit,minmax(206px,1fr)); gap:12px;}
  .cofre{
    background:#8b8b8b; border:3px solid; border-color:#fff #373737 #373737 #fff;
    padding:13px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .cofre img{width:64px; height:64px; filter:drop-shadow(4px 4px 0 #222);}
  .cofre .tit{font-size:11px; font-weight:700; color:#fff; text-shadow:2px 2px #000;}
  .cofre .precio{
    font-size:11px; font-weight:700; color:#55ff55; text-shadow:1px 1px #000;
    display:flex; align-items:center; gap:5px; justify-content:center;
  }
  .cofre .precio img{width:14px; height:14px; filter:none;}
  .cofre .odds{font-size:8.5px; line-height:1.7; text-shadow:1px 1px #000;}
  .cofre .mcbtn{width:100%;}

  /* --- Pestañas e inventario --- */
  #pestanas{display:flex; gap:8px; flex-wrap:wrap;}
  #pestanas .mcbtn{flex:1; min-width:128px;}
  .hoja{display:none;}
  .hoja.activa{display:block;}

  #mandoInv{display:flex; gap:8px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  #rejillaInv{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:6px;
    background:#373737; padding:9px; border:3px solid #111;
    max-height:330px; overflow-y:auto;
  }
  .ranuraInv{
    width:100%; aspect-ratio:1/1; background:#8b8b8b; border:3px solid;
    border-color:#373737 #fff #fff #373737;
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
  }
  .ranuraInv:hover{background:#9d9d9d;}
  .ranuraInv.elegida{background:#5a5a2a; border-color:#ffff55 #776b12 #776b12 #ffff55;}
  .ranuraInv .icono{width:46px; height:46px;}
  .ranuraInv .icono img{width:42px; height:42px;}
  .ranuraInv .marcaRareza{position:absolute; bottom:2px; left:2px; right:2px; height:3px;}
  #vacio{grid-column:1/-1; text-align:center; color:#999; font-size:11px; padding:26px 0; text-shadow:1px 1px #000;}

  /* --- Contrato --- */
  #contrato{text-align:center; color:#fff;}
  #contrato p{font-size:11px; line-height:1.9; text-shadow:1px 1px #000;}
  #ranuras{display:flex; gap:8px; justify-content:center; margin:14px 0; flex-wrap:wrap;}
  .ranuraC{
    width:58px; height:58px; background:#8b8b8b; border:3px solid;
    border-color:#373737 #fff #fff #373737; display:flex; align-items:center; justify-content:center;
  }
  .ranuraC .icono{width:44px; height:44px;}
  .ranuraC .icono img{width:40px; height:40px;}
  #cuentaSel{color:#ffff55;}

  /* --- Tooltip --- */
  #tooltip{
    position:fixed; display:none; pointer-events:none; z-index:10000; max-width:250px;
    background:rgba(16,0,16,.94); border:3px solid #2e0062; border-radius:3px;
    box-shadow:0 0 0 2px #100010, inset 0 0 10px rgba(80,0,160,.5);
    padding:7px 11px; font-family:"Courier New", Courier, monospace;
  }
  #tooltip .t{font-size:12px; font-weight:700; text-shadow:2px 2px #000;}
  #tooltip .r{font-size:9.5px; margin-top:3px; text-shadow:1px 1px #000;}
  #tooltip .e{font-size:9.5px; color:#aaaaaa; margin-top:3px; text-shadow:1px 1px #000;}
  #tooltip .v{font-size:9.5px; color:#55ff55; margin-top:5px; text-shadow:1px 1px #000;}

  /* --- Partículas y premio --- */
  #particulas{position:absolute; inset:0; pointer-events:none; z-index:900;}
  #premio{
    position:fixed; inset:0; background:rgba(0,0,0,.85); display:none;
    align-items:center; justify-content:center; z-index:9000;
  }
  #premio.visible{display:flex;}
  #premio .tarjeta{
    background:#c6c6c6; border:6px solid; border-color:#fff #373737 #373737 #fff;
    padding:24px; text-align:center; max-width:420px; width:90%;
    box-shadow:0 0 30px #000; font-family:"Courier New", Courier, monospace;
  }
  #premio .eti{font-size:13px; font-weight:700; color:#ffff55; text-shadow:2px 2px #000; margin-bottom:14px;}
  #premio .icono{width:96px; height:96px; margin:0 auto 14px;}
  #premio .icono img{width:88px; height:88px;}
  #premio .nom{font-size:15px; font-weight:700; text-shadow:2px 2px #000; margin-bottom:6px;}
  #premio .rar{font-size:11px; font-weight:700; text-shadow:1px 1px #000; margin-bottom:6px;}
  #premio .enc{font-size:11px; color:#8a4fdd; min-height:14px; margin-bottom:8px;}
  #premio .val{font-size:12px; color:#0a6b0a; margin-bottom:16px;}
  #premio .botones{display:flex; gap:10px; justify-content:center;}

  @media (max-width:620px){
    .casilla{min-width:104px; width:104px;}
    #xp{width:100%;}
  }
</style>
</head>
<body>

<div id="juego">
  <div class="barra">
    <a class="boton" href="../index.html">🕹 Arcade</a>
    <div class="titulo" style="color:#55ff55">⛏ COFRES MINECRAFT</div>
    <div class="sep"></div>
    <div class="stat">💎 <span id="esmeTxt" class="verde">1000</span></div>
    <div class="stat">🪙 <span id="coinsTxt" class="tenue">0</span></div>
    <button id="btnSonido" title="Sonido" aria-label="Sonido">🔊</button>
  </div>

  <div id="mc" style="position:relative">
    <canvas id="particulas"></canvas>

    <!-- ---------- Ventana de apertura ---------- -->
    <div class="ventana">
      <div id="cabeza">
        <div class="saldo"><span id="icoEsme"></span><span id="esme2">1.000</span></div>
        <div id="xp">
          <div id="xpTubo"><div id="xpRelleno"></div></div>
          <div id="xpTexto">Nivel <span id="nivelTxt">1</span></div>
        </div>
        <div class="saldo coins">🪙 <span id="coins2">0</span></div>
      </div>

      <div id="ruleta">
        <div id="aguja"></div>
        <div id="cinta"></div>
      </div>

      <div class="rotulo">SELECCIONA UN COFRE</div>
      <div id="rejillaCofres"></div>
    </div>

    <!-- ---------- Ventana de inventario ---------- -->
    <div class="ventana">
      <div id="pestanas">
        <button class="mcbtn sel" data-hoja="inventario">🎒 INVENTARIO (<span id="numInv">0</span>)</button>
        <button class="mcbtn" data-hoja="contrato">⚒️ CONTRATO DE FUSIÓN</button>
      </div>

      <div class="hoja activa" id="hoja-inventario">
        <div id="mandoInv">
          <button class="mcbtn rojo" id="btnVenderComunes">VENDER COMUNES</button>
          <button class="mcbtn" id="btnCambiar">🪙 100 → 💎 1.000</button>
          <button class="mcbtn verde" id="btnRegalo" style="display:none">🎁 200 ESMERALDAS</button>
        </div>
        <div id="rejillaInv"></div>
        <div class="rotulo" style="margin-top:9px; font-size:9.5px; color:#373737; text-shadow:none">
          Pasa el ratón para ver el objeto · clic para meterlo en el contrato · botón derecho para venderlo
        </div>
      </div>

      <div class="hoja" id="hoja-contrato">
        <div id="contrato">
          <p>Mete <b>5 objetos de la misma rareza</b> y fórjalos en <b>1 de la rareza superior</b>.</p>
          <div id="ranuras"></div>
          <p>Seleccionados: <span id="cuentaSel">0</span> / 5</p>
          <button class="mcbtn verde" id="btnForjar" style="margin-top:12px" disabled>FORJAR OBJETO</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="tooltip">
  <div class="t" id="ttNombre"></div>
  <div class="r" id="ttRareza"></div>
  <div class="e" id="ttEncanto"></div>
  <div class="v" id="ttValor"></div>
</div>

<div id="premio">
  <div class="tarjeta">
    <div class="eti">¡OBJETO OBTENIDO!</div>
    <div class="icono" id="pIcono"></div>
    <div class="nom" id="pNombre"></div>
    <div class="rar" id="pRareza"></div>
    <div class="enc" id="pEncanto"></div>
    <div class="val" id="pValor"></div>
    <div class="botones">
      <button class="mcbtn verde" id="btnGuardar">GUARDAR</button>
      <button class="mcbtn rojo" id="btnVenderYa">VENDER</button>
    </div>
  </div>
</div>

<script src="arcade.js"></script>
<script>
// ============================================================
//  COFRES MINECRAFT — simulador de cajas con fusión de objetos
//  Todos los iconos son pixel art de 16x16 dibujado por código.
// ============================================================
const $ = id => document.getElementById(id);

// ---------- Dibujo de sprites 16x16 ----------
const LADO = 16;
function lienzoSprite(){
  const c = document.createElement('canvas');
  c.width = LADO; c.height = LADO;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { c, x };
}
const px = (x, cx, cy, col, an = 1, al = 1) => { x.fillStyle = col; x.fillRect(cx, cy, an, al); };

/** Textura de bloque: ruido estable a partir de una semilla. */
function bloque(colores, semilla){
  const { c, x } = lienzoSprite();
  let s = semilla;
  const azarFijo = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  for (let j = 0; j < LADO; j++)
    for (let i = 0; i < LADO; i++)
      px(x, i, j, colores[Math.floor(azarFijo() * colores.length)]);
  return c.toDataURL();
}

/** Tronco: vetas verticales con corteza a los lados. */
function tronco(){
  const { c, x } = lienzoSprite();
  let s = 7;
  const az = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  for (let j = 0; j < LADO; j++)
    for (let i = 0; i < LADO; i++){
      const corteza = ['#6b4f2a', '#5a4122', '#7a5c33'];
      px(x, i, j, corteza[Math.floor(az() * 3)]);
      if (az() > 0.82) px(x, i, j, '#4a3419');
    }
  return c.toDataURL();
}

/** Espada en diagonal, como las de Minecraft. */
function espada(hoja, brillo, sombra, guarda){
  const { c, x } = lienzoSprite();
  for (let k = 0; k < 9; k++){
    const i = 13 - k, j = 2 + k;
    px(x, i, j, brillo);
    px(x, i - 1, j, hoja);
    px(x, i - 1, j + 1, sombra);
  }
  px(x, 14, 1, brillo); px(x, 13, 1, hoja);
  // guarda
  for (let k = 0; k < 3; k++){ px(x, 3 + k, 11 - k, guarda); px(x, 5 + k, 13 - k, guarda); }
  px(x, 4, 12, guarda); px(x, 5, 11, guarda); px(x, 6, 12, guarda);
  // mango
  px(x, 1, 14, '#4a3419'); px(x, 2, 13, '#6b4f2a'); px(x, 3, 13, '#5a4122'); px(x, 2, 14, '#5a4122');
  return c.toDataURL();
}

/** Pico: cabeza curva arriba y mango en diagonal. */
function pico(cabeza, brillo){
  const { c, x } = lienzoSprite();
  const puntos = [[3,4],[4,3],[5,2],[6,2],[7,2],[8,2],[9,2],[10,3],[11,4],[12,5]];
  puntos.forEach(([i, j]) => { px(x, i, j, cabeza); px(x, i, j + 1, brillo); });
  px(x, 2, 5, cabeza); px(x, 13, 6, cabeza);
  for (let k = 0; k < 8; k++) px(x, 8 - k, 5 + k, k % 2 ? '#6b4f2a' : '#5a4122');
  return c.toDataURL();
}

/** Arco tensado. */
function arco(){
  const { c, x } = lienzoSprite();
  for (let j = 2; j < 14; j++){
    const i = 11 - Math.round(Math.sin((j - 2) / 11 * Math.PI) * 4);
    px(x, i, j, '#6b4f2a'); px(x, i + 1, j, '#8a6a3a');
  }
  for (let j = 3; j < 13; j++) px(x, 11, j, '#dcdcdc');
  for (let i = 2; i < 11; i++) px(x, i, 8, '#c8c8c8');
  px(x, 1, 8, '#dcdcdc'); px(x, 2, 7, '#a8a8a8'); px(x, 2, 9, '#a8a8a8');
  return c.toDataURL();
}

/** Lingote. */
function lingote(cara, alto, bajo){
  const { c, x } = lienzoSprite();
  px(x, 4, 6, alto, 8, 1);
  px(x, 3, 7, cara, 10, 3);
  px(x, 2, 10, bajo, 12, 1);
  px(x, 4, 7, alto, 3, 1);
  px(x, 3, 9, bajo, 10, 1);
  return c.toDataURL();
}

/** Gema tallada (diamante, esmeralda, perla). */
function gema(cara, brillo, borde){
  const { c, x } = lienzoSprite();
  const filas = [[6,4,4],[5,5,6],[4,6,8],[4,7,8],[4,8,8],[5,9,6],[6,10,4],[7,11,2]];
  filas.forEach(([i, j, an]) => px(x, i, j, cara, an, 1));
  px(x, 6, 3, borde, 4, 1);
  px(x, 6, 5, brillo, 2, 1);
  px(x, 5, 6, brillo, 1, 2);
  px(x, 9, 8, borde, 2, 2);
  return c.toDataURL();
}

/** Manzana (normal o dorada). */
function manzana(piel, brillo, hoja){
  const { c, x } = lienzoSprite();
  const cuerpo = [[5,5,6],[4,6,8],[3,7,10],[3,8,10],[3,9,10],[4,10,8],[5,11,6],[6,12,4]];
  cuerpo.forEach(([i, j, an]) => px(x, i, j, piel, an, 1));
  px(x, 5, 6, brillo, 2, 1); px(x, 4, 7, brillo, 1, 2);
  px(x, 8, 3, '#5a4122'); px(x, 8, 4, '#5a4122');
  px(x, 9, 3, hoja, 3, 1); px(x, 10, 2, hoja, 2, 1);
  return c.toDataURL();
}

/** Trozo de carbón. */
function carbon(){
  const { c, x } = lienzoSprite();
  const cuerpo = [[6,4,4],[5,5,6],[4,6,8],[4,7,8],[4,8,8],[5,9,6],[6,10,4]];
  cuerpo.forEach(([i, j, an]) => px(x, i, j, '#191919', an, 1));
  px(x, 6, 5, '#333'); px(x, 7, 6, '#3d3d3d'); px(x, 5, 8, '#0d0d0d'); px(x, 9, 8, '#0d0d0d');
  return c.toDataURL();
}

/** Pechera. */
function pechera(cara, alto, bajo){
  const { c, x } = lienzoSprite();
  px(x, 2, 3, cara, 4, 2); px(x, 10, 3, cara, 4, 2);
  px(x, 2, 5, cara, 12, 2);
  px(x, 3, 7, cara, 10, 5);
  px(x, 4, 12, cara, 3, 1); px(x, 9, 12, cara, 3, 1);
  px(x, 3, 5, alto, 10, 1);
  px(x, 3, 11, bajo, 10, 1);
  px(x, 7, 7, bajo, 2, 4);
  return c.toDataURL();
}

/** Élitros: dos alas grises. */
function elitros(){
  const { c, x } = lienzoSprite();
  for (let j = 2; j < 13; j++){
    const an = Math.max(1, 6 - Math.floor((j - 2) / 2));
    px(x, 7 - an, j, '#c8c2d2', an, 1);
    px(x, 9, j, '#c8c2d2', an, 1);
  }
  px(x, 7, 2, '#8a8496', 2, 11);
  for (let j = 3; j < 12; j += 3){ px(x, 3, j, '#9a94a8', 3, 1); px(x, 10, j, '#9a94a8', 3, 1); }
  return c.toDataURL();
}

/** Tótem de la inmortalidad. */
function totem(){
  const { c, x } = lienzoSprite();
  px(x, 5, 2, '#d9a441', 6, 3);
  px(x, 4, 5, '#e8c46a', 8, 5);
  px(x, 6, 6, '#2b6b3f', 1, 2); px(x, 9, 6, '#2b6b3f', 1, 2);
  px(x, 7, 9, '#8a5a1f', 2, 1);
  px(x, 5, 10, '#d9a441', 6, 2);
  px(x, 3, 11, '#c08a2a', 2, 3); px(x, 11, 11, '#c08a2a', 2, 3);
  px(x, 6, 12, '#e8c46a', 4, 3);
  return c.toDataURL();
}

/** Estrella del Nether. */
function estrella(){
  const { c, x } = lienzoSprite();
  px(x, 7, 1, '#e8e8f0', 2, 14);
  px(x, 1, 7, '#e8e8f0', 14, 2);
  for (let k = 0; k < 6; k++){
    px(x, 3 + k, 3 + k, '#dcdce8'); px(x, 12 - k, 3 + k, '#dcdce8');
  }
  px(x, 6, 6, '#ffffff', 4, 4);
  px(x, 7, 7, '#bcbcd8', 2, 2);
  return c.toDataURL();
}

/** Faro. */
function faro(){
  const { c, x } = lienzoSprite();
  px(x, 2, 3, '#3a3f4a', 12, 11);
  px(x, 3, 4, '#5aa9c4', 10, 9);

/** Cofre visto de frente. */
function cofre(madera, oscuro, herraje){

// ---------- Estado ----------
const S = { esmeraldas:1000, xp:0, nivel:1, inventario:[], girando:false, elegidos:[] };

function guardarCofres(){
  Arcade.escribir('cofres', JSON.stringify({
    esmeraldas:S.esmeraldas, xp:S.xp, nivel:S.nivel,
    inventario: S.inventario.slice(0, 240).map(o => ({ id:o.id, ficha:o.ficha, precio:o.precio, encanto:o.encanto }))
  }));
}
Guardado.registrar(guardarCofres);   // al cerrar, al ocultar la pestaña y al cambiar de pantalla
addEventListener('beforeunload', guardarCofres);

function cargarCofres(){
  const crudo = Arcade.leerTexto('cofres', null);
  if (!crudo) return;
  try {
    const g = JSON.parse(crudo);
    S.esmeraldas = typeof g.esmeraldas === 'number' ? g.esmeraldas : 1000;
    S.xp = g.xp || 0; S.nivel = g.nivel || 1;
    // El inventario se guarda por id y se rehidrata con el catálogo actual
    S.inventario = (g.inventario || []).map(o => {
      const base = OBJETOS.find(b => b.id === o.id);
      if (!base) return null;
      return { ...base, ficha:o.ficha, precio:o.precio ?? base.precio, encanto:o.encanto,
               encantado: base.encantado || !!o.encanto };
    }).filter(Boolean);
  } catch(e){}
}

// ---------- Generación ----------
function sortearRareza(tabla){
  let r = Math.random() * Object.values(tabla).reduce((s, v) => s + v, 0);
  for (const rareza of ORDEN){
    if (!tabla[rareza]) continue;
    r -= tabla[rareza];
    if (r <= 0) return rareza;
  }
  return Object.keys(tabla)[0];
}
function generarObjeto(tabla){
  const rareza = sortearRareza(tabla);
  const posibles = OBJETOS.filter(o => o.rareza === rareza);
  const base = elegir(posibles);
  const obj = { ...base, ficha: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) };
  if (base.encantable && Math.random() < 0.45){
    obj.encanto = elegir(ENCANTOS);
    obj.encantado = true;
    obj.precio = Math.floor(obj.precio * 1.5);
  }
  return obj;
}

// ---------- Piezas de interfaz ----------
function htmlIcono(obj, clase){

}

function casilla(obj){
  const d = document.createElement('div');
  d.className = 'casilla';
  d.style.borderColor = RAREZAS[obj.rareza].color;
  d.innerHTML = htmlIcono(obj) +
    '<div class="nom" style="color:' + RAREZAS[obj.rareza].color + '">' + obj.nombre + '</div>';
  return d;
}

// ---------- Partículas de experiencia ----------
const lienzoP = $('particulas');
const ctxP = lienzoP.getContext('2d');
let motas = [];
function ajustarLienzo(){
  const r = lienzoP.parentElement.getBoundingClientRect();
  lienzoP.width = Math.max(1, Math.floor(r.width));
  lienzoP.height = Math.max(1, Math.floor(r.height));
}
addEventListener('resize', ajustarLienzo);

function estallido(x, y, color, n){
  for (let i = 0; i < n; i++){
    motas.push({
      x, y, vx: azar(-260, 260), vy: azar(-320, 60),
      lado: azarEntero(3, 7), color, vida: azar(0.5, 1.1), inicial: 1
    });
    motas[motas.length - 1].inicial = motas[motas.length - 1].vida;
  }
}
function pintarMotas(dt){
  ctxP.clearRect(0, 0, lienzoP.width, lienzoP.height);
  for (let i = motas.length - 1; i >= 0; i--){
    const m = motas[i];
    m.vida -= dt;
    if (m.vida <= 0){ motas.splice(i, 1); continue; }
    m.x += m.vx * dt; m.y += m.vy * dt; m.vy += 620 * dt;
    ctxP.globalAlpha = limitar(m.vida / m.inicial, 0, 1);
    ctxP.fillStyle = m.color;
    ctxP.fillRect(Math.round(m.x), Math.round(m.y), m.lado, m.lado);   // píxeles cuadrados
  }
  ctxP.globalAlpha = 1;
}

// ---------- Ruleta ----------
const ANCHO_CASILLA = 128;      // 120 de ancho + 4 de margen a cada lado
const GANADORA = 36, TOTAL = 45;

function abrirCofre(id){
  if (S.girando) return;
  const c = COFRES.find(x => x.id === id);
  if (S.esmeraldas < c.precio){ Sonido.fx('error'); return; }

  S.esmeraldas -= c.precio;
  S.girando = true;
  refrescar();

  const cinta = $('cinta');
  cinta.style.transition = 'none';
  cinta.style.transform = 'translateX(0px)';
  cinta.innerHTML = '';
  const seq = [];
  for (let i = 0; i < TOTAL; i++){
    const o = generarObjeto(c.tabla);
    seq.push(o);
    cinta.appendChild(casilla(o));
  }
  const ganado = seq[GANADORA];

  const ancho = $('ruleta').offsetWidth || 900;
  const desvio = Math.floor(Math.random() * 60) - 30;
  const destino = GANADORA * ANCHO_CASILLA - ancho / 2 + ANCHO_CASILLA / 2 + desvio;

  requestAnimationFrame(() => {
    cinta.style.transition = 'transform 4.8s cubic-bezier(.08,.9,.1,1)';
    cinta.style.transform = 'translateX(-' + destino + 'px)';
  });

  // el chasquido se va espaciando conforme frena
  let t = 0;
  const tic = () => {
    if (!S.girando) return;
    Sonido.fx('giro');
    t += 0.06;
    if (t < 4.6) setTimeout(tic, 70 + t * t * 26);
  };
  setTimeout(tic, 120);

  setTimeout(() => {
    S.girando = false;
    S.inventario.unshift(ganado);
    if (S.inventario.length > 240) S.inventario.pop();
    sumarXP(25);
    sonarPremio(ganado.rareza);
    if (['epico', 'legendario', 'mitico'].includes(ganado.rareza)){
      ajustarLienzo();
      estallido(lienzoP.width / 2, 150, RAREZAS[ganado.rareza].color, 46);
    }
    refrescar();
    guardarCofres();
    mostrarPremio(ganado);
  }, 5000);
}

function sonarPremio(rareza){
  Sonido.melodia({
    comun:[440, 554], raro:[523, 659, 784],
    epico:[587, 740, 880, 1047], legendario:[659, 880, 1047, 1319, 1568],
    mitico:[784, 1047, 1319, 1568, 2093, 2637]
  }[rareza], 0.09, 'square', 0.06);
}

function sumarXP(n){
  S.xp += n;
  let subio = false;
  while (S.xp >= S.nivel * 100){
    S.xp -= S.nivel * 100;
    S.nivel++;
    subio = true;
  }
  if (subio){
    Sonido.melodia([440, 880], 0.16, 'triangle', 0.08);
    ajustarLienzo();
    estallido(lienzoP.width / 2, 60, '#55ff55', 34);
  }
}

// ---------- Premio ----------
let premioActual = null;
function mostrarPremio(obj){
  premioActual = obj;
  $('pIcono').className = 'icono' + (obj.encantado ? ' encantado' : '');
  $('pIcono').innerHTML = '<img src="' + obj.img + '" alt="">';
  $('pNombre').textContent = obj.nombre;
  $('pNombre').style.color = RAREZAS[obj.rareza].color === '#ffffff' ? '#333' : RAREZAS[obj.rareza].color;

  $('pEncanto').textContent = obj.encanto ? '✨ ' + obj.encanto : '';
  $('pValor').textContent = 'Vale ' + obj.precio.toLocaleString('es-ES') + ' esmeraldas';
  $('premio').classList.add('visible');
}
function cerrarPremio(){ $('premio').classList.remove('visible'); premioActual = null; }

// ---------- Inventario ----------
function vender(ficha){
  const i = S.inventario.findIndex(o => o.ficha === ficha);
  if (i === -1) return;
  S.esmeraldas += S.inventario[i].precio;
  S.inventario.splice(i, 1);
  S.elegidos = S.elegidos.filter(f => f !== ficha);
  ocultarTooltip();
  Sonido.fx('moneda');
  refrescar();
  guardarCofres();
}
function venderComunes(){
  const comunes = S.inventario.filter(o => o.rareza === 'comun');
  if (!comunes.length) return;
  S.esmeraldas += comunes.reduce((s, o) => s + o.precio, 0);
  S.inventario = S.inventario.filter(o => o.rareza !== 'comun');
  S.elegidos = S.elegidos.filter(f => S.inventario.some(o => o.ficha === f));
  Sonido.fx('ficha');
  refrescar();
  guardarCofres();
}
function alternarElegido(ficha){
  const obj = S.inventario.find(o => o.ficha === ficha);
  if (!obj) return;
  const i = S.elegidos.indexOf(ficha);
  if (i > -1){ S.elegidos.splice(i, 1); }
  else {
    if (S.elegidos.length >= 5 || obj.rareza === 'mitico'){ Sonido.fx('error'); return; }
    if (S.elegidos.length){
      const primero = S.inventario.find(o => o.ficha === S.elegidos[0]);
      if (primero.rareza !== obj.rareza){ Sonido.fx('error'); return; }
    }
    S.elegidos.push(ficha);
  }
  Sonido.fx('colocar');
  refrescar();
}
function forjar(){
  if (S.elegidos.length !== 5) return;
  const primero = S.inventario.find(o => o.ficha === S.elegidos[0]);
  const siguiente = ORDEN[ORDEN.indexOf(primero.rareza) + 1];
  if (!siguiente) return;
  S.inventario = S.inventario.filter(o => !S.elegidos.includes(o.ficha));
  S.elegidos = [];
  const nuevo = generarObjeto({ [siguiente]: 100 });
  S.inventario.unshift(nuevo);
  sumarXP(40);
  sonarPremio(nuevo.rareza);
  ajustarLienzo();
  estallido(lienzoP.width / 2, lienzoP.height - 200, RAREZAS[siguiente].color, 40);
  refrescar();
  guardarCofres();
  mostrarPremio(nuevo);
}

// ---------- Tooltip ----------
function mostrarTooltip(obj, ev){
  $('ttNombre').textContent = obj.nombre;
  $('ttNombre').style.color = RAREZAS[obj.rareza].color;
  $('ttRareza').textContent = RAREZAS[obj.rareza].nombre;
  $('ttRareza').style.color = RAREZAS[obj.rareza].color;
  $('ttEncanto').textContent = obj.encanto ? obj.encanto : '';
  $('ttValor').textContent = 'Valor: ' + obj.precio.toLocaleString('es-ES') + ' esmeraldas';
  $('tooltip').style.display = 'block';
  moverTooltip(ev);
}
function moverTooltip(ev){
  const t = $('tooltip');
  const x = Math.min(ev.clientX + 15, innerWidth - t.offsetWidth - 8);
  const y = Math.min(ev.clientY + 15, innerHeight - t.offsetHeight - 8);
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}
function ocultarTooltip(){ $('tooltip').style.display = 'none'; }

function pintarInventario(){
  const cont = $('rejillaInv');
  if (!S.inventario.length){
    cont.innerHTML = '<div id="vacio">Inventario vacío. Abre un cofre.</div>';
    return;
  }
  cont.innerHTML = S.inventario.map(o =>
    '<div class="ranuraInv' + (S.elegidos.includes(o.ficha) ? ' elegida' : '') + '" data-ficha="' + o.ficha + '">' +
      htmlIcono(o) +
      '<div class="marcaRareza" style="background:' + RAREZAS[o.rareza].color + '"></div>' +

function pintarContrato(){
  $('ranuras').innerHTML = Array.from({length:5}, (_, i) => {
    const o = S.elegidos[i] && S.inventario.find(x => x.ficha === S.elegidos[i]);
    return '<div class="ranuraC">' + (o ? htmlIcono(o) : '') + '</div>';
  }).join('');
  $('cuentaSel').textContent = S.elegidos.length;
  $('btnForjar').disabled = S.elegidos.length !== 5;
}

function refrescar(){
  const esme = Math.floor(S.esmeraldas);
  $('esmeTxt').textContent = esme.toLocaleString('es-ES');
  $('esme2').textContent = esme.toLocaleString('es-ES');
  const coins = Arcade.fichas.saldo();
  $('coinsTxt').textContent = coins.toLocaleString('es-ES');
  $('coins2').textContent = coins.toLocaleString('es-ES');
  $('numInv').textContent = S.inventario.length;
  $('nivelTxt').textContent = S.nivel;
  $('xpRelleno').style.width = limitar(100 * S.xp / (S.nivel * 100), 0, 100) + '%';

  document.querySelectorAll('[data-cofre]').forEach(b => {
    const c = COFRES.find(x => x.id === b.dataset.cofre);
    b.disabled = S.girando || S.esmeraldas < c.precio;
  });
  $('btnCambiar').disabled = coins < 100;
  $('btnRegalo').style.display = (esme < 50 && !S.inventario.length) ? 'inline-block' : 'none';
  pintarInventario();
  pintarContrato();
}

refrescar();
$('icoEsme').innerHTML = '<img src="' + ICONO_ESME + '" style="width:22px;height:22px" alt="">';
ajustarLienzo();
Arcade.bucle(dt => pintarMotas(dt));

// ---------- Trucos de administración ----------
// Solo hacen algo con el modo creador encendido (código 2808, tecla F9).
if (typeof Arcade !== "undefined" && Arcade.admin) Arcade.admin.registrar('cofres', 'Cofres Minecraft', {
  esmeraldas: { que:'esmeraldas <n> — fija las esmeraldas', fn(n){
    S.esmeraldas = Math.max(0, Math.floor(+n) || 0);
    refrescar(); guardarCofres();
    return 'Tienes ' + S.esmeraldas.toLocaleString('es-ES') + ' esmeraldas.';
  }},
  nivel: { que:'nivel <n> — fija el nivel de experiencia', fn(n){
    S.nivel = Math.max(1, Math.floor(+n) || 1); S.xp = 0;
    refrescar(); guardarCofres();
    return 'Nivel ' + S.nivel + '.';
  }},
  vaciar: { que:'vaciar — tira el inventario entero', fn(){
    const n = S.inventario.length; S.inventario = [];
    refrescar(); guardarCofres();
    return n ? 'Fuera ' + n + ' objetos.' : 'El inventario ya estaba vacío.';
  }}
});

</script>
</body>
</html>
