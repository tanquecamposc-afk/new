<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXO IA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --fondo:#F0F2F6; --panel:#FFFFFF; --panel-2:#E7EAF1; --hueco:#F7F8FB;
  --linea:#D3D9E4; --linea-suave:#E4E8EF;
  --texto:#141B28; --tenue:#5E6A80; --apagado:#8A94A6;
  --senal:#B4761C; --senal-fondo:rgba(224,160,64,.14);
  --onda:#1C7FA3; --brasa:#B8483A; --brote:#2E7D5B;
  --sombra:0 1px 2px rgba(14,20,32,.06), 0 8px 24px -12px rgba(14,20,32,.18);
  --radio:10px;
  --fuerte-fondo:#0E1420; --fuerte-texto:#F4F6FA; --glifo-fondo:#0E1420;
  --lienzo:#FBFBF9;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --cuerpo:"Public Sans",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fondo:#0E1420; --panel:#161E2C; --panel-2:#1E2837; --hueco:#121A27;
    --linea:#2A3648; --linea-suave:#212B3B;
    --texto:#E4E9F2; --tenue:#94A1B8; --apagado:#6B7789;
    --senal:#E0A040; --senal-fondo:rgba(224,160,64,.13);
    --onda:#4FB0D4; --brasa:#E08276; --brote:#6BC79A;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    --fuerte-fondo:#E0A040; --fuerte-texto:#1A1206; --glifo-fondo:#1E2837;
    --lienzo:#F4F4F1;
  }
}
:root[data-theme="dark"]{
  --fondo:#0E1420; --panel:#161E2C; --panel-2:#1E2837; --hueco:#121A27;
  --linea:#2A3648; --linea-suave:#212B3B;
  --texto:#E4E9F2; --tenue:#94A1B8; --apagado:#6B7789;
  --senal:#E0A040; --senal-fondo:rgba(224,160,64,.13);
  --onda:#4FB0D4; --brasa:#E08276; --brote:#6BC79A;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  --fuerte-fondo:#E0A040; --fuerte-texto:#1A1206; --glifo-fondo:#1E2837;
  --lienzo:#F4F4F1;
}

*{box-sizing:border-box;}
body{margin:0; background:var(--fondo); color:var(--texto); font-family:var(--cuerpo);
  font-size:15px; line-height:1.6; height:100dvh; overflow:hidden;}
button,input,select,textarea{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--senal); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--linea);border-radius:8px}

.app{display:flex; height:100dvh;}

/* riel */
.riel{width:250px; flex:0 0 250px; display:flex; flex-direction:column; gap:9px;
  background:var(--hueco); border-right:1px solid var(--linea); padding:13px 11px;}
.riel.plegado{display:none;}
.marca{display:flex; align-items:center; gap:9px; padding:0 4px 2px;}
.marca .glifo{width:26px; height:26px; flex:none; border-radius:7px; display:grid; place-items:center;
  background:var(--glifo-fondo); color:var(--senal); font-family:var(--mono); font-size:14px;}
.marca .nombre{font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:-.01em;}
.marca .pulso{width:7px;height:7px;border-radius:50%;background:var(--apagado);margin-left:auto;flex:none;}
.marca .pulso.viva{background:var(--brote); box-shadow:0 0 0 3px color-mix(in srgb,var(--brote) 22%,transparent);}
.marca .pulso.muerta{background:var(--brasa);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; background:var(--panel);
  border:1px solid var(--linea); border-radius:var(--radio); padding:8px 13px; font-size:13.5px;
  font-weight:600; cursor:pointer; transition:background .13s,border-color .13s;}
.btn:hover:not(:disabled){background:var(--panel-2);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn.fuerte{background:var(--fuerte-fondo); color:var(--fuerte-texto); border-color:var(--fuerte-fondo);}
.btn.fuerte:hover:not(:disabled){filter:brightness(1.12);}
.btn.desnudo{background:none; border-color:transparent; padding:6px 9px;}
.btn.desnudo:hover:not(:disabled){background:var(--panel-2); border-color:var(--linea-suave);}
.btn.chico{padding:4px 9px; font-size:12px; font-weight:500; color:var(--tenue);}
.btn.chico:hover:not(:disabled){color:var(--texto);}

.pestanas{display:flex; gap:3px; background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--radio); padding:3px;}
.pestanas button{flex:1; background:none; border:none; border-radius:7px; padding:6px 8px; cursor:pointer;
  font-family:var(--display); font-size:12.5px; font-weight:600; color:var(--tenue);}
.pestanas button[aria-selected="true"]{background:var(--fuerte-fondo); color:var(--fuerte-texto);}

.campo-busca{background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
  padding:7px 11px; font-size:13px; width:100%;}
.lista{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin:0 -4px; padding:0 4px;}
.hebra{display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:8px; cursor:pointer;
  font-size:13.5px; border:1px solid transparent; text-align:left; background:none; width:100%;}
.hebra:hover{background:var(--panel);}
.hebra[aria-current="true"]{background:var(--panel); border-color:var(--linea); font-weight:600;}
.hebra .rotulo{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hebra .cerrar{opacity:0; background:none; border:none; cursor:pointer; padding:1px 4px;
  color:var(--tenue); font-size:14px; line-height:1; border-radius:4px;}
.hebra:hover .cerrar{opacity:.65;}
.hebra .cerrar:hover{opacity:1; color:var(--brasa);}
.vacio{color:var(--apagado); font-size:12.5px; padding:10px 6px; line-height:1.5;}
.zocalo{border-top:1px solid var(--linea); padding-top:9px; display:flex; flex-direction:column; gap:2px;}
.zocalo .btn{justify-content:flex-start; font-weight:500; font-size:13px; color:var(--tenue);}
.zocalo .btn:hover{color:var(--texto);}

/* franja */
.tablero{flex:1; display:flex; flex-direction:column; min-width:0;}
.franja{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:9px 15px;
  border-bottom:1px solid var(--linea); background:var(--panel);}
.franja .separa{flex:1;}
.selector{background:var(--hueco); border:1px solid var(--linea); border-radius:var(--radio);
  padding:6px 10px; font-size:13px; font-weight:500; cursor:pointer; max-width:210px;}
.aguja{font-family:var(--mono); font-size:11.5px; color:var(--apagado);
  font-variant-numeric:tabular-nums; white-space:nowrap;}

.vista{flex:1; display:flex; flex-direction:column; min-height:0;}
.vista[hidden]{display:none;}

/* hilo */
.hilo{flex:1; overflow-y:auto; padding:24px 15px 10px;}
.columna{max-width:68ch; margin:0 auto; display:flex; flex-direction:column; gap:24px;}
.turno{display:flex; flex-direction:column; gap:8px;}
.firma{display:flex; align-items:center; gap:8px; font-family:var(--display); font-size:11px;
  font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--apagado);}
.turno.mio .firma{color:var(--tenue);}
.turno.suyo .firma{color:var(--senal);}
.insignia{font-family:var(--cuerpo); font-size:10.5px; font-weight:600; letter-spacing:.02em;
  text-transform:none; color:var(--senal); border:1px solid var(--senal); border-radius:20px; padding:0 7px;}
.dicho{line-height:1.68;}
.turno.mio .dicho{background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
  padding:11px 15px; box-shadow:var(--sombra);}
.dicho>*{margin:0;}
.dicho>*+*{margin-top:.75em;}
.dicho h1,.dicho h2,.dicho h3{font-family:var(--display); line-height:1.28; letter-spacing:-.012em; text-wrap:balance;}
.dicho h1{font-size:1.3em;margin-top:1.1em}.dicho h2{font-size:1.15em;margin-top:1.1em}.dicho h3{font-size:1.02em;margin-top:1em}
.dicho ul,.dicho ol{padding-left:1.35em;}
.dicho li+li{margin-top:.3em;}
.dicho a{color:var(--onda); text-underline-offset:2px;}
.dicho strong{font-weight:600;}
.dicho blockquote{border-left:2px solid var(--senal); padding:2px 0 2px 13px; color:var(--tenue); font-style:italic;}
.dicho hr{border:none; border-top:1px solid var(--linea-suave);}
.dicho code.suelto{font-family:var(--mono); font-size:.86em; background:var(--panel-2); padding:1px 5px; border-radius:4px;}
.tabla-marco{overflow-x:auto; border:1px solid var(--linea); border-radius:var(--radio);}
.dicho table{border-collapse:collapse; width:100%; font-size:.93em;}
.dicho th,.dicho td{padding:7px 11px; text-align:left; border-bottom:1px solid var(--linea-suave);}
.dicho th{background:var(--hueco); font-family:var(--display); font-size:11px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; color:var(--tenue);}
.dicho tr:last-child td{border-bottom:none;}
.dicho td{font-variant-numeric:tabular-nums;}
.bloque-codigo{border:1px solid var(--linea); border-radius:var(--radio); overflow:hidden; background:var(--hueco);}
.bloque-codigo .cinta{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:5px 8px 5px 12px; border-bottom:1px solid var(--linea-suave); background:var(--panel-2);
  font-family:var(--mono); font-size:11px; color:var(--tenue);}
.bloque-codigo pre{margin:0; overflow-x:auto; padding:12px 14px;}
.bloque-codigo code{font-family:var(--mono); font-size:12.8px; line-height:1.62; white-space:pre;}

.razonando{border:1px dashed var(--linea); border-radius:var(--radio); background:var(--hueco);}
.razonando summary{cursor:pointer; padding:7px 12px; font-family:var(--display); font-size:11.5px;
  font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--tenue);}
.razonando .txt{padding:0 13px 11px; color:var(--tenue); font-size:13.5px; line-height:1.6; white-space:pre-wrap;}
.fuentes{border:1px solid var(--linea); border-radius:var(--radio); background:var(--hueco); padding:9px 12px;
  display:flex; flex-direction:column; gap:4px; font-size:13px;}
.fuentes .cab{font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--onda);}
.fuentes a{color:var(--texto); text-decoration:none; opacity:.85;}
.fuentes a:hover{opacity:1; text-decoration:underline;}

.pensando{display:inline-flex; align-items:center; gap:9px; color:var(--tenue); font-size:13.5px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;}
.barrido{width:34px; height:2px; border-radius:2px; overflow:hidden; background:var(--linea); position:relative;}
.barrido::after{content:""; position:absolute; inset:0; width:40%; border-radius:2px;
  background:var(--senal); animation:barrer 1.15s ease-in-out infinite;}
@keyframes barrer{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.nota{font-family:var(--mono); font-size:11.5px; color:var(--apagado); display:flex; gap:13px;
  flex-wrap:wrap; font-variant-numeric:tabular-nums;}
.alerta{border:1px solid var(--brasa); border-left-width:3px; border-radius:var(--radio);
  background:color-mix(in srgb,var(--brasa) 8%,transparent); padding:11px 14px; font-size:13.5px; line-height:1.55;}
.alerta b{display:block; font-family:var(--display); font-size:11.5px; letter-spacing:.03em;
  text-transform:uppercase; color:var(--brasa); margin-bottom:3px;}
.mandos{display:flex; gap:2px; flex-wrap:wrap; opacity:0; transition:opacity .13s;}
.turno:hover .mandos,.mandos:focus-within{opacity:1;}
.adjuntos{display:flex; gap:8px; flex-wrap:wrap;}
.adjuntos img{height:74px; border-radius:8px; border:1px solid var(--linea); display:block;}
.doc{display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:9px; background:var(--panel-2);
  border:1px solid var(--linea); font-size:13px; font-weight:600; max-width:250px;}
.doc span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* portada */
.portada{max-width:62ch; margin:1.5vh auto 0; display:flex; flex-direction:column; gap:13px;}
.portada .titular{font-family:var(--display); font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.2;}
.portada p{margin:0; color:var(--tenue);}
.rejilla{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px;}
.tarjeta{text-align:left; background:var(--panel); border:1px solid var(--linea); border-radius:var(--radio);
  padding:10px 12px; cursor:pointer; font-size:13.3px; line-height:1.45; display:flex; flex-direction:column; gap:3px;}
.tarjeta:hover{border-color:var(--senal); background:var(--senal-fondo);}
.tarjeta .clase{font-family:var(--display); font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--apagado);}

/* consola */
.consola{padding:8px 15px 15px;}
.caja{max-width:68ch; margin:0 auto; background:var(--panel); border:1px solid var(--linea);
  border-radius:14px; padding:9px 11px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--sombra);}
.caja:focus-within{border-color:var(--senal);}
.caja.soltar{border-color:var(--senal); background:var(--senal-fondo);}
.previos{display:flex; gap:7px; flex-wrap:wrap;}
.previo{position:relative;}
.previo img{height:52px; border-radius:7px; border:1px solid var(--linea); display:block;}
.previo .doc{max-width:170px; font-size:12px; padding:6px 10px;}
.previo button{position:absolute; top:-6px; right:-6px; width:19px; height:19px; border-radius:50%;
  border:1px solid var(--panel); background:var(--brasa); color:#fff; font-size:11px; line-height:1; cursor:pointer; padding:0;}
#texto,#prompt{border:none; background:none; resize:none; width:100%; padding:5px 4px; font-size:15px;
  line-height:1.55; max-height:190px; min-height:26px; outline:none;}
.mandos-caja{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.mandos-caja .separa{flex:1;}
.mandos-caja .btn.chico{border-color:var(--linea); background:var(--hueco); padding:5px 11px; font-weight:600;}
.mandos-caja .btn.chico:hover:not(:disabled){background:var(--panel-2);}
.pie{max-width:68ch; margin:8px auto 0; font-family:var(--mono); font-size:11px; color:var(--tenue);
  text-align:center; line-height:1.5;}

/* estudio */
.estudio{flex:1; overflow-y:auto; padding:20px 15px 10px;}
.estudio-cols{max-width:1080px; margin:0 auto; display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start;}
@media (max-width:900px){.estudio-cols{grid-template-columns:1fr;}}
.mesa{background:var(--panel); border:1px solid var(--linea); border-radius:14px; padding:15px;
  display:flex; flex-direction:column; gap:14px; box-shadow:var(--sombra); position:sticky; top:0;}
@media (max-width:900px){.mesa{position:static;}}
.grupo{display:flex; flex-direction:column; gap:6px;}
.grupo>label{font-family:var(--display); font-size:10.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--tenue);}
.grupo textarea{background:var(--hueco); border:1px solid var(--linea); border-radius:var(--radio);
  padding:9px 11px; font-size:14px; line-height:1.55; min-height:92px; resize:vertical; outline:none;}
.grupo textarea:focus{border-color:var(--senal);}
.fichas{display:flex; flex-wrap:wrap; gap:5px;}
.ficha{background:var(--hueco); border:1px solid var(--linea); border-radius:20px; padding:4px 11px;
  font-size:12.5px; cursor:pointer; font-weight:500;}
.ficha[aria-pressed="true"]{background:var(--senal-fondo); border-color:var(--senal); color:var(--senal); font-weight:600;}
.galeria{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px;}
.obra{background:var(--panel); border:1px solid var(--linea); border-radius:12px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:var(--sombra);}
.obra .lienzo{background:var(--lienzo); display:flex; align-items:center; justify-content:center; padding:9px;}
.obra .lienzo svg{width:100%; height:auto; display:block; max-height:270px;}
.obra .datos{padding:9px 11px; display:flex; flex-direction:column; gap:7px; border-top:1px solid var(--linea-suave);}
.obra .desc{font-size:12.5px; color:var(--tenue); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.obra .barra{display:flex; gap:3px; flex-wrap:wrap;}
.taller-vacio{border:1px dashed var(--linea); border-radius:12px; padding:34px 20px; text-align:center;
  color:var(--tenue); font-size:13.5px; line-height:1.6;}

/* ficha modal */
.velo{position:fixed; inset:0; background:rgba(10,14,22,.62); display:none; align-items:center;
  justify-content:center; padding:18px; z-index:30;}
.velo[data-abierto="1"]{display:flex;}
.panel{background:var(--panel); border:1px solid var(--linea); border-radius:14px; width:min(600px,100%);
  max-height:86dvh; overflow-y:auto; box-shadow:var(--sombra);}
.panel header{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--linea);
  font-family:var(--display); font-weight:700; font-size:16px;}
.panel header .separa{flex:1;}
.panel .cuerpo{padding:18px; display:flex; flex-direction:column; gap:16px;}
.panel footer{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--linea);}
.panel footer .separa{flex:1;}
.grupo input[type=password],.grupo input[type=text],.grupo input[type=number],.grupo select{
  background:var(--hueco); border:1px solid var(--linea); border-radius:var(--radio); padding:9px 11px;
  font-size:13.5px; width:100%; outline:none;}
.grupo input:focus,.grupo select:focus{border-color:var(--senal);}
.grupo .glosa{font-size:12.5px; color:var(--tenue); line-height:1.5;}
.par{display:flex; gap:12px;} .par>*{flex:1; min-width:0;}
.hilera{display:flex; align-items:center; gap:8px; font-size:13.5px;}
.hilera input{width:auto;}
.seccion{border-top:1px solid var(--linea); padding-top:15px; display:flex; flex-direction:column; gap:15px;}
.seccion>.rotulo{font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--senal);}

@media (max-width:840px){
  .riel{position:fixed; z-index:20; height:100dvh; box-shadow:var(--sombra);}
  .hilo,.estudio{padding:16px 10px 8px;}
  .consola{padding:6px 10px 12px;}
}
</style>

<div class="app">
  <aside class="riel" id="riel">
    <div class="marca"><span class="glifo">◈</span><span class="nombre">NEXO</span><span class="pulso" id="pulso"></span></div>
    <div class="pestanas" role="tablist">
      <button role="tab" id="tabChat" aria-selected="true">Conversar</button>
      <button role="tab" id="tabEstudio" aria-selected="false">Estudio</button>
    </div>
    <button class="btn" id="btNueva">Conversación nueva</button>
    <input type="search" class="campo-busca" id="busca" placeholder="Buscar…" autocomplete="off">
    <div class="lista" id="lista"></div>
    <div class="zocalo">
      <button class="btn desnudo" id="btAjustes">Ajustes</button>
      <button class="btn desnudo" id="btBajar">Descargar conversación</button>
    </div>
  </aside>

  <div class="tablero">
    <div class="franja">
      <button class="btn desnudo" id="btRiel" aria-label="Mostrar u ocultar el panel">☰</button>
      <select class="selector" id="selSkill" aria-label="Skill"></select>
      <select class="selector" id="selTier" aria-label="Profundidad">
        <option value="quick">Rápido</option>
        <option value="default" selected>Equilibrado</option>
        <option value="complex">Profundo</option>
      </select>
      <div class="separa"></div>
      <span class="aguja" id="aguja"></span>
    </div>

    <!-- ══════════ CONVERSAR ══════════ -->
    <div class="vista" id="vistaChat">
      <div class="hilo" id="hilo"><div class="columna" id="columna"></div></div>
      <div class="consola">
        <div class="caja" id="caja">
          <div class="previos" id="previos"></div>
          <textarea id="texto" rows="1" placeholder="Pregunta lo que quieras…"></textarea>

/* ═══════════════ Markdown ═══════════════ */

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function md(fuente){
  const guardados = [];
  let t = String(fuente).replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (m, leng, codigo) => {
    guardados.push('<div class="bloque-codigo"><div class="cinta"><span>' + esc(leng || "texto") +
      '</span><button type="button" class="btn chico copiar-codigo">copiar</button></div><pre><code>' +
      esc(codigo.replace(/\n$/, "")) + "</code></pre></div>");
    return "@@B" + (guardados.length - 1) + "@@";
  });
  t = esc(t);

  const lineas = t.split("\n"), fuera = [];
  let pila = [], citando = false;
  const cerrarL = () => { while(pila.length) fuera.push("</" + pila.pop() + ">"); };
  const cerrarC = () => { if(citando){ fuera.push("</blockquote>"); citando = false; } };

  for(let i = 0; i < lineas.length; i++){
    const l = lineas[i];
    const marca = l.match(/^@@B(\d+)@@$/);
    if(marca){ cerrarL(); cerrarC(); fuera.push(guardados[+marca[1]]); continue; }
    if(!l.trim()){ cerrarL(); cerrarC(); continue; }

    if(/^\s*\|.*\|\s*$/.test(l) && i + 1 < lineas.length && /^\s*\|[\s:|-]+\|\s*$/.test(lineas[i+1])){
      cerrarL(); cerrarC();
      const cel = f => f.trim().replace(/^\||\|$/g, "").split("|").map(c => corrido(c.trim()));
      let h = '<div class="tabla-marco"><table><thead><tr>' +
              cel(l).map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      i += 2;
      while(i < lineas.length && /^\s*\|.*\|\s*$/.test(lineas[i])){
        h += "<tr>" + cel(lineas[i]).map(c => "<td>" + c + "</td>").join("") + "</tr>"; i++;
      }
      i--;
      fuera.push(h + "</tbody></table></div>");
      continue;
    }

    const cita = l.match(/^&gt;\s?(.*)$/);
    if(cita){
      cerrarL();
      if(!citando){ fuera.push("<blockquote>"); citando = true; }
      fuera.push("<p>" + corrido(cita[1]) + "</p>");
      continue;
    }
    cerrarC();

    if(/^(---|\*\*\*|___)\s*$/.test(l)){ cerrarL(); fuera.push("<hr>"); continue; }
    const enc = l.match(/^(#{1,6})\s+(.*)$/);
    if(enc){
      cerrarL();
      const n = Math.min(enc[1].length, 3);
      fuera.push("<h" + n + ">" + corrido(enc[2]) + "</h" + n + ">");
      continue;
    }
    const vin = l.match(/^\s*[-*+]\s+(.*)$/), num = l.match(/^\s*\d+[.)]\s+(.*)$/);
    if(vin || num){
      const tipo = vin ? "ul" : "ol";
      if(pila[pila.length-1] !== tipo){ cerrarL(); pila.push(tipo); fuera.push("<" + tipo + ">"); }
      fuera.push("<li>" + corrido((vin || num)[1]) + "</li>");
      continue;
    }
    cerrarL();
    fuera.push("<p>" + corrido(l) + "</p>");
  }
  cerrarL(); cerrarC();
  return fuera.join("\n");
}

function corrido(s){
  return s.replace(/`([^`\n]+)`/g, '<code class="suelto">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

/* ═══════════════ SVG: se limpia antes de tocar el DOM ═══════════════ */

function sanearSVG(bruto){
  const hallado = String(bruto).match(/<svg[\s\S]*<\/svg>/i);
  if(!hallado) return null;
  const doc = new DOMParser().parseFromString(hallado[0], "image/svg+xml");
  const raiz = doc.documentElement;
  if(!raiz || raiz.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) return null;

  const fuera = new Set(["script","foreignobject","iframe","handler","image"]);
  const podar = nodo => {
    for(const h of Array.from(nodo.children)){
      if(fuera.has(h.nodeName.toLowerCase())){ h.remove(); continue; }
      for(const a of Array.from(h.attributes)){
        const n = a.name.toLowerCase(), v = (a.value || "").trim().toLowerCase();
        if(n.startsWith("on") || ((n === "href" || n === "xlink:href") && !v.startsWith("#"))) h.removeAttribute(a.name);
      }
      podar(h);
    }
  };
  for(const a of Array.from(raiz.attributes)) if(a.name.toLowerCase().startsWith("on")) raiz.removeAttribute(a.name);
  podar(raiz);

  if(!raiz.getAttribute("xmlns")) raiz.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  if(!raiz.getAttribute("viewBox")){
    const an = parseFloat(raiz.getAttribute("width")) || 1024, al = parseFloat(raiz.getAttribute("height")) || 1024;
    raiz.setAttribute("viewBox", "0 0 " + an + " " + al);
  }
  raiz.removeAttribute("width"); raiz.removeAttribute("height");
  return new XMLSerializer().serializeToString(raiz);
}

function nombreArchivo(s){
  return (s || "nexo").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 44) || "nexo";
}

  const url = URL.createObjectURL(new Blob([datos], {type:tipo}));
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function svgAPng(svg){
  const caja = (svg.match(/viewBox="0 0 (\d+) (\d+)"/) || [0, 1024, 1024]).slice(1).map(Number);
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([svg], {type:"image/svg+xml;charset=utf-8"}));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = caja[0]; c.height = caja[1];
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("no se pudo convertir")), "image/png");
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("no se pudo convertir")); };
    img.src = url;
  });
}

/* ═══════════════ MOTOR A · Messages API (archivo local) ═══════════════ */

function cuerpoAPI(turnos, sistema, nivel){
  const m = MODELOS[cfg.modelo] || MODELOS["claude-opus-5"];
  const c = {
    model: cfg.modelo,
    max_tokens: Math.max(1024, Math.min(cfg.maxTokens, m.max)),
    stream: true,
    system: [{type:"text", text:sistema, cache_control:{type:"ephemeral"}}],
    messages: turnos
  };
  if(m.pensar === "adaptativo") c.thinking = {type:"adaptive", display: cfg.razonar ? "summarized" : "omitted"};
  else if(cfg.razonar) c.thinking = {type:"enabled", budget_tokens: Math.min(8000, c.max_tokens - 1024)};
  if(m.esfuerzo) c.output_config = {effort: ESFUERZO[cfg.tier] || "high"};

  const betas = [];
  if(nivel >= 1 && cfg.buscar && m.busca) c.tools = [{type:m.busca, name:"web_search", max_uses:8}];
  if(nivel >= 2 && cfg.compactar){ c.context_management = {edits:[{type:"compact_20260112"}]}; betas.push("compact-2026-01-12"); }
  if(nivel >= 3){ c.fallbacks = "default"; betas.push("server-side-fallback-2026-07-01"); }
  return {c, betas};
}

async function streamAPI(cuerpo, betas, senal, aviso){
  const cab = {
    "content-type":"application/json",
    "x-api-key":cfg.clave,
    "anthropic-version":VERSION_API,
    "anthropic-dangerous-direct-browser-access":"true"
  };
  if(betas.length) cab["anthropic-beta"] = betas.join(",");

  const resp = await fetch(API, {method:"POST", headers:cab, body:JSON.stringify(cuerpo), signal:senal});
  if(!resp.ok){
    let det = "";
    try{ const j = await resp.json(); det = j.error?.message || j.error?.type || JSON.stringify(j); }
    catch(e){ det = await resp.text().catch(() => ""); }
    const err = new Error(det || ("HTTP " + resp.status));
    err.estado = resp.status;
    throw err;
  }

  const lec = resp.body.getReader(), dec = new TextDecoder();
  let buf = "", parada = null;
  const bloques = [], parcial = {};
  const res = {texto:"", razonamiento:"", fuentes:[], uso:{entrada:0, salida:0}};

  while(true){
    const {done, value} = await lec.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const trozos = buf.split("\n\n");
    buf = trozos.pop();

    for(const trozo of trozos){
      const linea = trozo.split("\n").find(l => l.startsWith("data:"));
      if(!linea) continue;
      let e;
      try{ e = JSON.parse(linea.slice(5).trim()); }catch(err){ continue; }

      if(e.type === "message_start" && e.message?.usage) res.uso.entrada = e.message.usage.input_tokens || 0;
      else if(e.type === "content_block_start"){
        bloques[e.index] = structuredClone(e.content_block);
        if(bloques[e.index].type === "server_tool_use") parcial[e.index] = "";
      }
      else if(e.type === "content_block_delta"){
        const b = bloques[e.index], d = e.delta || {};
        if(!b) continue;
        if(d.type === "text_delta"){ b.text = (b.text || "") + d.text; res.texto = bloques.filter(x => x?.type === "text").map(x => x.text).join(""); aviso(res); }
        else if(d.type === "thinking_delta"){ b.thinking = (b.thinking || "") + d.thinking; res.razonamiento += d.thinking; aviso(res); }
        else if(d.type === "signature_delta") b.signature = (b.signature || "") + d.signature;
        else if(d.type === "input_json_delta") parcial[e.index] = (parcial[e.index] || "") + d.partial_json;
      }
      else if(e.type === "content_block_stop"){
        const b = bloques[e.index];
        if(b && parcial[e.index]){ try{ b.input = JSON.parse(parcial[e.index]); }catch(err){} delete parcial[e.index]; }
        if(b?.type === "web_search_tool_result" && Array.isArray(b.content)){
          for(const r of b.content) if(r?.url) res.fuentes.push({url:r.url, titulo:r.title || r.url});
          aviso(res);
        }
      }
      else if(e.type === "message_delta"){
        if(e.delta?.stop_reason) parada = e.delta.stop_reason;
        if(e.usage?.output_tokens) res.uso.salida = e.usage.output_tokens;
      }
      else if(e.type === "error") throw new Error(e.error?.message || "error en la transmisión");
    }
  }
  res.bloques = bloques.filter(Boolean);
  res.parada = parada;
  return res;
}

async function responderAPI({turnos, sistema, senal, aviso}){
  let ultimo = null;
  for(let nivel = nivelMax; nivel >= 0; nivel--){
    const {c, betas} = cuerpoAPI(turnos, sistema, nivel);
    try{
      const r = await streamAPI(c, betas, senal, aviso);
      nivelMax = nivel;
      return r;
    }catch(e){
      if(e.name === "AbortError") throw e;
      if(e.estado !== 400 || nivel === 0) throw e;
      ultimo = e;
    }
  }
  throw ultimo;
}

/* ═══════════════ MOTOR B · capacidad sample (página publicada) ═══════════════ */

async function responderSample({turnos, sistema, imagenes, senal, aviso}){
  // No hay rol "system": las instrucciones van como primer turno de usuario.
  const entrada = [{role:"user", content:sistema}];
  for(const t of turnos){
    const txt = t.content.map(b => b.type === "text" ? b.text : "").join("").trim();
    if(txt) entrada.push({role:t.role, content:txt});
  }
  const res = {texto:"", razonamiento:"", fuentes:[], uso:{entrada:0, salida:0}};
  const op = {signal:senal, cache:false, modelTier:cfg.tier,
    onText: ({text}) => { res.texto = text; aviso(res); }};
  if(imagenes?.length && puedeImagenes) op.images = imagenes;

  const r = await sample(entrada, op);
  res.texto = r.text;
  res.truncado = r.truncated;
  res.tierAplicado = r.modelTierApplied;
  return res;
}

const responder = args => motor === "api" ? responderAPI(args) : responderSample(args);

function sistemaCompleto(){
  const s = skillDe(cfg.skill);
  return cfg.instrucciones + (s.sistema ? "\n\n---\n" + s.sistema : "");
}

function historial(chat, hasta){
  const msgs = [];
  const ultimaImg = chat.turnos.reduce((a, t, i) => (t.svg ? i : a), -1);
  const lista = chat.turnos.slice(0, hasta);

  if(chat.resumen) msgs.push({role:"user", content:[{type:"text", text:"Contexto de lo hablado antes:\n" + chat.resumen}]});

  for(const t of lista){
    if(t.rol === "user"){
      const c = [];
      for(const a of (t.adjuntos || [])){
        c.push(a.tipo === "application/pdf"
          ? {type:"document", source:{type:"base64", media_type:"application/pdf", data:a.datos}}
          : {type:"image", source:{type:"base64", media_type:a.tipo, data:a.datos}});
      }
      if(t.texto) c.push({type:"text", text:t.texto});
      if(c.length) msgs.push({role:"user", content:c});
      continue;
    }
    if(t.svg){
      const esUlt = chat.turnos.indexOf(t) === ultimaImg;
      msgs.push({role:"assistant", content:[{type:"text",
        text: esUlt ? "Dibujé esta imagen:\n\n```svg\n" + t.svg + "\n```"
                    : "[imagen generada: " + (t.prompt || "") + "]"}]});
      continue;
    }
    if(motor === "api" && t.bloques?.length){
      const b = t.bloques.filter(x =>
        x.type === "text"     ? x.text?.trim() :
        x.type === "thinking" ? x.thinking && x.signature : true);
      if(b.length) msgs.push({role:"assistant", content:b});
    }else if(t.texto?.trim()){
      msgs.push({role:"assistant", content:[{type:"text", text:t.texto}]});
    }
  }
  return msgs;
}

/* En modo sample el tope de entrada son 64 KiB: al acercarse se resume
   lo viejo y la conversación sigue en vez de cortarse. */
async function resumirSiHaceFalta(chat){
  if(motor !== "sample" || chat.turnos.length < 6) return;
  const peso = pesa(sistemaCompleto()) + historial(chat).reduce((n, m) =>
    n + m.content.reduce((k, b) => k + (b.text ? pesa(b.text) : 0), 0), 0);
  if(peso < LIMITE_ARTIFACT) return;

  const viejos = chat.turnos.slice(0, Math.max(2, chat.turnos.length - 4));
  const texto = viejos.map(t => (t.rol === "user" ? "Yo: " : "Nexo: ") + (t.texto || "[imagen]"))
    .join("\n\n").slice(0, 38000);
  try{
    const {text} = await sample(
      "Resume esta conversación para que otro asistente pueda retomarla sin haberla leído. " +
      "Conserva datos concretos, decisiones, nombres y lo que quedó pendiente. Solo el resumen, en viñetas.\n\n" +
      (chat.resumen ? "Resumen previo:\n" + chat.resumen + "\n\n" : "") + "Conversación:\n" + texto,
      {modelTier:"quick"});
    chat.resumen = text;
    chat.turnos = chat.turnos.slice(viejos.length);
  }catch(e){ chat.turnos = chat.turnos.slice(-6); }
}

  session_expired:"Tu sesión de Claude venció. Recarga la página.",

  refused:"Claude no quiso responder a esto.",
  empty_completion:"Volvió una respuesta vacía. Prueba a preguntarlo de otra forma.",
  upstream_error:"Falló del lado de Claude. Reintenta en un momento.",
  images_unavailable:"Tu cuenta no puede mandar imágenes desde aquí.",
  image_rejected:"Esa imagen no se pudo leer. Prueba con un PNG o JPEG de menos de 20 MB.",
  queue_overflow:"Hay demasiadas peticiones en cola.",

  capability_disabled:"Esta página no puede hablar con Claude ahora mismo.",

};

function copiaError(e){
  if(e?.code && COPIA[e.code]) return COPIA[e.code];
  if(e?.estado === 401) return "La clave de la API no es válida o fue revocada. Revísala en Ajustes.";
  if(e?.estado === 429) return "Sin crédito o demasiadas peticiones. Espera y reintenta.\n\n" + (e.message || "");
  if(e?.estado === 529) return "Los servidores de Anthropic están saturados. Reintenta en unos segundos.";
  const m = e?.message || String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return "No se pudo contactar a api.anthropic.com. Revisa tu conexión.";
  return m;
}

function dibujarTurno(t, chat){
  const el = document.createElement("div");
  el.className = "turno " + (t.rol === "user" ? "mio" : "suyo");

  const f = document.createElement("div");
  f.className = "firma";
  f.append(document.createTextNode(t.rol === "user" ? "Tú" : "Nexo"));
  if(t.skill && t.skill !== "ninguna"){
    const i = document.createElement("span");
    i.className = "insignia";
    i.textContent = skillDe(t.skill).nombre.replace(/^\S+\s/, "");
    f.append(i);
  }
  el.append(f);

  if(t.rol === "user"){
    if(t.adjuntos?.length){
      const cont = document.createElement("div");
      cont.className = "adjuntos";
      for(const a of t.adjuntos) cont.append(fichaAdjunto(a));
      el.append(cont);
    }

    d.className = "dicho";
    d.innerHTML = md(t.texto || "");
    el.append(d);
    if(!t.muestra) el.append(mandos(t, chat));
    return el;
  }

  if(t.razonamiento){
    const det = document.createElement("details");
    det.className = "razonando";
    const s = document.createElement("summary");
    s.textContent = "Razonamiento";
    const c = document.createElement("div");
    c.className = "txt"; c.textContent = t.razonamiento;
    det.append(s, c);
    el.append(det);
  }
  if(t.svg){
    const marco = document.createElement("div");
    marco.className = "lienzo";
    marco.style.cssText = "background:var(--lienzo);border:1px solid var(--linea);border-radius:12px;padding:10px";
    const limpio = sanearSVG(t.svg);
    if(limpio) marco.innerHTML = limpio;
    el.append(marco);
  }
  if(t.texto){
    const d = document.createElement("div");
    d.className = "dicho";
    d.innerHTML = md(t.texto);
    el.append(d);
  }
  if(t.fuentes?.length){
    const fu = document.createElement("div");
    fu.className = "fuentes";
    const cab = document.createElement("div");
    cab.className = "cab";
    cab.textContent = "Fuentes consultadas (" + t.fuentes.length + ")";
    fu.append(cab);
    const vistos = new Set();
    for(const s of t.fuentes){
      if(vistos.has(s.url)) continue;
      vistos.add(s.url);
      const a = document.createElement("a");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "· " + s.titulo;
      fu.append(a);
    }
    el.append(fu);
  }
  if(t.error){

    n.className = "nota";
    n.textContent = resumenUso(t.uso);
    el.append(n);
  }
  if(!t.muestra) el.append(mandos(t, chat));
  return el;

function fichaAdjunto(a){
  if(a.tipo === "application/pdf"){
    const d = document.createElement("div");
    d.className = "doc";
    const i = document.createElement("span"); i.textContent = "📄";
    const n = document.createElement("span"); n.textContent = a.nombre || "documento.pdf";
    d.append(i, n);
    return d;
  }
  const im = document.createElement("img");
  im.src = "data:" + a.tipo + ";base64," + a.datos;
  im.alt = a.nombre || "adjunto";
  return im;
}

function resumenUso(u){
  const p = MODELOS[cfg.modelo]?.precio;
  const partes = ["↑ " + (u.entrada || 0).toLocaleString("es"), "↓ " + (u.salida || 0).toLocaleString("es")];
  if(motor === "api" && p){
    const costo = ((u.entrada || 0) * p[0] + (u.salida || 0) * p[1]) / 1e6;
    partes.push("≈ US$ " + costo.toFixed(costo < 0.01 ? 4 : 3));
  }
  return partes.join("   ·   ");
}

function mandos(t, chat){
  const barra = document.createElement("div");

  return barra;
}

/* ═══════════════ Enviar ═══════════════ */

async function enviar(){
  if(corriendo) return;
  let pregunta = texto.value.trim();
  if(!pregunta && !adjuntos.length) return;
  if(motor === "api" && !cfg.clave){ abrirAjustes(); $("#inClave").focus(); return; }

  const skill = skillDe(cfg.skill);
  if(skill.envoltura && pregunta) pregunta = skill.envoltura(pregunta);

  let chat = chatActual();
  if(!chat){
    chat = {id:nid(), titulo:"Sin título", creado:Date.now(), resumen:"", turnos:[]};
    chats.unshift(chat);
    activo = chat.id;
  }
  if(!chat.turnos.length){
    const base = texto.value.trim() || "Imagen";
    chat.titulo = base.slice(0, 42) + (base.length > 42 ? "…" : "");
  }

  const imagenes = adjuntos.filter(a => a.tipo.startsWith("image/")).map(a => a.archivo);
  const mio = {rol:"user", texto:pregunta, adjuntos:adjuntos.map(a => ({tipo:a.tipo, nombre:a.nombre, datos:a.datos}))};
  chat.turnos.push(mio);

  texto.value = ""; crecer();
  adjuntos = []; pintarPrevios();
  muestraVisible = false;
  pintarHilo(); pintarLista();

  await conversar(chat, imagenes);
  guardar(chat);
  pintarLista(); actualizarAguja();
}

async function conversar(chat, imagenes){
  await resumirSiHaceFalta(chat);

  const turno = {rol:"assistant", texto:"", razonamiento:"", fuentes:[], skill:cfg.skill, uso:{entrada:0, salida:0}};
  chat.turnos.push(turno);

  const el = document.createElement("div");
  el.className = "turno suyo";
  el.innerHTML = '<div class="firma">Nexo</div>';
  const zona = document.createElement("div");
  zona.style.cssText = "display:flex;flex-direction:column;gap:8px";
  const espera = document.createElement("div");
  espera.className = "pensando";
  espera.innerHTML = '<span class="barrido"></span><span>pensando</span>';
  const reloj = espera.querySelector("span:last-child");
  zona.append(espera);
  el.append(zona);
  columna.append(el);
  alFondo(true);

  const desde = Date.now();
  const tic = setInterval(() => {
    if(!turno.texto) reloj.textContent = "pensando · " + Math.round((Date.now() - desde) / 1000) + "s";
  }, 1000);

  let ultimo = 0, encolado = false;
  const repintar = (r, forzar) => {
    const ahora = Date.now();
    if(!forzar && ahora - ultimo < 90){
      if(!encolado){ encolado = true; setTimeout(() => { encolado = false; repintar(r, true); }, 100); }
      return;
    }
    ultimo = ahora;
    zona.textContent = "";
    if(r.razonamiento && cfg.razonar){
      const det = document.createElement("details");
      det.className = "razonando";
      det.open = !r.texto;
      const s = document.createElement("summary"); s.textContent = "Razonamiento";
      const c = document.createElement("div"); c.className = "txt"; c.textContent = r.razonamiento;
      det.append(s, c);
      zona.append(det);
    }
    if(r.texto){
      const d = document.createElement("div");
      d.className = "dicho";
      d.innerHTML = md(r.texto);
      zona.append(d);
    }else{
      zona.append(espera);
    }
    alFondo();
  };

  const mando = new AbortController();
  corriendo = mando;
  $("#btParar").hidden = false;
  $("#btEnviar").disabled = true;

  try{
    const r = await responder({
      turnos: historial(chat, chat.turnos.length - 1),
      sistema: sistemaCompleto(),
      imagenes, senal: mando.signal,
      aviso: res => { Object.assign(turno, {texto:res.texto, razonamiento:res.razonamiento}); repintar(res); }
    });
    Object.assign(turno, {
      texto:r.texto, razonamiento:r.razonamiento, fuentes:r.fuentes,
      bloques:r.bloques, uso:r.uso || turno.uso
    });
  }catch(e){
    if(e?.code === "cancelled" || e?.name === "AbortError"){
      if(!turno.texto){ chat.turnos.pop(); el.remove(); }
    }else{
      turno.texto = e?.text || turno.texto;
      turno.error = copiaError(e);
    }
  }finally{
    clearInterval(tic);
    corriendo = null;
    $("#btParar").hidden = true;
    $("#btEnviar").disabled = false;
    if(chat.turnos.includes(turno)) el.replaceWith(dibujarTurno(turno, chat));
    alFondo();
    texto.focus();
  }
}

async function regenerar(t, chat){
  if(corriendo || !chat) return;
  const i = chat.turnos.indexOf(t);
  if(i < 1) return;
  chat.turnos.length = i;
  pintarHilo();
  await conversar(chat, []);
  guardar(chat); pintarLista();
}

function editar(t, chat){
  if(corriendo || !chat) return;
  const i = chat.turnos.indexOf(t);
  if(i < 0) return;
  texto.value = t.texto || "";
  adjuntos = (t.adjuntos || []).map(a => Object.assign({}, a));
  chat.turnos.length = i;
  guardar(chat); pintarHilo(); pintarPrevios(); crecer();
  texto.focus();
}

function borrarDesde(t, chat){
  if(corriendo || !chat) return;
  const i = chat.turnos.indexOf(t);
  if(i < 0) return;
  chat.turnos.length = i;
  guardar(chat); pintarHilo(); pintarLista(); actualizarAguja();
}

/* ═══════════════ ESTUDIO DE IMÁGENES ═══════════════ */

function recetaDibujo(){
  const est = ESTILOS.find(e => e.id === cfg.estilo) || ESTILOS[0];
  const fmt = FORMATOS.find(f => f.id === cfg.formato) || FORMATOS[0];
  const paleta = ($("#paleta").value || "").trim();
  return `Dibuja con SVG. Devuelves UNA imagen SVG y absolutamente nada más.

Reglas:
- La respuesta empieza en "<svg" y termina en "</svg>". Sin explicaciones ni bloques de código.
- viewBox="${fmt.caja}" y xmlns="http://www.w3.org/2000/svg".
- Nada de <script>, <foreignObject>, <image> ni recursos externos: todo autocontenido.
- Construye con rect, circle, ellipse, path, polygon y degradados (linearGradient, radialGradient).
- Composición con fondo, plano medio y primer plano. Entre 40 y 200 elementos según la escena.
- Si hay texto, va en <text> con familias genéricas (sans-serif, serif).

Estilo: ${est.receta}.
${paleta ? "Paleta: " + paleta + ".\n" : ""}
Lo que hay que dibujar: `;
}

async function dibujarObra(){
  if(corriendo) return;
  const idea = $("#prompt").value.trim();
  if(!idea) return;
  if(motor === "api" && !cfg.clave){ abrirAjustes(); $("#inClave").focus(); return; }

  const mando = new AbortController();
  corriendo = mando;
  $("#btPararImg").hidden = false;
  $("#btDibujar").disabled = true;

  const taller = $("#taller");
  const cargando = document.createElement("div");
  cargando.className = "taller-vacio";
  cargando.innerHTML = '<div class="pensando" style="justify-content:center"><span class="barrido"></span><span>dibujando</span></div>';
  const reloj = cargando.querySelector("span:last-child");
  taller.prepend(cargando);
  const desde = Date.now();
  const tic = setInterval(() => { reloj.textContent = "dibujando · " + Math.round((Date.now() - desde) / 1000) + "s"; }, 1000);

  try{
    const r = await responder({
      turnos: [{role:"user", content:[{type:"text", text:recetaDibujo() + idea}]}],
      sistema: "Eres un ilustrador que dibuja con SVG y no escribe nada más.",
      senal: mando.signal, aviso: () => {}
    });
    const limpio = sanearSVG(r.texto);
    if(!limpio) throw new Error("No devolvió un SVG que se pueda dibujar. Prueba a describirlo de otra forma.");
    obras.unshift({id:nid(), svg:limpio, prompt:idea, estilo:cfg.estilo, formato:cfg.formato, cuando:Date.now()});
    obras = obras.slice(0, 20);   // los SVG pesan: se guarda una galería corta
    escribir("nexo.obras", obras);
  }catch(e){
    if(e?.code !== "cancelled" && e?.name !== "AbortError"){
      const a = document.createElement("div");
      a.className = "alerta";
      a.innerHTML = "<b>No salió</b>" + esc(copiaError(e));
      taller.prepend(a);
      setTimeout(() => a.remove(), 9000);
    }
  }finally{
    clearInterval(tic);
    cargando.remove();
    corriendo = null;
    $("#btPararImg").hidden = true;
    $("#btDibujar").disabled = false;
    pintarTaller();
  }
}

function pintarTaller(){
  const taller = $("#taller");
  taller.textContent = "";
  if(!obras.length){
    const v = document.createElement("div");
    v.className = "taller-vacio";
    v.textContent = "Aquí van a aparecer tus imágenes. Describe lo que quieras a la izquierda, elige un estilo y dale a Dibujar.";
    taller.append(v);
    return;
  }
  const g = document.createElement("div");
  g.className = "galeria";
  for(const o of obras){
    const caja = document.createElement("div");
    caja.className = "obra";
    const lz = document.createElement("div");
    lz.className = "lienzo";
    const limpio = sanearSVG(o.svg);
    if(limpio) lz.innerHTML = limpio;
    const datos = document.createElement("div");
    datos.className = "datos";
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = o.prompt;
    const barra = document.createElement("div");
    barra.className = "barra";
    const add = (rot, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn chico"; b.textContent = rot;
      b.onclick = fn;
      barra.append(b);
    };
    add("SVG", () => guardarArchivo(nombreArchivo(o.prompt) + ".svg", o.svg, "image/svg+xml"));
    add("PNG", async ev => {
      ev.target.disabled = true;
      try{ guardarArchivo(nombreArchivo(o.prompt) + ".png", await svgAPng(o.svg), "image/png"); }catch(e){}
      ev.target.disabled = false;
    });
    add("Otra", () => {
      $("#prompt").value = o.prompt;
      cfg.estilo = o.estilo; cfg.formato = o.formato; guardarCfg(); pintarFichas();
      dibujarObra();
    });
    add("Borrar", () => {
      obras = obras.filter(x => x.id !== o.id);
      escribir("nexo.obras", obras);
      pintarTaller();
    });
    datos.append(desc, barra);
    caja.append(lz, datos);
    g.append(caja);
  }
  taller.append(g);
}

function pintarFichas(){
  const hacer = (cont, items, actual, alElegir) => {
    cont.textContent = "";
    for(const it of items){
      const b = document.createElement("button");
      b.type = "button"; b.className = "ficha"; b.textContent = it.nombre;
      b.setAttribute("aria-pressed", String(it.id === actual));
      b.onclick = () => { alElegir(it.id); guardarCfg(); pintarFichas(); };
      cont.append(b);
    }
  };
  hacer($("#fichasEstilo"), ESTILOS, cfg.estilo, v => cfg.estilo = v);
  hacer($("#fichasFormato"), FORMATOS, cfg.formato, v => cfg.formato = v);
}

/* ═══════════════ Lista de conversaciones ═══════════════ */

function guardar(chat){
  chat.actualizado = Date.now();
  escribir("nexo.chats", chats.slice(0, 40));
  if(db){
    const {id, ...cuerpo} = chat;
    db.doc("chats/" + id).set(cuerpo).catch(() => {});
  }
}

function pintarLista(){
  const lista = $("#lista");
  const filtro = ($("#busca").value || "").trim().toLowerCase();
  const dentro = c => (c.titulo + " " + c.turnos.map(t => t.texto || "").join(" ")).toLowerCase().includes(filtro);
  const vistos = filtro ? chats.filter(dentro) : chats;

  lista.textContent = "";
  if(!vistos.length){
    const v = document.createElement("div");
    v.className = "vacio";
    v.textContent = filtro ? "Nada coincide con «" + filtro + "»." : "Todavía no hay conversaciones.";
    lista.append(v);
    return;
  }
  for(const c of vistos){
    const fila = document.createElement("button");
    fila.type = "button"; fila.className = "hebra";
    fila.setAttribute("aria-current", String(c.id === activo));
    const rot = document.createElement("span");
    rot.className = "rotulo"; rot.textContent = c.titulo;
    rot.title = c.titulo + " (doble clic para renombrar)";
    rot.ondblclick = ev => { ev.stopPropagation(); renombrar(c, rot); };

    const x = document.createElement("span");
    x.className = "cerrar"; x.setAttribute("role", "button"); x.tabIndex = 0; x.textContent = "✕";
    const borrar = ev => {
      ev.stopPropagation();
      chats = chats.filter(y => y.id !== c.id);
      escribir("nexo.chats", chats);
      if(db) db.doc("chats/" + c.id).delete().catch(() => {});
      if(activo === c.id) activo = chats[0]?.id || null;
      pintarLista(); pintarHilo();
    };
    x.onclick = borrar;
    x.onkeydown = ev => { if(ev.key === "Enter" || ev.key === " ") borrar(ev); };

    fila.append(rot, x);
    fila.onclick = () => {
      if(innerWidth <= 840) $("#riel").classList.add("plegado");
      if(c.id === activo) return;
      activo = c.id; muestraVisible = false;
      pintarLista(); pintarHilo();
    };
    lista.append(fila);
  }
}

function renombrar(c, rot){
  const campo = document.createElement("input");
  campo.type = "text"; campo.className = "campo-busca"; campo.value = c.titulo;
  campo.style.cssText = "flex:1;padding:3px 7px;font-size:13.5px;min-width:0";
  let cerrado = false;
  const fijar = () => {
    if(cerrado) return;
    cerrado = true;
    c.titulo = campo.value.trim() || c.titulo;
    guardar(c); pintarLista();
  };
  campo.onblur = fijar;
  campo.onclick = e => e.stopPropagation();
  campo.onkeydown = e => {
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); fijar(); }
    if(e.key === "Escape"){ cerrado = true; pintarLista(); }
  };
  rot.replaceWith(campo);
  campo.focus(); campo.select();
}

/* ═══════════════ Adjuntos ═══════════════ */

function sumarArchivos(lista){
  for(const f of Array.from(lista)){
    const esPDF = f.type === "application/pdf";
    if(!f.type.startsWith("image/") && !esPDF) continue;
    if(esPDF && motor !== "api"){ avisarBreve("Los PDFs solo se leen en el modo local con clave de API."); continue; }
    if(f.size > (esPDF ? 25 : 5) * 1048576){ avisarBreve("«" + f.name + "» pesa demasiado."); continue; }
    if(adjuntos.length >= 5) break;
    const lec = new FileReader();
    lec.onload = () => {
      adjuntos.push({tipo:f.type, nombre:f.name, archivo:f, datos:String(lec.result).split(",")[1]});
      pintarPrevios();
    };
    lec.readAsDataURL(f);
  }
}

function pintarPrevios(){
  const cont = $("#previos");
  cont.textContent = "";
  adjuntos.forEach((a, i) => {
    const d = document.createElement("div");
    d.className = "previo";
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "✕"; x.title = "Quitar";
    x.onclick = () => { adjuntos.splice(i, 1); pintarPrevios(); };
    d.append(fichaAdjunto(a), x);
    cont.append(d);
  });
}

function avisarBreve(msg){
  const a = document.createElement("div");
  a.className = "alerta";
  a.innerHTML = "<b>Atención</b>" + esc(msg);
  columna.append(a);
  alFondo(true);
  setTimeout(() => a.remove(), 7000);
}

/* ═══════════════ Voz ═══════════════ */

function prepararVoz(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  const bt = $("#btVoz");
  if(!R) return;
  bt.hidden = false;
  const rec = new R();
  rec.lang = "es-ES"; rec.continuous = true; rec.interimResults = true;
  let oyendo = false, base = "";
  rec.onresult = ev => {
    let firme = "", provi = "";
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) firme += t; else provi += t;
    }
    if(firme) base = (base + " " + firme).trim();
    texto.value = (base + " " + provi).trim();
    crecer();
  };
  const parar = () => { oyendo = false; bt.textContent = "Dictar"; try{ rec.stop(); }catch(e){} };
  rec.onerror = () => parar();
  rec.onend = () => { if(oyendo) parar(); };
  bt.onclick = () => {
    if(oyendo){ parar(); return; }
    base = texto.value.trim(); oyendo = true; bt.textContent = "● Grabando";
    try{ rec.start(); }catch(e){ parar(); }
  };
}

/* ═══════════════ Ajustes ═══════════════ */

function abrirAjustes(){
  $("#areaInstr").value = cfg.instrucciones;
  $("#inClave").value = cfg.clave;
  $("#selModelo").value = cfg.modelo;
  $("#inMaxTokens").value = cfg.maxTokens;
  $("#chkBuscar").checked = cfg.buscar;
  $("#chkRazonar").checked = cfg.razonar;
  $("#chkCompactar").checked = cfg.compactar;
  $("#velo").dataset.abierto = "1";
}
const cerrarAjustes = () => { $("#velo").dataset.abierto = "0"; };

function guardarAjustes(){
  cfg.instrucciones = $("#areaInstr").value.trim() || INSTRUCCIONES_FABRICA;
  cfg.clave = $("#inClave").value.trim();
  cfg.modelo = $("#selModelo").value;
  cfg.maxTokens = Math.max(1024, Math.min(128000, +$("#inMaxTokens").value || 32000));
  cfg.buscar = $("#chkBuscar").checked;
  cfg.razonar = $("#chkRazonar").checked;
  cfg.compactar = $("#chkCompactar").checked;
  nivelMax = 3;
  guardarCfg(); cerrarAjustes(); actualizarPie();
}

function crecer(){
  texto.style.height = "auto";
  texto.style.height = Math.min(texto.scrollHeight, 190) + "px";
}

function verVista(cual){
  const chat = cual === "chat";
  $("#vistaChat").hidden = !chat;
  $("#vistaEstudio").hidden = chat;
  $("#tabChat").setAttribute("aria-selected", String(chat));
  $("#tabEstudio").setAttribute("aria-selected", String(!chat));
  $("#selSkill").style.display = chat ? "" : "none";
  $("#btNueva").style.display = chat ? "" : "none";
  $("#busca").style.display = chat ? "" : "none";
  $("#lista").style.display = chat ? "" : "none";
  if(!chat) pintarTaller();
}

function actualizarPie(){
  const p = $("#pie");
  if(motor === "api"){
    p.textContent = cfg.clave
      ? "Modo local · " + (MODELOS[cfg.modelo]?.nombre || cfg.modelo) + (cfg.buscar ? " · con búsqueda web" : "")
      : "Falta tu clave de la API — ponla en Ajustes para empezar.";
  }else{
    const t = ["Usa tu cuenta de Claude"];
    if(!puedeImagenes) t.push("sin lectura de imágenes");
    t.push("no navega por internet");
    p.textContent = t.join(" · ");
  }
}

async function bajarConversacion(){
  const c = chatActual();
  if(!c || !c.turnos.length) return;
  const cuerpo = "# " + c.titulo + "\n\n" + c.turnos.map(t =>
    t.rol === "user" ? "## Tú\n\n" + (t.texto || "")
    : t.svg ? "## Nexo\n\n```svg\n" + t.svg + "\n```"
    : t.error ? "## Nexo\n\n> " + t.error
    : "## Nexo\n\n" + (t.texto || "")).join("\n\n");
  await guardarArchivo(nombreArchivo(c.titulo) + ".md", cuerpo, "text/markdown");
}

/* ═══════════════ Arranque ═══════════════ */

function montar(){
  const sel = $("#selSkill");
  for(const s of SKILLS){
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.nombre;
    sel.append(o);
  }
  sel.value = cfg.skill;
  const selM = $("#selModelo");
  for(const [id, m] of Object.entries(MODELOS)){
    const o = document.createElement("option");
    o.value = id; o.textContent = m.nombre;
    selM.append(o);
  }
  $("#selTier").value = cfg.tier;

  sel.onchange = () => { cfg.skill = sel.value; guardarCfg(); };
  $("#selTier").onchange = () => { cfg.tier = $("#selTier").value; guardarCfg(); };
  $("#tabChat").onclick = () => verVista("chat");
  $("#tabEstudio").onclick = () => verVista("estudio");
  $("#btRiel").onclick = () => $("#riel").classList.toggle("plegado");
  $("#btNueva").onclick = () => { activo = null; muestraVisible = false; pintarLista(); pintarHilo(); texto.focus(); };
  $("#busca").oninput = pintarLista;
  $("#btEnviar").onclick = enviar;
  $("#btParar").onclick = () => corriendo?.abort();
  $("#btPararImg").onclick = () => corriendo?.abort();
  $("#btDibujar").onclick = dibujarObra;
  $("#btBajar").onclick = bajarConversacion;
  $("#btAdjuntar").onclick = () => $("#ficheros").click();
  $("#ficheros").onchange = ev => { sumarArchivos(ev.target.files); ev.target.value = ""; };
  $("#btAjustes").onclick = abrirAjustes;
  $("#btCerrar").onclick = cerrarAjustes;
  $("#btGuardar").onclick = guardarAjustes;
  $("#btFabrica").onclick = () => { $("#areaInstr").value = INSTRUCCIONES_FABRICA; };
  $("#velo").onclick = ev => { if(ev.target === $("#velo")) cerrarAjustes(); };

  texto.addEventListener("input", crecer);
  texto.addEventListener("keydown", ev => { if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); enviar(); } });
  texto.addEventListener("paste", ev => {
    const f = Array.from(ev.clipboardData?.files || []);
    if(f.length){ ev.preventDefault(); sumarArchivos(f); }
  });
  $("#prompt").addEventListener("keydown", ev => {
    if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); dibujarObra(); }
  });

  const caja = $("#caja");
  ["dragenter","dragover"].forEach(n => caja.addEventListener(n, ev => { ev.preventDefault(); caja.classList.add("soltar"); }));
  ["dragleave","drop"].forEach(n => caja.addEventListener(n, ev => { ev.preventDefault(); caja.classList.remove("soltar"); }));
  caja.addEventListener("drop", ev => sumarArchivos(ev.dataTransfer.files));

  columna.addEventListener("click", ev => {
    const b = ev.target.closest(".copiar-codigo");
    if(!b) return;
    const cod = b.closest(".bloque-codigo").querySelector("code").textContent;
    navigator.clipboard.writeText(cod).then(
      () => { b.textContent = "copiado"; setTimeout(() => b.textContent = "copiar", 1400); },
      () => { b.textContent = "no se pudo"; setTimeout(() => b.textContent = "copiar", 1400); });
  });

  document.addEventListener("keydown", ev => {
    if(ev.key === "Escape" && $("#velo").dataset.abierto === "1") cerrarAjustes();
  });

  if(innerWidth <= 840) $("#riel").classList.add("plegado");
  prepararVoz();
  pintarFichas();
  verVista("chat");
  pintarLista();
  pintarHilo();
  crecer();

  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}

/* Las capacidades llegan por promesa, nunca en la primera pasada del
   script: la página se dibuja sin ellas y se encienden al llegar. */
async function encender(){
  const pulso = $("#pulso");

  if(window.claude?.use){
    sample = await claude.use("sample").catch(() => null);
    if(sample){
      motor = "sample";
      const lim = await sample.limits().catch(() => null);
      puedeImagenes = !!lim?.images;
      $("#btAdjuntar").hidden = !puedeImagenes;
      if(puedeImagenes && lim.images.mediaTypes) $("#ficheros").accept = lim.images.mediaTypes.join(",");
      descargas = await claude.use("downloads").catch(() => null);
      db = await claude.use("db").catch(() => null);
      if(db){
        try{
          const snap = await db.collection("chats").orderBy("actualizado", "desc").limit(50).get();
          const remotos = snap.docs.map(d => Object.assign({id:d.id, resumen:"", turnos:[]}, d.data()));
          if(remotos.length){ chats = remotos; pintarLista(); }
        }catch(e){}
      }
      $("#secApi").hidden = true;
      pulso.className = "pulso viva";
      actualizarPie(); pintarHilo();
      return;
    }
  }

  // Sin runtime de Claude: archivo local, se usa la clave de la API.
  motor = "api";
  puedeImagenes = true;
  $("#btAdjuntar").hidden = false;
  $("#ficheros").accept = "image/png,image/jpeg,image/gif,image/webp,application/pdf";
  pulso.className = "pulso " + (cfg.clave ? "viva" : "muerta");
  actualizarPie(); pintarHilo();
  if(!cfg.clave) abrirAjustes();
}

montar();
encender();
</script>
